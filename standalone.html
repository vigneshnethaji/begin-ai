    ml: { title: 'Microsoft Learn: How ML.NET works', url: 'https://learn.microsoft.com/en-us/dotnet/machine-learning/how-does-mldotnet-work', note: 'See how data becomes a model and how a .NET application uses it. You do not need to run this guide yet.' },

  };
  const lessons = [
    {
      id: 'ai-features', conceptId: 'ai-feature', title: 'What makes a feature an AI feature?', short: 'Recognize an AI feature', minutes: 8, prerequisites: [],
      objective: 'Tell the difference between code that follows a rule and a model that learns patterns.',
      summary: 'Start with a support inbox, not a new framework.',
      definition: ['AI', 'Software that uses models to recognize patterns or generate an output. In this course, we focus on models learned from examples.'],
      paragraphs: [
        'Imagine you are building SupportDesk, an ASP.NET Core application where customers ask for help. A message arrives: “I paid twice. Can you return one payment?” Your first feature is to send that message to the right team.',
        'You could write a C# rule: if the message contains “refund”, send it to Billing. You chose the word and wrote the decision yourself. That is ordinary application logic.',
        'Another approach uses a model: a reusable component that has learned patterns from examples. It could suggest Billing even when the customer never writes “refund”. This is where machine learning, a common approach to AI, can help.',
        'Your .NET application still receives the request, validates it, checks permissions, and saves the result. The model supplies one suggested answer inside that application. It does not replace the application.'
      ],
      takeaway: 'Ask how the decision is made. A page with a chat bubble is not automatically AI.',
      example: {
        title: 'One message. Two ways to route it.',
        input: 'I paid twice. Can you return one payment?',
        paths: [
          { title: 'A rule you wrote', detail: 'Contains “refund”? No.', result: 'General queue', tone: 'neutral' },
          { title: 'A learned model', detail: 'Recognizes a payment problem.', result: 'Billing suggestion', tone: 'accent' }
        ],
        explanation: 'The rule checks an exact condition. A model may recognize a similar meaning. Its answer can still be wrong, so a staff member can correct it. The model result shown here is an authored teaching example.'
      },
      experiment: 'sort-features',
      exercise: 'Choose which implementation uses a learned model. Notice that the technology behind the decision matters more than the appearance of the screen.',
      quiz: { question: 'Which feature uses a learned model?', options: [
        { text: 'An API rejects a request with an empty email address.', why: 'This is a condition a developer can specify exactly. Validation does not require a learned model.' },
        { text: 'A service suggests a support category using patterns learned from past messages.', why: 'Exactly. The decision uses patterns learned from examples, rather than only conditions you wrote.' },
        { text: 'A Blazor page displays a chat bubble.', why: 'A chat bubble is a UI element. It could display a fixed message, a human reply, or a model response.' }
      ], answer: 1 },
      dotnet: { title: 'Keep the application. Add a suggestion.', text: 'Think of the model as a dependency of your application service. The API handles HTTP; a service requests a suggestion; your code decides what happens next.', code: 'Customer message\n    ↓\nASP.NET Core endpoint → Validate request\n    ↓\nApplication service → Ask model for a suggestion\n    ↓\nBlazor inbox → Staff member reviews the category', label: 'Application flow · conceptual example', contribution: 'You can identify where a model might help the SupportDesk inbox.', next: 'Decide which responsibilities should stay ordinary C#.' },
      reference: 'overview'
    },
    {
      id: 'rules', conceptId: 'deterministic-rule', title: 'When ordinary C# rules are enough', short: 'Keep exact rules in C#', minutes: 10, prerequisites: ['ai-features'],
      objective: 'Choose an explicit C# rule when the requirement has an exact, testable answer.',
      summary: 'Reliable AI features begin with reliable ordinary code.',
      definition: ['Deterministic', 'Given the same input and relevant state, the code follows the same steps and produces the same result.'],
      paragraphs: [
        'SupportDesk must reject an empty message. You know precisely what “empty” means: null, no characters, or only spaces. You do not need examples of past messages to decide this.',
        'Write that requirement as ordinary C#. The result should be predictable and easy to test. Checking permissions, calculating totals, and enforcing a refund policy also belong in code with explicit rules.',
        'A keyword rule can be a useful first version of message routing. It is cheap and easy to explain. But “refund” and “return my payment” have different characters even though they may express the same request.',
        'Do not add AI because a rule has a limitation. First ask whether the limitation matters. A few categories with stable wording might need only a maintained rule. Many variations of natural language may justify a model.'
      ],
      takeaway: 'Use a model for ambiguity. Use explicit code for requirements that must be enforced exactly.',
      example: { title: 'An empty message has an exact answer.', input: 'Message: three spaces', paths: [
        { title: 'Your requirement', detail: 'A message must contain visible text.', result: 'Reject the request', tone: 'neutral' },
        { title: 'Your C# implementation', detail: 'string.IsNullOrWhiteSpace(message)', result: 'true', tone: 'accent' }
      ], explanation: 'There is nothing to predict. A unit test can prove this condition for empty strings, spaces, and real messages. A model would add uncertainty to an exact requirement.' },
      experiment: 'keyword',
      exercise: 'Change a message and the keyword. Watch which queue an exact rule chooses. Try “Please return my payment” with the keyword “refund”.',
      quiz: { question: 'Which responsibility should stay an explicit rule?', options: [
        { text: 'Guessing the subject of an unfamiliar customer message.', why: 'Unfamiliar wording can be ambiguous. A learned model might help here, with evaluation and review.' },

        { text: 'Checking that the signed-in user is allowed to issue a refund.', why: 'Correct. Authorization is an enforceable application rule. A model suggestion must never bypass it.' }
      ], answer: 2 },
      dotnet: { title: 'Start with a baseline you can test.', text: 'A baseline is the simplest working approach you will compare a later model against. Our first desktop lab builds this routing rule as a console app. No AI account is needed.', code: 'static string Route(string message)\n{\n    if (string.IsNullOrWhiteSpace(message))\n        return "Rejected";\n\n    return message.Contains("refund",\n        StringComparison.OrdinalIgnoreCase)\n        ? "Billing"\n        : "General";\n}', label: 'C# · extract from the runnable lab', contribution: 'You establish input validation and a predictable routing baseline.', next: 'Learn what goes inside the model component.', lab: true },

    },
    {
      id: 'models', conceptId: 'model', title: 'What a model does', short: 'Understand a model', minutes: 9, prerequisites: ['rules'],
      objective: 'Identify a model’s input, its output, and the application decisions outside its responsibility.',
      summary: 'A model is a component with an input and an output.',
      definition: ['Model', 'A reusable component containing learned patterns. Your application gives it input and receives a prediction or generated output.'],
      paragraphs: [
        'In C#, you already work with components through contracts. A tax service accepts an amount and returns a calculation. You can use the service without knowing every internal step.',

      ], explanation: 'The category is a fixed illustrative response here. A real integration would also handle errors, unsupported output, and slow responses. It would not send private account details without an appropriate reason.' },
      experiment: 'model-boundary',
      exercise: 'Choose a message and inspect the input, illustrative model output, and application responsibility. The examples do not run a real model.',

      dotnet: { title: 'An interface makes the boundary visible.', text: 'This is an illustrative contract, not an implemented model. Later, a real ML.NET model or provider adapter can sit behind a service boundary. Cancellation and validation remain application concerns.', code: 'public record CategorySuggestion(string Category);\n\npublic interface IMessageClassifier\n{\n    Task<CategorySuggestion> SuggestAsync(\n        string message,\n        CancellationToken cancellationToken);\n}', label: 'C# · illustrative contract', contribution: 'You separate a category suggestion from saving or acting on a request.', next: 'Understand how the model gets its behavior before your API calls it.' },
      reference: 'ml'

    {
      id: 'training', conceptId: 'training-vs-inference', title: 'Training and using a model are different', short: 'Training vs. using a model', minutes: 10, prerequisites: ['models'],
      objective: 'Distinguish learning from examples during training from producing a result during inference.',
      summary: 'The learning happens in one process. Your app uses the result in another.',
      definition: ['Inference', 'Using a trained model to produce an output for an input. It does not mean that the model is being retrained.'],
      paragraphs: [
        'Suppose you have past support messages with categories chosen by staff. Each pair is a labelled example: message text plus the category you want the model to learn to predict.',
        'Training is a separate process that uses examples to adjust a model’s learned patterns. After training, you save a model artifact: a file or other reusable representation of the learned model.',

      ],
      takeaway: 'Training changes learned patterns. Inference uses the current learned patterns.',
      example: { title: 'Two processes, connected by a saved model.', input: 'Past examples: “refund please” → Billing; “password reset” → Account', paths: [
        { title: 'Training process', detail: 'Learn from labelled past examples.', result: 'Saved category model', tone: 'neutral' },
        { title: 'Application request', detail: 'New message → saved model.', result: 'Category prediction', tone: 'accent' }
      ], explanation: 'Saving corrected categories can improve a later dataset, but the model changes only when an appropriate update process runs. Training and inference can happen on different machines and at different times.' },
      experiment: 'training-sort',
      exercise: 'Sort the actions into training, inference, or collecting feedback. Look for whether learned patterns are changing, being used, or merely being recorded.',
      quiz: { question: 'A user changes a suggested category. What happens to the model automatically?', options: [
        { text: 'Nothing necessarily changes; storing feedback and retraining require an implemented process.', why: 'Correct. A UI correction is not a training run. You need a deliberate process to collect, review, train, and evaluate updates.' },
        { text: 'The model immediately learns the correction forever.', why: 'A correction changes application data. It does not automatically change the model’s learned patterns.' },
        { text: 'Every later HTTP request must now retrain the model.', why: 'Training and inference are separate. Your service usually reuses a trained model for requests.' }

      dotnet: { title: 'Separate the training tool from the web service.', text: 'Later in this course, an ML.NET console project trains a small classifier. Your application then loads the resulting model for inference. This outline describes responsibilities; it is not a runnable training sample yet.', code: 'SupportDesk.Training       // Console project\n  Read reviewed examples\n  Train and evaluate a model\n  Save model.zip\n\nSupportDesk.Api            // ASP.NET Core project\n  Load model.zip\n  Receive a new message\n  Return a category suggestion', label: 'Project responsibilities · conceptual outline', contribution: 'You know where training belongs and what a future feedback feature must do.', next: 'Check why a trained model can still make mistakes.' },
      reference: 'ml'
    },
    {
      id: 'predictions', conceptId: 'prediction-error', title: 'Why predictions can be wrong', short: 'Expect and measure mistakes', minutes: 12, prerequisites: ['training'],
      objective: 'Explain why a model prediction needs evaluation and an appropriate response to mistakes.',
      summary: 'A useful suggestion can still be an incorrect suggestion.',
      definition: ['Evaluation', 'Checking a model’s outputs against examples or criteria that tell you whether it is useful for your task.'],
      paragraphs: [
        'A support model learned from examples, not from every possible customer message. New wording, unclear requests, and patterns missing from training data can lead to a wrong category.',
        'Consider “My refund button crashes.” The word refund is about Billing, but the actual problem might be Technical. Even a person may need more context. The right design allows correction instead of treating the first suggestion as a fact.',
        'To evaluate a classifier, compare its predictions with reviewed categories on examples that were not used to train it. This helps reveal how it behaves on new data. Do not judge it only by examples it has already learned from.',
        'The cost of a mistake matters. A wrong inbox category might cause a short delay. An incorrect automatic refund changes money. Start with suggestions and human review; keep exact business rules in control of consequential actions.'

      takeaway: 'Measure errors on new examples, then design the application around their consequences.',
      example: { title: 'A plausible category can miss the actual problem.', input: 'My refund button crashes whenever I click it.', paths: [
        { title: 'Illustrative model output', detail: 'Focuses on the word “refund”.', result: 'Billing', tone: 'neutral' },
        { title: 'Reviewed category', detail: 'The customer reports a software failure.', result: 'Technical', tone: 'accent' }
      ], explanation: 'One failure does not make every model useless. It gives you a concrete case to include in evaluation and a reason to let staff change a suggestion.' },
      experiment: 'evaluate',
      exercise: 'Reveal five illustrative predictions, compare them with reviewed labels, and inspect the mistakes. These are authored examples, not a benchmark for a real model.',
      quiz: { question: 'How should you first evaluate your category model?', options: [
        { text: 'Run only the same messages used to train it.', why: 'That can hide poor behavior on new inputs. Keep reviewed examples separate for evaluation.' },
        { text: 'Accept every suggestion because the model has finished training.', why: 'Training produces a model, not a guarantee. New inputs and ambiguous messages can still cause errors.' },
        { text: 'Compare predictions with reviewed labels on held-out messages and inspect mistakes.', why: 'Correct. “Held-out” means set aside from training. Inspecting failures also tells you which safeguards the UI needs.' }

      dotnet: { title: 'Keep suggestions editable.', text: 'Use separate fields for the model suggestion and the category accepted by staff. This makes the decision visible and preserves evidence for later evaluation. The record below is an illustrative data shape.', code: 'public record ReviewedCategory(\n    string SuggestedCategory,\n    string AcceptedCategory,\n    string ReviewedBy);\n\n// SuggestedCategory: "Billing"\n// AcceptedCategory:  "Technical"\n// ReviewedBy:        "demo-agent"', label: 'C# · illustrative review record', contribution: 'You plan a reviewable suggestion instead of an irreversible automatic decision.', next: 'Choose the smallest suitable approach for each feature.' },
      reference: 'ml'

    {
      id: 'choose-approach', conceptId: 'approach-selection', title: 'Choose rules, machine learning, or an LLM', short: 'Choose the right approach', minutes: 12, prerequisites: ['predictions'],
      objective: 'Select a reasonable starting approach based on a feature’s output and need for exactness.',
      summary: 'Start with the requirement, then choose the tool.',
      definition: ['Large language model (LLM)', 'A model trained on large amounts of data to work with language and other supported inputs. It can generate text, such as a summary or a draft reply.'],
      paragraphs: [
        'You now have three useful starting points. Rules implement exact decisions you can specify. A traditional machine-learning classifier learns to choose a label from examples. A large language model can generate text and also perform tasks such as classification.',
        'For SupportDesk, message validation stays in C#. Category routing might start as a rule and later become a small ML.NET classifier when you have enough suitable labelled examples. Writing a draft reply is a language-generation task that may suit an LLM.',
        'These are starting choices, not rigid laws. An LLM can classify messages too, but cost, privacy, latency, data availability, and measured quality determine whether that is a better choice. A more capable model is not automatically a better application design.',
        'You can combine approaches: validate a request with rules, ask a model for a draft, and let a person approve it. A large language model is itself machine learning; we distinguish it here because building with an existing language model has different practical trade-offs from training a small classifier.'
      ],
      takeaway: 'Choose the simplest approach that meets the requirement and can be tested against it.',
      example: { title: 'Three jobs in the same application.', input: 'SupportDesk needs validation, routing, and draft replies.', paths: [
        { title: 'Exact requirement', detail: 'Reject an empty message.', result: 'C# rule', tone: 'neutral' },
        { title: 'Learn a category', detail: 'Route messages from reviewed examples.', result: 'Small classifier', tone: 'accent' },
        { title: 'Generate language', detail: 'Draft a reply for staff to review.', result: 'LLM', tone: 'accent' }
      ], explanation: 'The classifier choice assumes suitable labelled data and acceptable measured results. The LLM generates a proposal; staff review and application authorization still matter.' },
      experiment: 'choose',
      exercise: 'Choose a sensible first approach for three SupportDesk requirements. Read why each answer fits and where other approaches could make sense.',
      quiz: { question: 'Which design is the strongest starting point?', options: [
        { text: 'Use an LLM for validation, permission checks, and every other decision.', why: 'Exact validation and authorization belong in enforceable application code. A language model should not decide permissions.' },
        { text: 'Use rules for validation, evaluate a classifier for routing, and review LLM-generated drafts.', why: 'Correct. Each component has a clear job, and uncertain outputs get evaluation and review.' },
        { text: 'Never use models if an application already has C# services.', why: 'A model can be one component behind a service interface. Existing .NET architecture gives you a place to integrate it.' }

      dotnet: { title: 'Your first project milestone is a decision, not a framework.', text: 'Write a short decision for each proposed feature: input, required output, simplest approach, failure consequence, and proof it works. Then run the rules-baseline lab. Later units add ML.NET, Blazor, and provider integrations in that order.', code: 'Feature: Reject an empty message\nInput: Customer message text\nOutput: Accept or reject\nApproach: C# validation rule\nFailure: An empty request enters the queue\nProof: Tests for empty, spaces, and valid text', label: 'Engineering decision · worked example', contribution: 'You can justify the first three capabilities in the SupportDesk roadmap.', next: 'Complete the desktop rules lab, then continue into labelled data and ML.NET when those lessons are published.', lab: true },

  const stages = [
    { id: 'foundations', title: 'Foundations', outcome: 'Explain where AI belongs in a .NET application.', topics: lessons.map(x=>x.short), milestone: 'SupportDesk rules baseline', available: true },
    { id: 'first-mlnet-model', title: 'Data and your first ML.NET model', outcome: 'Train and evaluate a small category classifier.', topics: ['Rows, features, and labels', 'Good examples and bad data', 'Training and test splits', 'Your first ML.NET pipeline', 'Accuracy and mistake analysis', 'Save a model and call it from C#'], milestone: 'A measured message classifier' },
    { id: 'language-models', title: 'Language models in C#', outcome: 'Call a language model through a .NET service.', topics: ['Generated text and its limits', 'Tokens and context limits', 'A first provider call', 'Server-side credentials', 'Timeouts and cancellation', 'Streaming a response into Blazor'], milestone: 'A draft reply with a sample-response mode' },
    { id: 'reliable-outputs', title: 'Reliable prompts and outputs', outcome: 'Turn generated text into a validated feature.', topics: ['Instructions and message roles', 'Examples inside a prompt', 'Supplying useful context', 'Structured JSON and DTOs', 'Validation and refusal handling', 'Comparing prompt changes'], milestone: 'A validated ticket-summary feature' },
    { id: 'tools-actions', title: 'Tools and safe actions', outcome: 'Give a model narrowly scoped application capabilities.', topics: ['A tool is a callable function', 'Typed arguments', 'Tool selection versus execution', 'Authorization and approvals', 'Retries and duplicate actions', 'Audit trails and unknown results'], milestone: 'A reviewed ticket-lookup tool' },
    { id: 'semantic-search', title: 'Vectors and semantic search', outcome: 'Find related help articles by meaning.', topics: ['Vectors as float arrays', 'Similarity with a worked example', 'What embeddings represent', 'Creating and storing embeddings', 'Vector indexes', 'Filters and hybrid search'], milestone: 'Search across fictional help articles' },
    { id: 'document-answers', title: 'Answers grounded in documents', outcome: 'Build a RAG flow with inspectable evidence.', topics: ['Retrieval before generation', 'Parsing and chunking', 'Choosing useful evidence', 'Prompting with retrieved passages', 'Citations and unsupported answers', 'Testing retrieval separately'], milestone: 'An answer with source passages' },
    { id: 'production-retrieval', title: 'Production retrieval', outcome: 'Improve retrieval without crossing data boundaries.', topics: ['Retrieval evaluation sets', 'Ranking and reranking', 'Freshness and indexing', 'Document access and tenant filters', 'Prompt injection in documents', 'Tracing a bad answer'], milestone: 'A measured and permission-aware RAG service' },
    { id: 'agents-workflows', title: 'Agents and workflows', outcome: 'Choose controlled orchestration for multi-step work.', topics: ['A workflow versus an agent', 'State and memory', 'Bounded loops and budgets', 'Microsoft Agent Framework', 'MCP tools and resources', 'Approvals and recovery'], milestone: 'A bounded support-triage workflow' },
    { id: 'model-choices', title: 'More inputs and model choices', outcome: 'Choose the right input and hosting approach.', topics: ['Images and OCR', 'Speech and transcripts', 'Combining input types', 'Local model inference', 'ONNX and quantization basics', 'When fine-tuning is justified'], milestone: 'A reviewed attachment-processing feature' },

  ];

  <script>
(function(root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('./curriculum.js'));
  else root.AcademyCore = factory(root.AcademyContent);
})(typeof globalThis !== 'undefined' ? globalThis : this, function(content) {
  'use strict';
  const getLesson = id => content.lessons.find(x => x.id === id);
  function sanitizeProgress(input) {
    const state = { lessons: {}, labs: {} };
    if (!input || typeof input !== 'object' || Array.isArray(input)) return state;
    for (const lesson of content.lessons) {
      const entry = input.lessons?.[lesson.id];
      if (entry && typeof entry === 'object' && !Array.isArray(entry)) {
        state.lessons[lesson.id] = { read: entry.read === true, checked: entry.checked === true };
      }
    }
    if (input.labs?.[content.labId] === true) state.labs[content.labId] = true;
    return state;
  }
  function grade(id, choice) {
    const quiz = getLesson(id)?.quiz;
    if (!quiz || !Number.isInteger(choice) || !quiz.options[choice]) return { correct: false, explanation: 'Choose one of the available answers.' };
    return { correct: choice === quiz.answer, explanation: quiz.options[choice].why };
  }
  function recordAnswer(input, id, choice) {
    const state = sanitizeProgress(input);
    if (!getLesson(id)) return state;
    const entry = state.lessons[id] || { read: false, checked: false };
    state.lessons[id] = { ...entry, checked: entry.checked || grade(id, choice).correct };
    return state;
  }
  function nextLesson(input) {
    const state = sanitizeProgress(input);
    return content.lessons.find(x => !state.lessons[x.id]?.checked) || content.lessons[content.lessons.length - 1];
  }
  function missingPrerequisites(input, id) {
    const state = sanitizeProgress(input);
    return (getLesson(id)?.prerequisites || []).filter(x => !state.lessons[x]?.checked).map(getLesson);
  }
  function classifyRule(message, keyword) {
    if (!String(message).trim() || !String(keyword).trim()) return 'General';
    return String(message).toLowerCase().includes(String(keyword).trim().toLowerCase()) ? 'Billing' : 'General';
  }
  function readBackup(text) {
    if (new TextEncoder().encode(text).length > 2000000) throw new Error('Choose a backup smaller than 2 MB.');
    let backup;
    try { backup = JSON.parse(text); } catch { throw new Error('The file is not valid JSON. Choose an exported progress backup.'); }
    if (backup?.app !== 'dotnet-ai-workspace' || backup?.version !== 1) throw new Error('Choose a progress backup exported by this learning workspace.');
    if (!backup.progress || typeof backup.progress !== 'object' || Array.isArray(backup.progress)) throw new Error('The backup has no valid progress object.');
    return sanitizeProgress(backup.progress);
  }
  return { getLesson, sanitizeProgress, grade, recordAnswer, nextLesson, missingPrerequisites, classifyRule, readBackup };
});

(function() {

      items: [
        ['A console tool uses labelled messages to adjust the model’s learned patterns.',0,'This is training: examples change the model’s learned behavior.'],
        ['An ASP.NET Core service asks a saved model to categorize a new message.',1,'This is inference: the application uses a model that already exists.'],
        ['A staff member corrects Billing to Technical, and your app stores the correction.',2,'This records feedback. It can support a future training dataset, but it is not automatically a training run.']
      ]
    },
    choose: {
      labels: ['An explicit C# rule', 'A small classifier', 'An LLM with review'],
      items: [
        ['Reject requests with no visible message text.',0,'The condition is exact. Use ordinary validation and test it directly.'],
        ['Suggest one of three ticket categories. You have suitable labelled examples and want a small local baseline to evaluate.',1,'A small classifier is a sensible starting point under these assumptions. Compare measured quality before considering a larger model.'],
        ['Draft a new reply that summarizes a conversation and suggests a next step for an agent to approve.',2,'This requires generating language. A language model may help, while a person reviews the proposed response.']
      ]
    }
  };
  function renderScenarios(node, config) {
    let index = 0;
    function draw(focus) {
      const item=config.items[index];
      node.innerHTML=`<div class="experiment-head"><span>SupportDesk decision</span><span>${index+1} of ${config.items.length}</span></div><div class="experiment-body"><p class="scenario-text" tabindex="-1">${esc(item[0])}</p><div class="choice-grid">${config.labels.map((text,i)=>`<button class="choice-button" data-pick="${i}" aria-pressed="false">${esc(text)}</button>`).join('')}</div><div class="feedback" role="status" aria-live="polite"></div><div class="experiment-actions"><span>Try a choice to see why it fits.</span><button class="button secondary" data-next>${index===config.items.length-1?'Start again':'Next scenario'}</button></div></div>`;
      if(focus) node.querySelector('.scenario-text').focus({preventScroll:true});
      node.querySelectorAll('[data-pick]').forEach(button=>button.addEventListener('click',()=>{
        const chosen=Number(button.dataset.pick), correct=chosen===item[1];
        node.querySelectorAll('[data-pick]').forEach(b=>{b.setAttribute('aria-pressed',String(b===button));b.classList.toggle('correct',b===button&&correct);});
        const feedback=node.querySelector('.feedback');
        feedback.classList.toggle('success',correct);
        feedback.innerHTML=`<strong>${correct?'That fits.':'Consider how the decision is made.'}</strong><p>${esc(correct?item[2]:`The best fit here is “${config.labels[item[1]]}”. ${item[2]}`)}</p>`;
      }));
      node.querySelector('[data-next]').addEventListener('click',()=>{index=(index+1)%config.items.length;draw(true);});
    }
    draw(false);
  }
  function keyword(node) {
    node.innerHTML=`<div class="experiment-head"><span>Exact keyword rule</span><span>Editable C# behavior</span></div><div class="experiment-body"><label class="field">Customer message<textarea id="rule-message" rows="3" maxlength="2000">I need a refund</textarea></label><label class="field">Send to Billing when this word appears<input id="rule-keyword" value="refund" maxlength="40" autocomplete="off"></label><div class="chip-group" aria-label="Example messages"><button class="chip-button" data-message="I need a refund">Exact keyword</button><button class="chip-button" data-message="Please return my payment">Same intent, different words</button><button class="chip-button" data-message="I cannot sign in">Different request</button></div><div class="result-output" aria-live="polite"><span>Rule chooses</span><strong id="rule-result"></strong></div><p class="caption" id="rule-explanation" style="margin:14px 0 0"></p></div>`;
    const message=node.querySelector('#rule-message'), keyword=node.querySelector('#rule-keyword');
    const update=()=>{
      const result=AcademyCore.classifyRule(message.value,keyword.value);
      node.querySelector('#rule-result').textContent=result;
      node.querySelector('#rule-explanation').textContent=!message.value.trim()?'This demo has no message to route. The desktop lab adds explicit rejection for empty input.':!keyword.value.trim()?'Enter a keyword to define a condition. Without one, this demo uses the General queue.':result==='Billing'?'The characters match, ignoring letter case. This rule does not understand the meaning of the message.':'The keyword was not found. A related meaning alone cannot satisfy this exact rule.';
    };
    message.addEventListener('input',update);keyword.addEventListener('input',update);
    node.querySelectorAll('[data-message]').forEach(b=>b.addEventListener('click',()=>{message.value=b.dataset.message;update();}));update();
  }
  function boundary(node) {
    const examples=[['I was charged twice.','Billing','Show a Billing suggestion. Staff can verify the payment in an authorized system.'],['I cannot reset my password.','Account','Show an Account suggestion. Do not reset credentials without the application’s normal checks.'],['The upload button stops responding.','Technical','Show a Technical suggestion. Saving a ticket is still an application responsibility.']];
    node.innerHTML=`<div class="experiment-head"><span>Inspect the model boundary</span><span>Fixed example responses</span></div><div class="experiment-body"><label class="field">Choose an input message<select id="model-input">${examples.map((x,i)=>`<option value="${i}">${esc(x[0])}</option>`).join('')}</select></label><div id="model-result" aria-live="polite"></div></div>`;
    const update=()=>{
      const example=examples[Number(node.querySelector('select').value)];
      node.querySelector('#model-result').innerHTML=`<div class="result-output"><span>Illustrative category output</span><strong>${esc(example[1])}</strong></div><div class="connection-note"><strong>Your application’s responsibility</strong><p>${esc(example[2])}</p></div><p class="caption" style="margin:16px 0 0">Changing this selection looks up an authored example. It does not call or train a model.</p>`;
    };
    node.querySelector('select').addEventListener('change',update);update();
  }
  function evaluate(node) {
    const rows=[['Please refund this duplicate charge.','Billing','Billing'],['My password reset link expired.','Account','Account'],['My refund button crashes.','Billing','Technical'],['The screen freezes on upload.','Technical','Technical'],['Please help me access my account.','General','Account']];
    node.innerHTML=`<div class="experiment-head"><span>Five held-out messages</span><span>Illustrative evaluation</span></div><div class="experiment-body"><p>Each message has a category reviewed by a person. Compare the sample predictions with those labels.</p><button class="button" id="reveal-evaluation">Reveal predictions and compare</button><div id="evaluation-results" aria-live="polite"></div></div>`;
    node.querySelector('button').addEventListener('click',()=>{
      node.querySelector('#evaluation-results').innerHTML=`<ul class="evaluation-list">${rows.map(row=>`<li>${esc(row[0])}<div class="evaluation-labels"><span>Predicted: ${esc(row[1])}</span><span class="${row[1]===row[2]?'':'miss'}">Reviewed: ${esc(row[2])} · ${row[1]===row[2]?'Match':'Mismatch'}</span></div></li>`).join('')}</ul><div class="feedback"><strong>3 of 5 match. Inspect the 2 mistakes.</strong><p>The crash is a technical issue, and the access request concerns an account. Five examples are too few to establish production quality. These fixed examples teach the evaluation process.</p></div>`;
      node.querySelector('button').textContent='Predictions revealed';node.querySelector('button').disabled=true;
    });
  }
  window.AcademyExperiments={mount(node,type){
    if(scenarios[type])renderScenarios(node,scenarios[type]);
    else if(type==='keyword')keyword(node);
    else if(type==='model-boundary')boundary(node);
    else if(type==='evaluate')evaluate(node);
  }};
})();

</script>

  const labCode=`string[] messages =
[
    "I need a refund",
    "Please return my payment",
    "I cannot sign in",
    "   "
];

foreach (string message in messages)
{
    string display = string.IsNullOrWhiteSpace(message)
        ? "<empty>" : message;
    Console.WriteLine($"{display} -> {Route(message)}");
}

static string Route(string message)
{
    if (string.IsNullOrWhiteSpace(message))
        return "Rejected";

    return message.Contains("refund",
        StringComparison.OrdinalIgnoreCase)

  function renderLab(){
    $('#main-content').innerHTML=`<div class="wide-view">${breadcrumb('Desktop lab')}${warning()}<div class="lab-heading"><div class="lab-tags"><span>C# console app</span><span>20–30 min</span><span>No paid services</span></div><h1 tabindex="-1">Build your SupportDesk rules baseline.</h1><p class="lede">Run a small, predictable routing rule. Then see exactly where it stops helping. This is the first code milestone for your future support application.</p></div><div class="lab-layout"><div><section class="lab-step"><h2>1. Get ready</h2><p>Use a desktop with the .NET 10 SDK and a terminal. You can read this lab on your phone and run it later. Knowing basic C# is enough.</p><p>Recommended first: <a href="${lessonUrl('rules')}">When ordinary C# rules are enough</a>. The lab creates a console application, not the full web portal.</p>${codeBlock('dotnet --version','Terminal · check your SDK')}<p class="caption">The version should start with 10. If the command is missing, install the .NET 10 SDK from <a href="https://dotnet.microsoft.com/en-us/download/dotnet/10.0" target="_blank" rel="noopener noreferrer">Microsoft’s .NET download page</a>, then open a new terminal.</p></section><section class="lab-step"><h2>2. Create the starting project</h2><p>Choose a folder for your learning code, then run:</p>${codeBlock('dotnet new console --name SupportDesk.Rules --framework net10.0\ncd SupportDesk.Rules','Terminal · create your project')}<p>The first command creates a project file and a starter <code class="inline-code">Program.cs</code>. The second moves your terminal into that folder. No additional NuGet package is needed.</p></section><section class="lab-step"><h2>3. Replace Program.cs</h2><p>The four example messages include one that means “refund” without using that word. Replace the starter file with this code:</p>${codeBlock(labCode,'Program.cs · complete runnable starting exercise')}<ul><li><code class="inline-code">IsNullOrWhiteSpace</code> rejects input that has no visible text.</li><li><code class="inline-code">Contains</code> checks characters, ignoring letter case.</li><li>The other messages go to General. This is a baseline, not a learned classifier.</li></ul></section><section class="lab-step"><h2>4. Run it and compare</h2>${codeBlock('dotnet run','Terminal · run the exercise')}${codeBlock('I need a refund -> Billing\nPlease return my payment -> General\nI cannot sign in -> General\n<empty> -> Rejected','Expected output')}<p>Why does the second message go to General? The meaning is similar, but the keyword is absent. That is the limitation to record before trying a learned model.</p></section><section class="lab-step"><h2>5. Prove it and record the limitation</h2><p>The supplied downloadable project adds six executable checks to the same rule. Download its project file and Program.cs into the same folder, then run:</p>${codeBlock('dotnet run -- --verify','Terminal · run the supplied verification cases')}${codeBlock('PASS: explicit refund\nPASS: case-insensitive keyword\nPASS: related wording has no keyword\nPASS: unrelated message\nPASS: whitespace is rejected\nPASS: empty input is rejected\n6/6 checks passed.','Expected verification output')}<p>Change <code class="inline-code">Route</code> to return Billing for every message and run the checks again. They should fail and return a nonzero exit code. Restore the rule when you have seen why the checks matter.</p><p>In your own README, explain which requirement the rule handles well and one wording it misses. Later, we will compare a model with this baseline using held-out examples.</p></section><section class="lab-step"><h2>If something goes wrong</h2><ul><li><strong>“dotnet” is not recognized:</strong> install the SDK, then reopen the terminal.</li><li><strong>No project found:</strong> run the command inside the folder containing the .csproj file.</li><li><strong>The target framework is unsupported:</strong> check that the installed SDK is version 10.</li><li><strong>No verification summary appears:</strong> use the supplied downloadable Program.cs. The shorter exercise above demonstrates routing only.</li></ul><label class="lab-complete"><input id="complete-lab" type="checkbox" ${state.labs[C.labId]?'checked':''}><span>I ran the supplied checks and can explain the keyword limitation.<small style="display:block;color:var(--muted)">This milestone is self-reported; the website cannot inspect your terminal.</small></span></label></section></div><aside class="lab-aside"><section class="surface"><h2>The complete lab files</h2><p>Save both source files together in a folder. The README includes the same commands and expected results.</p><div class="file-links"><a href="data:text/plain;charset=utf-8,%3CProject%20Sdk%3D%22Microsoft.NET.Sdk%22%3E%0A%20%20%3CPropertyGroup%3E%0A%20%20%20%20%3COutputType%3EExe%3C%2FOutputType%3E%0A%20%20%20%20%3CTargetFramework%3Enet10.0%3C%2FTargetFramework%3E%0A%20%20%20%20%3CImplicitUsings%3Eenable%3C%2FImplicitUsings%3E%0A%20%20%20%20%3CNullable%3Eenable%3C%2FNullable%3E%0A%20%20%20%20%3CTreatWarningsAsErrors%3Etrue%3C%2FTreatWarningsAsErrors%3E%0A%20%20%3C%2FPropertyGroup%3E%0A%3C%2FProject%3E%0A" download>${icon('download')}Project file (.csproj)</a><a href="data:text/plain;charset=utf-8,%2F%2F%20SupportDesk%3A%20an%20explicit%20routing%20baseline%2C%20not%20a%20learned%20model.%0Aif%20(args.Contains(%22--verify%22%2C%20StringComparer.OrdinalIgnoreCase))%0A%7B%0A%20%20%20%20(string%20Name%2C%20string%20Input%2C%20string%20Expected)%5B%5D%20cases%20%3D%0A%20%20%20%20%5B%0A%20%20%20%20%20%20%20%20(%22explicit%20refund%22%2C%20%22I%20need%20a%20refund%22%2C%20%22Billing%22)%2C%0A%20%20%20%20%20%20%20%20(%22case-insensitive%20keyword%22%2C%20%22REFUND%20PLEASE%22%2C%20%22Billing%22)%2C%0A%20%20%20%20%20%20%20%20(%22related%20wording%20has%20no%20keyword%22%2C%20%22Please%20return%20my%20payment%22%2C%20%22General%22)%2C%0A%20%20%20%20%20%20%20%20(%22unrelated%20message%22%2C%20%22I%20cannot%20sign%20in%22%2C%20%22General%22)%2C%0A%20%20%20%20%20%20%20%20(%22whitespace%20is%20rejected%22%2C%20%22%20%20%20%22%2C%20%22Rejected%22)%2C%0A%20%20%20%20%20%20%20%20(%22empty%20input%20is%20rejected%22%2C%20%22%22%2C%20%22Rejected%22)%0A%20%20%20%20%5D%3B%0A%0A%20%20%20%20int%20passed%20%3D%200%3B%0A%20%20%20%20foreach%20(var%20test%20in%20cases)%0A%20%20%20%20%7B%0A%20%20%20%20%20%20%20%20string%20actual%20%3D%20Route(test.Input)%3B%0A%20%20%20%20%20%20%20%20bool%20ok%20%3D%20actual%20%3D%3D%20test.Expected%3B%0A%20%20%20%20%20%20%20%20Console.WriteLine(%24%22%7B(ok%20%3F%20%22PASS%22%20%3A%20%22FAIL%22)%7D%3A%20%7Btest.Name%7D%22)%3B%0A%20%20%20%20%20%20%20%20if%20(ok)%0A%20%20%20%20%20%20%20%20%20%20%20%20passed%2B%2B%3B%0A%20%20%20%20%20%20%20%20else%0A%20%20%20%20%20%20%20%20%20%20%20%20Console.WriteLine(%24%22%20%20Expected%20%7Btest.Expected%7D%3B%20got%20%7Bactual%7D.%22)%3B%0A%20%20%20%20%7D%0A%0A%20%20%20%20Console.WriteLine(%24%22%7Bpassed%7D%2F%7Bcases.Length%7D%20checks%20passed.%22)%3B%0A%20%20%20%20return%20passed%20%3D%3D%20cases.Length%20%3F%200%20%3A%201%3B%0A%7D%0A%0Astring%5B%5D%20messages%20%3D%0A%5B%0A%20%20%20%20%22I%20need%20a%20refund%22%2C%0A%20%20%20%20%22Please%20return%20my%20payment%22%2C%0A%20%20%20%20%22I%20cannot%20sign%20in%22%2C%0A%20%20%20%20%22%20%20%20%22%0A%5D%3B%0A%0Aforeach%20(string%20message%20in%20messages)%0A%7B%0A%20%20%20%20string%20display%20%3D%20string.IsNullOrWhiteSpace(message)%20%3F%20%22%3Cempty%3E%22%20%3A%20message%3B%0A%20%20%20%20Console.WriteLine(%24%22%7Bdisplay%7D%20-%3E%20%7BRoute(message)%7D%22)%3B%0A%7D%0Areturn%200%3B%0A%0Astatic%20string%20Route(string%20message)%0A%7B%0A%20%20%20%20if%20(string.IsNullOrWhiteSpace(message))%0A%20%20%20%20%20%20%20%20return%20%22Rejected%22%3B%0A%0A%20%20%20%20return%20message.Contains(%22refund%22%2C%20StringComparison.OrdinalIgnoreCase)%0A%20%20%20%20%20%20%20%20%3F%20%22Billing%22%0A%20%20%20%20%20%20%20%20%3A%20%22General%22%3B%0A%7D%0A" download>${icon('download')}Program.cs with checks</a><a href="data:text/plain;charset=utf-8,%23%20SupportDesk%20%E2%80%94%20C%23%20rules%20baseline%0A%0ABuild%20the%20first%20code%20milestone%20in%20the%20AI%20for%20.NET%20developers%20preview.%20This%20is%20a%20deterministic%20console%20application%2C%20not%20a%20trained%20model.%20All%20messages%20are%20fictional.%20No%20account%2C%20API%2C%20database%2C%20or%20additional%20package%20is%20needed.%0A%0A%23%23%20Prerequisites%0A%0AUse%20a%20desktop%20terminal%20with%20the%20.NET%2010%20SDK.%20%60dotnet%20--version%60%20should%20start%20with%2010.%20Install%20the%20SDK%20from%20https%3A%2F%2Fdotnet.microsoft.com%2Fen-us%2Fdownload%2Fdotnet%2F10.0%20if%20needed.%20Read%20the%20website%20lesson%20%E2%80%9CWhen%20ordinary%20C%23%20rules%20are%20enough%E2%80%9D%20first.%0A%0A%23%23%20Run%20the%20supplied%20files%0A%0APut%20%60SupportDesk.Rules.csproj%60%20and%20%60Program.cs%60%20in%20the%20same%20folder.%20Open%20a%20terminal%20there%3A%0A%0A%60%60%60shell%0Adotnet%20run%0A%60%60%60%0A%0AExpected%20application%20output%20(the%20first%20run%20can%20also%20print%20SDK%20setup%20messages)%3A%0A%0A%60%60%60text%0AI%20need%20a%20refund%20-%3E%20Billing%0APlease%20return%20my%20payment%20-%3E%20General%0AI%20cannot%20sign%20in%20-%3E%20General%0A%3Cempty%3E%20-%3E%20Rejected%0A%60%60%60%0A%0A%60IsNullOrWhiteSpace%60%20rejects%20empty%20input.%20%60Contains%60%2C%20with%20ordinal%20case-insensitive%20comparison%2C%20routes%20text%20containing%20%E2%80%9Crefund%E2%80%9D%20to%20Billing.%20Everything%20else%20goes%20to%20General.%0A%0A%23%23%20Verify%20the%20behavior%0A%0A%60%60%60shell%0Adotnet%20run%20--%20--verify%0A%60%60%60%0A%0A%60%60%60text%0APASS%3A%20explicit%20refund%0APASS%3A%20case-insensitive%20keyword%0APASS%3A%20related%20wording%20has%20no%20keyword%0APASS%3A%20unrelated%20message%0APASS%3A%20whitespace%20is%20rejected%0APASS%3A%20empty%20input%20is%20rejected%0A6%2F6%20checks%20passed.%0A%60%60%60%0A%0AThe%20verification%20process%20exits%20with%200%20when%20all%20cases%20pass%20and%201%20if%20any%20case%20fails.%20To%20see%20a%20real%20failure%2C%20temporarily%20change%20%60Route%60%20to%20return%20%60Billing%60%20for%20every%20message.%20Run%20the%20checks%20again%2C%20inspect%20the%20failures%2C%20then%20restore%20the%20rule.%0A%0A%23%23%20Start%20from%20a%20new%20project%20instead%0A%0AIn%20your%20own%20learning-code%20folder%3A%0A%0A%60%60%60shell%0Adotnet%20new%20console%20--name%20SupportDesk.Rules%20--framework%20net10.0%0Acd%20SupportDesk.Rules%0A%60%60%60%0A%0AReplace%20the%20generated%20%60Program.cs%60%20with%20the%20supplied%20file%2C%20then%20run%20the%20commands%20above.%20The%20shorter%20exercise%20shown%20inside%20the%20website%20illustrates%20routing%3B%20this%20supplied%20file%20also%20includes%20the%20%60--verify%60%20mode.%0A%0A%23%23%20Explain%20what%20happened%0A%0A1.%20Why%20did%20%E2%80%9CPlease%20return%20my%20payment%E2%80%9D%20go%20to%20General%3F%0A2.%20Why%20is%20rejecting%20empty%20input%20an%20application%20rule%20rather%20than%20a%20model%20task%3F%0A3.%20Would%20detecting%20the%20word%20%E2%80%9Crefund%E2%80%9D%20be%20enough%20to%20authorize%20a%20refund%3F%20Explain%20why%20not.%0A%0AWrite%20one%20limitation%20and%20one%20testable%20strength%20of%20this%20approach%20in%20your%20own%20README.%20Later%20lessons%20will%20compare%20a%20small%20ML.NET%20classifier%20with%20this%20baseline%20on%20messages%20held%20out%20from%20training.%0A%0A%23%23%20Troubleshooting%0A%0A-%20%60dotnet%60%20not%20recognized%3A%20install%20the%20SDK%2C%20then%20reopen%20the%20terminal.%0A-%20No%20project%20found%3A%20change%20into%20the%20folder%20containing%20the%20.csproj%20file.%0A-%20Target%20framework%20unsupported%3A%20use%20the%20.NET%2010%20SDK.%0A-%20Verification%20output%20missing%3A%20use%20the%20supplied%20Program.cs%2C%20not%20only%20the%20shorter%20website%20snippet.%0A-%20This%20demo%20checks%20substrings%2C%20not%20word%20meaning%20or%20intent.%20A%20model%20needs%20its%20own%20evaluation%3B%20it%20is%20not%20automatically%20an%20improvement.%0A" download>${icon('download')}Lab instructions (.md)</a></div><div class="context-section"><h3>What you are building</h3><p>Message → validation → keyword rule → queue.</p><p>Keep this as your baseline before introducing ML.NET.</p></div><a class="button quiet" href="${lessonUrl('rules','dotnet')}">Back to the .NET connection</a></section></aside></div>${bottom()}</div>`;
    $('#complete-lab').addEventListener('change',event=>{if(event.target.checked)state.labs[C.labId]=true;else delete state.labs[C.labId];save();toast(event.target.checked?'Lab milestone marked complete.':'Lab milestone marked incomplete.');});
  }
  function download(name,text,type){
    const url=URL.createObjectURL(new Blob([text],{type})),link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),10000);
  }
  function closeDrawer(){if($('#course-drawer').open)$('#course-drawer').close();document.body.classList.remove('drawer-open');}
  $('#open-course').addEventListener('click',()=>{updateNav();$('#course-drawer').showModal();document.body.classList.add('drawer-open');});
  $('#close-course').addEventListener('click',closeDrawer);
  $('#course-drawer').addEventListener('close',()=>document.body.classList.remove('drawer-open'));
  $('#course-drawer').addEventListener('click',event=>{if(event.target===event.currentTarget&&event.offsetX>event.currentTarget.clientWidth)closeDrawer();});
  document.addEventListener('click',async event=>{
    const anchor=event.target.closest('a');if(anchor&&$('#course-drawer').contains(anchor))closeDrawer();
    const button=event.target.closest('[data-copy]');if(!button)return;
    const code=button.closest('.code-block').querySelector('code').textContent;
    try{await navigator.clipboard.writeText(code);button.innerHTML=`${icon('check')}Copied`;toast('Code copied.');setTimeout(()=>{if(button.isConnected)button.innerHTML=`${icon('copy')}Copy`;},2000);}
    catch{const range=document.createRange();range.selectNodeContents(button.closest('.code-block').querySelector('code'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);toast('Code selected. Use your device’s copy command.');}
  });
  function render(initial=false){
    if(location.hash==='#main-content'){$('#main-content').focus();return;}
    const previous=active,parts=location.hash.slice(1).split('/');
    $('#toast').hidden=true;
    let type=parts[0],id=parts[1],section=parts[2]||'understand';
    if(!type)type='home';
    if(type==='learn'){
      type='lesson';id=core.nextLesson(state).id;section='understand';
      history.replaceState(null,'',lessonUrl(id,section));
    }
    active={type,id,section};
    document.body.dataset.view=type;
    if(type==='home'){
      $('#main-content').innerHTML=warning()+AcademyHome.markup({lessons:C.lessons,state,next:core.nextLesson(state),esc,icon});
      document.title='AI for .NET developers · Learn, practise, build';
    }else if(type==='lesson'&&core.getLesson(id)&&sections.some(x=>x[0]===section)){
      renderLesson(core.getLesson(id),section);document.title=`${core.getLesson(id).short} · AI for .NET developers`;
    }else if(type==='map'){renderMap();document.title='Learning path · AI for .NET developers';}
    else if(type==='progress'){renderProgress();document.title='My progress · AI for .NET developers';}
    else if(type==='lab'){renderLab();document.title='C# rules-baseline lab · AI for .NET developers';}
    else{$('#main-content').innerHTML=`<div class="wide-view"><h1 tabindex="-1">That lesson link is unavailable.</h1><p>Choose a foundation lesson or explore the course map.</p><a class="button" href="#map">Open the course map</a></div>`;}
    updateNav();
    const mapTarget=type==='map'&&id?document.getElementById('unit-'+id):null;
    if(mapTarget){
      closeDrawer();mapTarget.querySelector('h2').focus({preventScroll:true});
      const headerHeight=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--header'));
      window.scrollTo({top:Math.max(0,mapTarget.getBoundingClientRect().top+scrollY-headerHeight-20),behavior:'instant'});
      syncMapSidebar();
      return;
    }
    if(!initial){
      closeDrawer();const same=previous?.type==='lesson'&&type==='lesson'&&previous.id===id;
      const focusTarget=same?$('.lesson-panel h2'):$('h1');
      if(focusTarget){focusTarget.setAttribute('tabindex','-1');focusTarget.focus({preventScroll:true});}
      if(same&&$('.section-tabs')){const y=$('.section-tabs').getBoundingClientRect().top+scrollY-parseInt(getComputedStyle(document.documentElement).getPropertyValue('--header'))-16;window.scrollTo({top:Math.max(0,y),behavior:'instant'});}
      else window.scrollTo({top:0,behavior:'instant'});
    }
  }
  window.addEventListener('hashchange',()=>render(false));
  function syncMapSidebar(){
    if(active?.type!=='map')return;
    const boundary=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--header'))+140;
    const stages=Array.from(document.querySelectorAll('.stage'));
    const current=stages.filter(stage=>stage.getBoundingClientRect().top<=boundary).at(-1)||stages[0];
    if(!current)return;
    const id=current.id.replace('unit-','');active.id=id;
    document.querySelectorAll('.unit-link').forEach(link=>{
      const selected=link.getAttribute('href')==='#map/'+id;
      link.classList.toggle('active',selected);
      if(selected)link.setAttribute('aria-current','location');else link.removeAttribute('aria-current');
    });
  }
  let scrollPending=false;
  window.addEventListener('scroll',()=>{
    if(active?.type!=='map'||scrollPending)return;
    scrollPending=true;
    requestAnimationFrame(()=>{
      scrollPending=false;syncMapSidebar();
    });
  },{passive:true});
  window.addEventListener('storage',event=>{if(event.key===KEY){try{state=core.sanitizeProgress(JSON.parse(event.newValue||'null'));render(true);}catch{storageFailed=true;syncWarning();}}});
  render(true);
})();

</script>
