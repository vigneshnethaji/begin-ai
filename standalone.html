%60%20in%20%60LabData.cs%60%20describes%20the%20input%3A%20%60Label%60%20is%20the%20known%20answer%20during%20training%2Fevaluation%3B%20%60Text%60%20is%20the%20message%20to%20learn%20from.%20%60%5BLoadColumn%5D%60%20records%20the%20TSV%20column%20positions.%20The%20strict%20reader%20checks%20the%20header%2C%20column%20count%2C%20labels%2C%20and%20nonempty%20text%20before%20%60LoadFromEnumerable%60%20creates%20ML.NET%27s%20data%20view.%20%60SupportPrediction%60%20uses%20%60%5BColumnName(%22PredictedLabel%22)%5D%60%20and%20%60%5BColumnName(%22Score%22)%5D%60%20to%20bind%20model%20output%20to%20C%23%20properties.%0A%0A%60SupportClassifier.cs%60%20creates%20%60MLContext(seed%3A%2042)%60%20and%20this%20pipeline%3A%0A%0A1.%20%60MapValueToKey%60%20turns%20the%20three%20string%20labels%20into%20the%20numeric%20keys%20the%20trainer%20expects.%0A2.%20%60FeaturizeText%60%20turns%20**Text%20only**%20into%20a%20numeric%20%60Features%60%20vector%20using%20text%20patterns.%20The%20answer%20label%20is%20never%20included%20in%20%60Features%60.%0A3.%20%60SdcaMaximumEntropy%60%20learns%20a%20multiclass%20classifier%20from%20those%20features%20and%20labels.%20A%20single%20training%20thread%20reduces%20run-to-run%20variation%20in%20this%20small%20lab.%0A4.%20%60MapKeyToValue%60%20turns%20the%20predicted%20key%20back%20into%20a%20readable%20category.%0A%0A%60Fit(trainingData)%60%20learns%20the%20vocabulary%2C%20text%20transformations%2C%20and%20classifier%20weights%20from%20**train.tsv%20only**.%20Saving%20persists%20the%20whole%20fitted%20pipeline.%20%60Transform(testData)%60%20applies%20that%20existing%20pipeline%3B%20it%20does%20not%20fit%20a%20new%20vocabulary%20or%20update%20weights.%20A%20test%20label%20supplies%20the%20answer%20for%20counting%20correct%20predictions%2C%20not%20an%20input%20text%20feature.%20Prediction%20supplies%20only%20the%20message%20text%3B%20its%20unused%20label%20is%20empty.%0A%0AKeeping%20%60Fit%60%20and%20%60Transform%60%20separate%20matters%3A%20fitting%20on%20test%20messages%20would%20leak%20information%20into%20the%20model%20and%20make%20the%20evaluation%20less%20honest.%20The%20test%20file%20contains%20separately%20authored%20messages%20with%20different%20wording%2C%20not%20copied%20training%20sentences.%20Verification%20rejects%20duplicates%20within%20or%20across%20splits%20after%20lowercasing%20and%20normalizing%20punctuation%2Fwhitespace.%20This%20catches%20normalized%20duplicates%2C%20not%20all%20paraphrases%20or%20semantic%20overlap%3B%20related%20support%20vocabulary%20is%20intentional.%0A%0A%23%23%20Compare%20against%20the%20original%20rules%20lab%0A%0AThe%20comparison%20reuses%20the%20**exact%20%60Route%60%20behavior%20from%20%60labs%2Fsupportdesk-rules%2FProgram.cs%60**%2C%20with%20no%20extra%20keywords%20or%20categories.%20It%20is%20ordinary%20C%23%2C%20not%20a%20second%20learned%20model%3A%0A%0A%60%60%60csharp%0Aif%20(string.IsNullOrWhiteSpace(message))%0A%20%20%20%20return%20%22Rejected%22%3B%0A%0Areturn%20message.Contains(%22refund%22%2C%20StringComparison.OrdinalIgnoreCase)%0A%20%20%20%20%3F%20%22Billing%22%0A%20%20%20%20%3A%20%22General%22%3B%0A%60%60%60%0A%0AEmpty%2Fwhitespace%20text%20returns%20**Rejected**.%20The%20case-insensitive%20**substring**%20%60refund%60%20returns%20**Billing**%2C%20including%20inside%20a%20word%20such%20as%20%60unrefunded%60.%20Every%20other%20nonempty%20message%20returns%20**General**%2C%20even%20if%20it%20mentions%20invoices%2C%20payments%2C%20passwords%2C%20or%20crashes.%20The%20rules%20are%20fixed%20and%20learn%20nothing%20from%20either%20data%20file.%0A%0AThe%20ML.NET%20model%20still%20predicts%20only%20**Billing%20%2F%20Account%20%2F%20Technical**.%20**General%20is%20only%20the%20original%20baseline%27s%20fallback**%2C%20never%20a%20model%20label%20or%20a%20dataset%20label.%20The%20held-out%20file%20contains%20no%20empty%20messages%2C%20so%20the%20baseline%27s%20Rejected%20branch%20is%20exercised%20by%20verification%20rather%20than%20evaluation.%20Correct%20counts%20use%20exact%20label%20equality%3A%20a%20General%20result%20is%20wrong%20against%20any%20of%20the%20three%20dataset%20labels.%0A%0AEvaluation%20applies%20both%20approaches%20to%20exactly%20the%20same%20held-out%20rows.%20In%20the%20updated%20verified%20run%20the%20model%20got%20**15%2F18**%20correct%20and%20the%20original%20baseline%20got%20**0%2F18**.%20None%20of%20the%2018%20held-out%20messages%20contains%20the%20substring%20%60refund%60%2C%20so%20the%20unchanged%20original%20rule%20returns%20General%20for%20every%20row.%20The%20synthetic%20data%20has%20not%20been%20altered%20to%20improve%20either%20result.%0A%0AThis%20comparison%20illustrates%20the%20original%20rule%27s%20limited%20scope%20and%20sensitivity%20to%20wording.%20The%20rule%20cannot%20output%20Account%20or%20Technical%20at%20all%3B%20these%20counts%20are%20**not%20a%20fair%20benchmark%20between%20equally%20capable%20three-category%20classifiers**%20or%20a%20promise%20that%20machine%20learning%20wins.%20Inspect%20the%20printed%20mistakes%20and%20outputs.%20Do%20not%20tune%20training%20data%20against%20this%20test%20set%20and%20then%20call%20it%20an%20independent%20benchmark%3B%20create%20a%20fresh%20unseen%20split%20for%20later%20experiments.%0A%0A%23%23%20What%20verification%20checks%0A%0AThe%20built-in%20verifier%20exercises%20the%20real%20pipeline%20without%20a%20separate%20test%20framework%3A%0A%0A-%20Valid%20command%20parsing%20and%20preservation%20of%20quoted%20text%3B%20invalid%20commands%2C%20extra%20arguments%2C%20missing%2Fempty%2Fwhitespace%20messages%20are%20rejected.%0A-%20Invalid%2Fempty%20TSV%20input%2C%20wrong%20headers%2Fcolumn%20counts%2C%20and%20unknown%20labels%20are%20rejected.%0A-%20Both%20splits%20are%20nonempty%2C%20contain%20every%20category%2C%20and%20have%20no%20normalized%20duplicates.%20Deliberately%20constructed%20leakage%2C%20duplicate%2C%20and%20missing-category%20fixtures%20must%20fail%20the%20guard.%0A-%20Literal%20original-rule%20examples%20check%20case-insensitive%20substring%20handling%2C%20empty%2Fwhitespace%20rejection%2C%20and%20General%20fallback.%20A%20four-message%20evaluation%20fixture%20checks%20that%20only%20its%20explicit%20refund%20is%20correct%20and%20that%20General%20counts%20as%20wrong%20for%20the%20three%20dataset%20labels.%0A-%20Training%20creates%20a%20nonempty%20saved%20model%3B%20all%20held-out%20predictions%20have%20known%20labels%20and%20three%20finite%20scores%2C%20and%20saving%2Freloading%20preserves%20labels%20and%20scores%20within%20a%20small%20numeric%20tolerance.%0A-%20Evaluation%20covers%20every%20held-out%20row%20in%20order%2C%20agrees%20with%20single-message%20prediction%2C%20and%20returns%20bounded%2C%20independently%20recounted%20model%2Fbaseline%20correct%20counts.%20Empty%20evaluation%20is%20rejected.%0A%0AIt%20exits%20nonzero%20on%20the%20first%20failed%20invariant%20and%20prints%20its%20error.%20There%20is%20**no%20fragile%20accuracy%20threshold**%3B%20correctness%20of%20the%20workflow%20is%20distinct%20from%20quality%20of%20a%20tiny%20model.%20The%20verifier%20retrains%20on%20every%20run%20so%20changes%20to%20source%20data%20are%20exercised.%0A%0A%23%23%20Reuse%20the%20saved%20classifier%20from%20C%23%0A%0AThe%20console%20command%20handler%20calls%20the%20reusable%20%60SupportClassifier%60%20class.%20After%20training%2C%20another%20console%20flow%20in%20the%20same%20project%20can%20use%20the%20saved%20model%20like%20this%3A%0A%0A%60%60%60csharp%0Ausing%20SupportDesk.Classifier%3B%0A%0Avar%20classifier%20%3D%20new%20SupportClassifier()%3B%0Avar%20savedModel%20%3D%20classifier.Load()%3B%0ASupportPrediction%20result%20%3D%20classifier.Predict(savedModel%2C%20%22My%20screen%20turns%20blank%20after%20refresh%22)%3B%0AConsole.WriteLine(result.Category)%3B%0A%60%60%60%0A%0AThis%20code%20loads%20existing%20weights%20and%20does%20no%20training.%20It%20illustrates%20C%23%20reuse%2C%20not%20a%20web%20API%20implementation.%20%60PredictionEngine%60%20is%20not%20thread-safe%3B%20this%20lab%20creates%2 s%60%20and%20its%20instrumented%20startup%20verification%20demonstrate%20both%20paths%20without%20inspecting%20personal%20key%20files.%20This%20configuration%20is%20for%20this%20loopback%20learning%20lab%2C%20not%20a%20production%20or%20multi-instance%20deployment.%0A%0A%23%23%20Six-topic%20learning%20path%0A%0A1.%20Inspect%20the%20synthetic%20ticket%20and%20choose%20an%20authored%20response%20fixture.%0A2.%20Load%20the%20response%2C%20inspect%2Fedit%20its%20JSON%2C%20and%20validate%20the%20exact%20contract.%0A3.%20Read%20the%20typed%20preview%2C%20compare%20facts%20with%20the%20source%2C%20and%20review%20locally.%0A4.%20Compare%20prompt%20v1%27s%20broad%20request%20with%20v2%27s%20explicit%20contract%20and%20grounding%20instructions.%0A5.%20Run%20the%20deterministic%20four-case%20reviewed%20fixture%20comparison%20and%20inspect%20its%20saved%20responses.%0A6.%20Complete%20the%20milestone%3A%20explain%20schema%20validation%20versus%20factual%20truth%2C%20status%20gating%2C%20and%20evaluation%20limits.%0A%0ATry%20%60valid%60%2C%20then%20%60malformed-json%60%2C%20%60missing-field%60%2C%20%60invalid-category%60%2C%20%60refused%60%2C%20%60incomplete%60%2C%20%60failed%60%2C%20and%20%60unsupported-claim%60.%20The%20last%20fixture%20claims%20a%20refund%20was%20issued%2C%20but%20the%20ticket%20says%20no%20refund%20is%20confirmed.%20It%20intentionally%20passes%20structural%20checks.%20**A%20successful%20typed%20shape%20does%20not%20guarantee%20factual%20truth%3B%20staff%20review%20is%20always%20required.**%0A%0ASelecting%20another%20fixture%20clears%20the%20loaded%20response%2C%20typed%20result%2C%20errors%20and%20review.%20Loading%20again%20or%20editing%20the%20raw%20response%20also%20clears%20the%20DTO%20and%20review.%20Editing%20text%20cannot%20convert%20a%20refused%2C%20incomplete%20or%20failed%20response%20into%20completed.%20Only%20a%20completed%20response%20can%20enter%20JSON%20validation%3B%20refusal%20text%20is%20never%20parsed%20into%20a%20DTO.%20The%20review%20checkbox%20is%20enabled%20only%20after%20successful%20validation%20of%20a%20completed%20response.%20Nothing%20is%20sent%20or%20persisted%20when%20checked.%20Reloading%20discards%20the%20session%20workspace.%0A%0A%23%23%20Exact%20contract%0A%0A%60%60%60csharp%0ASummaryDto%20%7B%0A%20%20%20%20string%20Title%3B%20%20%20%20%20%20%20%20%20%20%20%20%20%20%20%20%20%2F%2F%20nonblank%2C%20%3C%3D80%20characters%0A%20%20%20%20string%20Category%3B%20%20%20%20%20%20%20%20%20%20%20%20%20%20%2F%2F%20Billing%20%7C%20Account%20%7C%20Technical%20%7C%20General%0A%20%20%20%20string%5B%5D%20Facts%3B%20%20%20%20%20%20%20%20%20%20%20%20%20%20%20%2F%2F%201..4%20nonblank%20strings%2C%20each%20%3C%3D160%0A%20%20%20%20string%5B%5D%20MissingInformation%3B%20%20%2F%2F%200..3%20nonblank%20strings%2C%20each%20%3C%3D120%0A%7D%0A%60%60%60%0A%0AJSON%20keys%20are%20exactly%20%60title%60%2C%20%60category%60%2C%20%60facts%60%2C%20%60missingInformation%60%20(case-sensitive).%20All%20four%20are%20required.%20The%20service%20rejects%20extra%20or%20duplicate%20keys%20(including%20escaped%20duplicates)%2C%20nulls%2C%20wrong%20types%2C%20blank%20values%2C%20invalid%20categories%2C%20out-of-range%20lengths%2C%20malformed%20JSON%2C%20comments%2C%20trailing%20commas%2C%20input%20over%20**16000%20characters**%2C%20and%20nesting%20deeper%20than%20**8**.%20Length%20uses%20.NET%20string%20length%20(UTF-16%20code%20units).%20The%20textarea%20limits%20normal%20input%20to%2016000%3B%20the%20service%20independently%20enforces%20the%20boundary.%20Validation%20returns%20either%20%60ValidSummary%60%20containing%20the%20DTO%20or%20%60InvalidSummary%60%20containing%20errors%2C%20never%20a%20partly%20valid%20DTO.%0A%0ARazor%20encodes%20preview%20text.%20For%20example%2C%20put%20%60%3Cb%3EDemo%20title%3C%2Fb%3E%60%20in%20the%20title%20string%3A%20it%20displays%20literally%20and%20does%20not%20become%20HTML.%20The%20validator%20checks%20shape%2C%20not%20whether%20a%20fact%20is%20supported%2C%20a%20category%20is%20appropriate%20or% %20always%20uses%20%60127.0.0.1%60.%20Stop%20the%20app%20with%20Ctrl%2BC.%20Verification%20exits%20before%20host%20creation%20and%20never%20starts%20a%20listener.%0A%0AStartup%20uses%20%60WebApplication.CreateEmptyBuilder%60%2C%20%60UseStaticWebAssets%60%2C%20%60MapStaticAssets%60%2C%20and%20the%20local%20Blazor%20circuit.%20It%20does%20not%20load%20appsettings%2C%20user%20secrets%20or%20provider%20configuration.%20The%20only%20application%20environment%20setting%20read%20is%20%60LOOKUP_LAB_PORT%60.%20No%20model%2C%20provider%2C%20outbound%20network%20calls%2C%20credentials%2C%20real%20customer%20data%2C%20database%2C%20persistence%2C%20telemetry%20integration%2C%20or%20actual%20write%20actions%20are%20implemented.%20Browser-to-loopback%20HTTP%2FWebSocket%20traffic%20is%20necessary%20for%20Interactive%20Server.%20NuGet%20sources%20are%20cleared%3B%20no%20package%20dependencies%20are%20needed.%0A%0A%23%23%20Contract%20and%20trust%20boundary%0A%0A%60Services%2FSessionDataProtection.cs%60%20keeps%20ASP.NET%20data%20protection%20memory-only%3A%20%60UseEphemeralDataProtectionProvider%60%20protects%20antiforgery%20payloads%2C%20and%20an%20explicit%20%60KeyManagementOptions.XmlRepository%60%20supplies%20a%20thread-safe%20in-memory%20XML%20repository%20for%20the%20default%20hosted%20key-ring%20preload.%20Both%20stored%20and%20returned%20XML%20elements%20are%20defensively%20cloned.%20The%20key%20manager%20cannot%20fall%20back%20to%20the%20user-profile%20key%20ring%2C%20so%20this%20configuration%20does%20not%20read%20or%20write%20key-ring%20files.%20Keys%20disappear%20when%20the%20runtime%20ends.%0A%0ANormalized%20local%20proposal%2C%20with%20exact%20JSON%20property%20names%3A%0A%0A%60%60%60json%0A%7B%22tool%22%3A%22lookup_ticket%22%2C%22arguments%22%3A%7B%22ticketId%22%3A%22DEMO-104%22%7D%7D%0A%60%60%60%0A%0AThe%20proposal%20contains%20only%20%60tool%60%20and%20%60arguments%60%3B%20%60arguments%60%20contains%20only%20%60ticketId%60.%20Only%20%60lookup_ticket%60%20is%20allowlisted.%20Ticket%20IDs%20must%20match%20the%20ASCII%20format%20%60DEMO-%5B0-9%5D%7B3%7D%60%20exactly.%20The%20parser%20rejects%20unknown%2Fmissing%2Fduplicate%20keys%20(including%20escaped%20duplicates)%2C%20nulls%2C%20wrong%20types%2C%20arrays%2C%20comments%2C%20trailing%20commas%2C%20multiple%20documents%2C%20malformed%20Unicode%2C%20input%20over%204000%20.NET%20characters%2C%20and%20JSON%20depth%20over%206.%20Whitespace%20and%20property%20order%20may%20vary%3B%20canonical%20output%20uses%20the%20shape%20above.%20Typed%20records%20are%20%60ToolProposal(string%20Tool%2C%20LookupArguments%20Arguments)%60%20and%20%60LookupArguments(string%20TicketId)%60.%0A%0ANo%20model-supplied%20caller%2C%20tenant%2C%20user%2C%20permission%20or%20approved%20flag%20is%20accepted.%20The%20C%23%20service%20resolves%20the%20demo%20identity%20selector%20to%20server-owned%20%60CallerScope(string%20Identity%2C%20string%20Team%2C%20bool%20CanLookup)%60%20values.%20These%20are%20teaching%20simulations%2C%20**not%20real%20authentication%20or%20production%20authorization**.%0A%0A%7C%20Selector%20value%20%7C%20Server-owned%20demo%20scope%20%7C%20Available%20fixture%20%7C%0A%7C%20---%20%7C%20---%20%7C%20---%20%7C%0A%7C%20%60billing%60%20%7C%20teamA%2C%20lookup%20allowed%20%7C%20DEMO-104%2C%20duplicate%20charge%20%7C%0A%7C%20%60technical%60%20%7C%20teamB%2C%20lookup%20allowed%20%7C%20DEMO-205%2C%20export%20issue%20%7C%0A%7C%20%60no-access%60%20%7C%20teamA%2C%20lookup%20denied%20%7C%20none%20%7C%0A%0AUnknown%20identities%20are%20denied.%20Missing%20ticket%20IDs%20and%20tickets%20outside%20the%20current%20team%20return%20identical%20Unavailable%20results%20and%20perform%20no%20invocation%3B%20the%20result%20reveals%20no%20other-team%20existence.%20The%20authorization%20routing%20metadata%20is%20fixed%20local%20fixture%20metadata.%20The%20counter%20measures%20actual%20local%20function%20reads%2C%20not%20metadata%20checks.%0A%0A%23%23%20Server%20API%0A%0AThere%20is%20no%20public%20JSON%20execution%20endpoint%2C%20provider%20tool%20interface%2C%20or%20direct%20database%20access.%20The%20Razor%20component%20calls%20one%20circuit-scoped%20%60LookupExecutor%60%3A%0A%0A%60%60%60csharp%0AReviewResult%20Validate(Guid%20requestId%2C%20string%20raw%2C%20string%20identity%2C%20LookupScenario%20scenario)%3B%0Abool%20Approve(Guid%20requestId%2C%20string%20raw%2C%20string%20identity%2C%20LookupScenario%20scenario)%3B%0ALookupResult%20Invoke(Guid%20requestId%2C%20string%20raw%2C%20string%20identity%2C%20LookupScenario%20scenario)%3B%0Avoid%20InvalidateReview()%3B%0Aint%20InvocationCount%20%7B%20get%3B%20%7D%0Aint%20RecordCount%20%7B%20get%3B%20%7D%0AIReadOnlyList%3CAuditEntry%3E%20Audit%20%7B%20get%3B%20%7D%0A%60%60%60%0A%0A1.%20**Validate%3A**%20strict%20parsing%20and%20deterministic%20permission%2Fteam%20authorization.%20Produces%20canonical%20review%20data%3B%20no%20function%20invocation.%20Any%20validation%20attempt%20clears%20earlier%20approval.%0A2.%20**Approve%3A**%20explicit%20staff%20action.%20Server%20compares%20the%20current%20reviewed%20snapshot%20with%20canonical%20proposal%20%2B%20request%20ID%20%2B%20resolved%20demo%20identity%20%2B%20scenario%2C%20and%20rechecks%20authorization.%20A%20checkbox%20or%20forged%20JSON%20field%20cannot%20authorize%20a%20request.%0A3.%20**Invoke%3A**%20reparses%20and%20rechecks%20permission%2Fteam%20authorization%20on%20every%20call%2C%20including%20replay%2C%20then%20checks%20request%20conflicts%20and%20the%20server-held%20approval.%20Only%20then%20can%20it%20read%20a%20fixture%20or%20return%20a%20cached%20outcome.%20Changed%20inputs%20presented%20directly%20to%20the%20service%20cannot%20reuse%20an%20earlier%20approval.%20%60InvalidateReview%60%20explicitly%20revokes%20review%2Fapproval%20on%20all%20UI%20input%20changes%2C%20including%20change-and-revert%20sequences.%0A4.%20**Replay%3A**%20invokes%20with%20the%20same%20exact%20request%20ID%2C%20proposal%2C%20identity%20and%20scenario.%20It%20returns%20the%20saved%20outcome%20with%20%60Replay%20%3D%20true%60%2C%20without%20another%20read.%20It%20still%20requires%20authorization%20and%20a%20matching%20active%20approval.%0A%0A%60LookupScenario%60%20values%20are%20%60Normal%60%2C%20%60Transient%60%2C%20%60Unknown%60%20(UI%20values%20%60normal%60%2C%20%60transient%60%2C%20%60unknown%60).%20Result%20outcomes%20are%20%60Invalid%60%2C%20%60Denied%60%2C%20%60Unavailable%60%2C%20%60ApprovalRequired%60%2C%20%60Conflict%60%2C%20%60Success%60%2C%20%60Unknown%60%2C%20%60CapacityReached%60%3B%20%60Allowed%60%20is%20the%20successful%20validation%20outcome.%20%60LookupResult%60%20has%20%60Outcome%60%2C%20a%20fixed%20safe%20%60Message%60%2C%20optional%20%60Ticket%60%2C%20%60Attempts%60%2C%20and%20%60Replay%60.%20%60TicketView%60%20exposes%20only%20%60TicketId%60%2C%20%60Subject%60%2C%20%60Status%60%2C%20and%20a%20fictional%2C%20redacted%20%60Summary%60.%20No%20contact%2C%20billing%2C%20payment%20or%20customer%20fields%20are%20present.%20Razor%20escapes%20all%20displayed%20content%3B%20no%20raw%20HTML%20rendering%20is%20used.%0A%0A%23%23%20Duplicate%20requests%20and%20failure%20scenarios%0A%0AThe%20scoped%20executor%20serializes%20authorization%2C%20approval%20checks%2C%20duplicate%20detection%2C%20the%20local%20read%20and%20cache%20insertion%20under%20one%20lock.%20Concurrent%20duplicates%20produce%20one%20local%20read%20within%20this%20running%20session.%20A%20request%20ID%20is%20reserved%20to%20its%20first%20successful%20invocation%27s%20canonical%20proposal%2C%20identity%20and%20scenario%3B%20reusing%20it%20for%20different%20inputs%20is%20rejected%20or%20conflicts.%20The%20identity%20is%20part%20of%20the%20binding%2C%20so%20results%20cannot%20cross%20demo%20scopes.%0A%0A-%20**Normal%3A**%20one%20attempt%2C%20one%20read.%0A-%20**Transient%3A**%20explicitly%20simulated%20failure%20on%20attempt%201%20before%20any%20read%3B%20one%20retry%20only%2C%20with%20success%20on%20attempt%202%20and%20one%20total%20read.%20No%20generic%20retry%20policy%20is%20applied.%0A-%20**Unknown%3A**%20explicitly%20simulated%20response%20loss%20after%20one%20read.%20Returns%20Unknown%20with%20no%20ticket%20payload%3B%20no%20automatic%20retry.%20All%20same-request%20replays%20preserve%20Unknown%20and%20never%20read%20again.%20This%20is%20a%20read-only%20cautionary%20example%20for%20writes%3A%20an%20ambiguous%20write%20would%20need%20reconciliation.%20No%20write%20action%20is%20implemented%20here.%0A%0AThe%20completed-request%20cache%20holds%20at%20most%20128%20records.%20It%20refuses%20new%20requests%20at%20capacity%20instead%20of%20evicting%20earlier%20records%2C%20so%20an%20Unknown%20record%20cannot%20be%20evicted%20and%20inadvertently%20executed%20again%20in%20the%20same%20session.%20Existing%20records%20can%20still%20replay%20after%20validation%20and%20approval.%20Open%20a%20new%20session%20to%20start%20a%20fresh%20demo%20after%20reaching%20capacity.%0A%0AThe%20invocation%20counter%20accumulates%20for%20the%20entire%20scoped%20executor%2C%20including%20identity%2Fscenario%20changes%3B%20it%20does%20not%20reset%20with%20the%20editor.%20Validation%2C%20approval%2C%20denials%2C%20conflicts%20and%20cached%20replays%20add%20no%20reads.%0A%0A%23%23%20Approval%2C%20cache%20and%20audit%20are%20temporary%0A%0AApproval%2C%20cache%20and%20audit%20live%20only%20in%20the%20scoped%20in-memory%20session.%20They%20vanish%20when%20the%20circuit%2Fsession%20is%20disposed%20or%20the%20app%20restarts.%20A%20disconnected%20circuit%20may%20be%20retained%20briefly%20by%20Blazor%3B%20this%20is%20not%20durable%20storage.%20A%20new%20session%20has%20no%20approval%20or%20deduplication%20history.%20**This%20lab%20makes%20no%20persisted%20or%20durable%20exactly-once%20guarantee.**%20Read-only%20fixtures%20mean%20repeated%20reads%20across%20new%20sessions%20do%20not%20mutate%20anything.%0A%0AEvery%20invocation%20decision%20adds%20an%20%60AuditEntry%60%20with%20only%20request%20ID%2C%20validated%20tool%20and%20ticket%20ID%2C%20resolved%20demo%20caller%2C%20outcome%2C%20attempts%2C%20replay%20and%20Unknown%20flags.%20Invalid%20proposals%20use%20%60-%60%20identifiers%20and%20unknown%20identities%20use%20%60unrecognized%60%3B%20raw%20JSON%2C%20arbitrary%20caller%20text%20and%20ticket%20content%20are%20never%20logged.%20Audit%20is%20a%20session-scoped%20FIFO%20bounded%20to%20the%20latest%20128%20decisions.%20Replays%20retain%20the%20original%20execution%27s%20attempt%20count%20and%20carry%20a%20separate%20replay%20flag.%0A%0A%23%23%20UI%20behavior%20and%20integration%20selectors%0A%0AStarts%20with%20the%20valid%20DEMO-104%20proposal%2C%20%60billing%60%2C%20%60normal%60%2C%20and%20counter%200.%20Controls%20wait%20for%20the%20interactive%20circuit%20(%60interactiveReady%60).%20Every%20proposal%20keystroke%2C%20identity%20change%20or%20scenario%20change%20clears%20review%2C%20approval%20and%20result%2C%20revokes%20the%20server%20approval%2C%20and%20assigns%20a%20fresh%20request%20ID.%20Denied%20execution%20remains%20disabled%3B%20the%20service%20also%20enforces%20the%20boundary%20if%20called%20directly.%0A%0A%7C%20ID%20%7C%20Element%20%2F%20purpose%20%7C%0A%7C%20---%20%7C%20---%20%7C%0A%7C%20%60lookup-proposal%60%20%7C%20textarea%2C%20maxlength%204000%20%7C%0A%7C%20%60lookup-identity%60%20%7C%20select%3A%20billing%20%2F%20technical%20%2F%20no-access%20%7C%0A%7C%20%60lookup-scenario%60%20%7C%20select%3A%20normal%20%2F%20transient%20%2F%20unknown%20%7C%0A%7C%20%60validate-tool%60%20%7C%20validate%20and%20authorize%20without%20reading%20%7C%0A%7C%20%60approve-tool%60%20%7C%20bind%20the%20server-held%20approval%20snapshot%20%7C%0A%7C%20%60execute-tool%60%20%7C%20invoke%20once%20after%20approval%20%7C%0A%7C%20%60replay-tool%60%20%7C%20replay%20the%20exact%20current%20request%20%7C%0A%7C%20%60lookup-status%60%20%7C%20live%20status%20%7C%0A%7C%20%60lookup-result%60%20%7C%20named%20result%20region%20%7C%0A%7C%20%60lookup-audit%60%20%7C%20named%20session%20audit%20region%20%7C%0A%7C%20%60invocation-count%60%20%7C%20numeric%20cumulative%20session%2 %20separate%20FIFO%20of%20at%20most%20128%20entries.%20No%20external%20dependencies%20or%20data%20stores.%0A%0AUI%20follows%20the%20prior%20ticket-summary%20lab%3A%20EmptyBuilder%2C%20static%20web%20assets%2C%20InteractiveServer%2C%20readiness%20guard%2C%20128%20KiB%20transport%2C%20independently%20enforced%204000-character%20JSON%20limit.%20Dark%20Material%20Blue%20colors%20and%20Segoe%20UI%2FCascadia%20fonts%20follow%20the%20requested%20academy%20tokens.%20Two%20work%20panels%20show%20proposal%20and%20approval%3B%20result%20and%20session%20audit%20follow%20below%2C%20stacking%20at%20mobile%20widths.%0A%0A1.%20Write%20real%20parser%2Fport%20tests%20in%20Verification%2FVerify.cs%3B%20observe%20failure%2C%20implement%20strict%20contract%20and%20loopback%20port%20configuration%2C%20rerun.%0A2.%20Write%20real%20executor%20tests%20for%20authorization%2C%20approval%20lifecycle%2C%20cached%20authorization%2C%20concurrent%20duplicates%2C%20conflicts%2C%20retry%2C%20unknown%20outcomes%2C%20bounds%20and%20session%20isolation%3B%20observe%20failure%2C%20implement%20Services%2FLookupExecutor.cs%2C%20rerun.%0A3.%20Connect%20Components%2FPages%2FHome.razor%20to%20the%20same%20executor.%20Every%20edit%20revokes%20approval%20and%20clears%20review%2Fresult%20with%20a%20fresh%20request%20ID.%20Replay%20uses%20the%20exact%20previous%20request.%0A4.%20Build%20and%20run%20verification%3B%20inspect%20local%20HTTP%2Fstatic%20assets%2C%20stop%20the%20owned%20host%2C%20and%20deliver%20README%20with%20API%20contract%20and%20complete%20source%20manifest.%20Main%20owns%20wider%20website%2Ftesting%2Fpackaging.%0A%0ATest%20expectations%20use%20literal%20outcomes%20and%20real%20local%20reads%2C%20without%20mocks.%20Failure%20scenarios%20are%20explicit%20supported%20demo%20inputs%2C%20not%20test%20hooks.%20Cache%20and%20audit%20disappear%20with%20the%20scoped%20session%20or%20process%3B%20no%20durable%20exactly-once%20guarantee.%0A"};</script>

      dotnet:{title:'Think of a dataset as a list of typed rows.',text:'You can represent one labelled example with a small C# class. The lab will load a file into rows like this. This first shape is illustrative; the supplied lab includes its full model classes.',code:'public sealed class SupportMessage\n{\n    public string Text { get; set; } = "";\n    public string Label { get; set; } = "";\n}\n\n// One row: Text = "I was charged twice"\n//          Label = "Billing"',label:'C# · one example as a typed object',contribution:'You define the input rows for a future SupportDesk category classifier.',next:'Separate what the model receives from what it is trying to predict.'}

      takeaway:'Labels are reviewed target answers. Predictions are the model’s proposed answers for comparison or review.',
      example:{title:'The answer is present during training, absent on a new request.',input:'“The upload screen freezes.”',paths:[{title:'A labelled training row',detail:'A reviewer identified an application failure.',result:'Label: Technical',tone:'accent'},{title:'A new prediction request',detail:'Only message text arrives at the model.',result:'Prediction: a proposed category',tone:'neutral'}],explanation:'When we evaluate, we compare the proposal with a separate reviewed label. At inference time in the real application, staff may supply the accepted category later.'},
      experiment:'ml-labels',exercise:'Choose a reviewed category for three clearly described messages, then inspect what happens when the message is ambiguous.',
      quiz:{question:'What is the label for a training row?',options:[{text:'The HTTP route used to call the API.',why:'The route is an application address, not the target answer attached to the example.'},{text:'Whatever the model happens to predict.',why:'A model prediction is a proposal. The reviewed label is the answer used to teach or evaluate it.'},{text:'The reviewed target category, such as Billing.',why:'Correct. The training example includes a reference answer the learner can compare its behavior against.'}],answer:2},
      dotnet:{title:'Keep input and prediction types distinct.',text:'The lab uses ML.NET column attributes for predicted output. A prediction request needs Message, while training rows also contain a category. These names describe responsibilities; use the supplied lab for the full compiled definitions.',code:'// Training row: Message + reviewed Category\n// Prediction input: Message\n// Prediction output: PredictedCategory\n\n// Never copy the model proposal into the reviewed\n// label merely to make evaluation look correct.',label:'Data contract · input, label, and prediction',contribution:'You establish the three category meanings for SupportDesk.',next:'Check whether your examples are consistent and appropriate to learn from.'}
    }),
    make({
      id:'clean-examples',title:'Good examples matter more than extra rows',short:'Check data quality',minutes:10,prerequisites:['target-labels'],
      objective:'Recognize missing text, conflicting labels, duplicates, and overly narrow examples before training.',
      summary:'More examples help only when they describe the right task.',
      definition:['Data quality','How suitable, consistent, and relevant your examples are for the task you want the model to learn.'],
      paragraphs:[
        'A blank message labelled Billing does not teach the meaning of a payment question. Two identical messages with different labels may reveal a labelling mistake or a rule that reviewers have not agreed on.',
        'Duplicates can also mislead you. Copying the same message many times increases the file size without adding new wording. If a duplicate appears in both training and testing, the test no longer cleanly represents unseen examples.',
        'Coverage matters too. Include examples for each category and variations in how people express the same need. A dataset containing only “refund” messages cannot teach the model the range of Account or Technical issues.',
        'Our downloadable files use fictional messages and intentionally small datasets. For real work, define appropriate data access and review before using messages that may contain personal or confidential information. Data preparation is an engineering step, not a reason to copy customer records into a learning project.'
      ],
      takeaway:'Check content and labels, not just row counts. Review ambiguous examples instead of guessing their answers.',
      example:{title:'Two rows can disagree before a model is involved.',input:'Row A: “Reset my password” → Account. Row B: “Reset my password” → Billing.',paths:[{title:'What the rows say',detail:'The same input has conflicting target answers.',result:'Review the labels',tone:'accent'},{title:'What not to assume',detail:'The trainer cannot resolve your undefined policy.',result:'More training is not the first fix',tone:'neutral'}],explanation:'Some messages genuinely have several meanings, but the single-category task needs a clear labelling policy. The tiny lab includes a dataset-separation check, not a comprehensive data-governance system.'},
      experiment:'ml-quality',exercise:'Decide whether an example can be used, needs review, or should be removed from this small teaching dataset.',
      quiz:{question:'What should you do first with identical messages carrying conflicting labels?',options:[{text:'Review the examples and clarify the category policy.',why:'Correct. Resolve the inconsistency or identify genuine ambiguity before using the rows as trusted examples.'},{text:'Copy both rows ten more times.',why:'Repeating the conflict does not add clarity. It amplifies inconsistent teaching examples.'},{text:'Hide the conflict and report only the best model result.',why:'That would conceal a data problem. Inspecting failures is part of building a useful application.'}],answer:0},
      dotnet:{title:'Validate training inputs like other application data.',text:'Reject empty text and unknown categories before fitting the pipeline. The lab’s verification checks basic dataset structure and separation; a real application needs a broader review process.',code:'if (string.IsNullOrWhiteSpace(row.Text))\n    throw new InvalidDataException("Message is empty.");\n\nvar allowed = new[] { "Billing", "Account", "Technical" };\nif (!allowed.Contains(row.Label))\n    throw new InvalidDataException("Unknown category.");',label:'C# · illustrative input validation',contribution:'You define simple checks before SupportDesk learns from reviewed messages.',next:'Keep a separate set of examples for a meaningful first evaluation.'},reference:'ml-data'
    }),
    make({
      id:'train-test-split',title:'Keep test messages out of training',short:'Separate training and testing',minutes:10,prerequisites:['clean-examples'],
      objective:'Explain why evaluation needs messages the training process has not used.',
      summary:'An exam should not simply repeat the answers used during practice.',
      definition:['Held-out test set','Reviewed examples kept separate from training, then used to check the trained model on unseen inputs.'],
      paragraphs:[
        'Imagine studying six practice questions and then taking an exam with exactly the same six questions. A high score would not tell you much about handling new situations.',
        'A classifier needs a similar separation. Training examples teach the model patterns. Test examples check the result after training. Both sets have reviewed categories, but only the training set should be passed to Fit.',
        'Our lab supplies separate train.tsv and test.tsv files. A TSV is a text file whose columns are separated by tab characters. Each file contains Label and Text columns: the category answer and the message input. The lab checks that their message texts do not overlap.',
        'A random split is not always enough for real systems. Similar tickets, the same customer conversation, or future information can still leak across a split. As you improve a model repeatedly, use a validation process for tuning and reserve a final test set for an independent check. This first lab keeps the workflow small so the separation is easy to inspect.'
      ],
      takeaway:'Fit on training rows. Evaluate on separate reviewed rows. Do not train on the test set to improve its score.',
      example:{title:'The two files serve different jobs.',input:'You have reviewed support messages with known categories.',paths:[{title:'train.tsv',detail:'Read these examples inside the learning process.',result:'Used by Fit',tone:'accent'},{title:'test.tsv',detail:'Use these after the model is trained.',result:'Used by evaluation',tone:'neutral'}],explanation:'A test label lets us check the prediction. It must not be included among the input features or passed into the training run that is being evaluated.'},
      experiment:'ml-split',exercise:'Place a teaching example in training or testing. Watch why reusing the same message in both creates misleading evidence.',
      quiz:{question:'Which input should you pass to pipeline.Fit?',options:[{text:'The combined training and test rows, then report the test result as unseen performance.',why:'This allows the learner to see its exam examples. The reported test score would not measure held-out behavior.'},{text:'Only the training rows, keeping the test rows for evaluation.',why:'Correct. The model learns from training rows; the separate test rows check its behavior afterward.'},{text:'Only the test labels, with no message text.',why:'Labels alone do not show the relationship between messages and categories.'}],answer:1},
      dotnet:{title:'Keep the boundary visible in code.',text:'IDataView is ML.NET’s table-like data interface. Loading a file is not the same as training. The important boundary is which table you pass to Fit.',code:'IDataView trainingData = LoadTrainingRows();\nIDataView testData = LoadTestRows();\n\nITransformer model = pipeline.Fit(trainingData);\nIDataView predictions = model.Transform(testData);\n\n// LoadTrainingRows/LoadTestRows are explanatory\n// names here; the lab supplies the actual file loader.',label:'C# · illustrative train/test boundary',contribution:'You separate SupportDesk training examples from evaluation evidence.',next:'Build the small ML.NET pipeline that prepares inputs and learns categories.'}
    }),
    make({
      id:'mlnet-pipeline',title:'Train your first ML.NET text pipeline',short:'Build and train the pipeline',minutes:15,prerequisites:['train-test-split'],
      objective:'Identify input preparation, category learning, and output conversion in a small ML.NET pipeline.',
      summary:'A pipeline puts preparation and learning steps in a repeatable order.',
      definition:['Pipeline','A sequence of data-preparation and learning operations. Calling Fit runs the learning process and returns a reusable trained model.'],
      paragraphs:[
        'Install Microsoft.ML in a C# console project. MLContext is the main starting object for ML.NET operations, similar to a context that groups related library services. Our lab supplies the complete project and package version.',
        'The first pipeline step maps category strings such as Billing to numeric keys in a Label column. MapValueToKey performs that conversion. The next step, FeaturizeText, turns the message Text column into a numeric Features column.',
        'A multiclass trainer learns to choose one of several categories from those features. Our example uses SdcaMaximumEntropy. You do not need to memorize the algorithm name: first understand that it learns a relationship between input features and target labels.',
        'MapKeyToValue turns the predicted numeric category back into readable text. Calling Fit on the training rows builds the fitted transforms and classifier. Defining the steps alone does not train anything. The fitted preparation steps must stay with the classifier when you save it.'
      ],
      takeaway:'Define the preparation and learner, then call Fit with training data to obtain a model you can use.',
      example:{title:'The message moves through one reusable pipeline.',input:'Message: “The upload button freezes.” Category on the training row: Technical.',paths:[{title:'Prepare inputs and labels',detail:'Category → Label key; Message → Features.',result:'Numeric columns the trainer can use',tone:'accent'},{title:'Learn and decode',detail:'Train category selection; turn the result back into text.',result:'A reusable text classifier',tone:'neutral'}],explanation:'The browser exercise illustrates the operation order. The desktop lab runs these operations with the actual Microsoft.ML package and synthetic files.'},
      experiment:'ml-pipeline',exercise:'Assemble the preparation, training, and readable-output steps. See which operation actually starts learning.',
      quiz:{question:'What actually starts the training process?',options:[{text:'Adding a using Microsoft.ML statement.',why:'That makes library names available to C# code. It does not read examples or train a model.'},{text:'Displaying a predicted label in Blazor.',why:'Displaying an existing output is application UI work, not training.'},{text:'Calling Fit with the training data on the defined pipeline.',why:'Correct. Fit learns from those rows and returns the fitted transforms and model.'}],answer:2},
      dotnet:{title:'Four named steps, one Fit call.',text:'This is the core pattern used in the supplied lab. The surrounding lab defines its input types, reads data, saves a model, and handles failures.',code:'var pipeline = ml.Transforms.Conversion\n    .MapValueToKey("Label", "Label")\n    .Append(ml.Transforms.Text\n        .FeaturizeText("Features", "Text"))\n    .Append(ml.MulticlassClassification.Trainers\n        .SdcaMaximumEntropy("Label", "Features"))\n    .Append(ml.Transforms.Conversion\n        .MapKeyToValue("PredictedLabel"));\n\nvar model = pipeline.Fit(trainingData);',label:'C# · core ML.NET pipeline pattern',contribution:'You can train a real first category classifier for SupportDesk.',next:'Measure its output on the separate test messages.',lab:true}
    }),
    make({
      id:'evaluate-model',title:'Evaluate predictions and inspect the mistakes',short:'Measure and inspect mistakes',minutes:12,prerequisites:['mlnet-pipeline'],
      objective:'Compare held-out predictions with reviewed labels and interpret an accuracy count without overstating it.',
      summary:'A score starts a conversation; the failed examples explain what to improve.',
      definition:['Accuracy','The fraction of evaluated examples whose predicted category matches the reviewed category. A small or unrepresentative test set can give a misleading impression.'],
      paragraphs:[
        'Once the model is trained, run each held-out message through it and compare the proposed category with its reviewed label. Count how many match. If four of five match, the accuracy on those five examples is 80 percent.',
        'That number describes those examples, not every future support request. A tiny synthetic test set is useful for learning the workflow. It is not evidence of performance with your customers or a promise that the model beats a simple rule.',
        'Inspect the mismatches. “The refund screen crashes” might be a Technical issue even though it contains a payment word. Ask whether the label is consistent, the training examples cover the wording, and the category boundaries fit the application.',
        'Compare your model with the earlier keyword baseline on the same held-out examples. Include the error consequences in the decision. Our lab reports both results, and it is acceptable for the small model to lose. Do not repeatedly train on test messages to make the comparison look better.'
      ],
      takeaway:'Report the dataset and count, inspect the errors, and compare against a baseline before claiming an improvement.',
      example:{title:'One result can hide the most important failure.',input:'An illustrative evaluation matches 4 of 5 reviewed examples.',paths:[{title:'The headline count',detail:'Four predictions match their reviewed labels.',result:'80% on this five-row example',tone:'accent'},{title:'The engineering question',detail:'Which message failed, and what happens if staff accept it?',result:'Inspect the mismatch',tone:'neutral'}],explanation:'The figures in this worked example are authored for teaching. The runnable lab prints its own measured counts and per-message results; its numbers can differ.'},
      experiment:'ml-evaluate',exercise:'Reveal a five-message evaluation. Count matches and inspect the wrong prediction instead of stopping at a percentage.',
      quiz:{question:'A toy test reports 100% accuracy. What can you safely conclude?',options:[{text:'All evaluated toy examples matched their reviewed labels; broader quality is still unproven.',why:'Correct. The result describes that test set. More representative held-out evaluation and failure analysis are still needed.'},{text:'The application will never route a real customer message incorrectly.',why:'The test cannot cover every future message or ambiguity. Perfect toy-data results do not guarantee real-world behavior.'},{text:'The model no longer needs application validation or human review.',why:'Model evaluation does not replace authorization, input validation, or decisions about uncertain actions.'}],answer:0},
      dotnet:{title:'Evaluate the model and baseline on the same rows.',text:'The lab runs the saved model against held-out rows and also applies the rules baseline. Its output includes the denominator, predicted and reviewed categories, and mismatches.',code:'var classifier = new SupportClassifier();\nvar saved = classifier.Load();\nvar rows = LabData.Load("test.tsv");\nvar report = classifier.Evaluate(saved, rows);\n\nConsole.WriteLine($"{report.Correct}/{report.Total}");\nreport.Print(); // Counts, baseline, and wrong cases',label:'C# · evaluation flow used by the lab',contribution:'You can report honest evidence for the SupportDesk classifier.',next:'Save the fitted pipeline and reuse it for new requests.',lab:true},reference:'ml-evaluation'
    }),
    make({
      id:'save-load',title:'Save the model, then use it from C#',short:'Save, load, and predict',minutes:12,prerequisites:['evaluate-model'],
      objective:'Save and reload the fitted model without retraining for each new prediction.',
      summary:'Training produces an artifact your application can reuse.',
      definition:['Model artifact','A saved representation of a fitted model and its required preparation steps. The application loads it to perform inference.'],
      paragraphs:[
        'After training, save the fitted pipeline to a model file. Keep the text preparation steps with the classifier: a new message must be represented in the same way as the training messages.',
        'A later C# process loads that file and predicts a category for new text. It does not need to train again for each request. In our console lab, train writes the artifact and predict loads it.',
        'Keep the training and prediction commands separate so you can observe the difference. Run a prediction, close the process, then run another prediction. The model is reused; it has not learned from those new messages merely because you called it.',
        'The first lab is a console application. When you later integrate with ASP.NET Core, keep the model behind a service boundary and use a suitable concurrent prediction pattern. PredictionEngine is intended for one-at-a-time use and must not be shared unsafely across concurrent HTTP requests. Also validate input, handle model-version and loading failures, and keep staff review of the category suggestion.'
      ],
      takeaway:'Train deliberately. Save the fitted pipeline. Load it for inference, and keep application responsibilities around it.',
      example:{title:'Two separate commands use one saved artifact.',input:'First: train on reviewed examples. Later: receive “My password reset link expired.”',paths:[{title:'Training command',detail:'Fit on train.tsv and save the model.',result:'A model file',tone:'accent'},{title:'Prediction command',detail:'Load that file and process new message text.',result:'A category suggestion',tone:'neutral'}],explanation:'The saved file is not the training dataset. Loading it restores learned behavior and transforms. A new model version should be evaluated before replacing one in an application.'},
      experiment:'ml-lifecycle',exercise:'Choose the correct operation when the model file exists, when it is missing, and when reviewed data changes.',
      quiz:{question:'A new support message arrives after the model was saved. What should the console app do?',options:[{text:'Add the unknown message to the test set and claim its predicted category is the correct label.',why:'An unchecked prediction is not a reviewed label. That would manufacture misleading evaluation evidence.'},{text:'Load the saved model and request a prediction, while validating the input.',why:'Correct. This is inference. Training is a separate operation, and the returned category is still a suggestion.'},{text:'Train the model again for every message even if no reviewed examples changed.',why:'That repeats work unnecessarily and mixes training with serving requests. Load and reuse the evaluated model instead.'}],answer:1},
      dotnet:{title:'Finish the first learned SupportDesk component.',text:'Use the downloadable lab to run train, evaluate, and predict in separate processes. The following calls illustrate the save/load boundary. The lab includes the concrete classes and paths.',code:'ml.Model.Save(model, trainingData.Schema, path);\n\nvar loaded = ml.Model.Load(path, out var schema);\nusing var engine = ml.Model.CreatePredictionEngine<\n    SupportMessage, SupportPrediction>(loaded);\n\nvar suggestion = engine.Predict(new SupportMessage\n{\n    Text = "My password reset link expired"\n});',label:'C# · illustrative saved-model reuse',contribution:'You have a trained, evaluated, reusable classifier to compare with the original C# rule.',next:'Run the full classifier lab. Continue into the available Language models in C# unit, starting with generated text and its limits.',lab:true},reference:'ml-save'
    })

    'ml-data':{title:'Microsoft Learn: Prepare data for ML.NET',url:'https://learn.microsoft.com/en-us/dotnet/machine-learning/how-to-guides/prepare-data-ml-net',note:'More detail about features, labels, and preparation after you finish the lesson.'},
    'ml-evaluation':{title:'Microsoft Learn: Evaluate an ML.NET model',url:'https://learn.microsoft.com/en-us/dotnet/machine-learning/resources/metrics',note:'Official guidance on evaluation metrics. Start with the lesson’s correct-count example before exploring more metrics.'},
    'ml-save':{title:'Microsoft Learn: Save and load trained models',url:'https://learn.microsoft.com/en-us/dotnet/machine-learning/how-to-guides/save-load-machine-learning-models-ml-net',note:'Official save/load guidance for the artifact boundary shown in our lab.'}
