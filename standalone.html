  <script>
/* Unit 5: fictional, read-only tool lessons. All browser results are authored. */
(function(root,factory){
  const content=factory();
  if(typeof module==='object'&&module.exports)module.exports=content;
  else root.AcademyToolsContent=content;
})(typeof globalThis!=='undefined'?globalThis:this,function(){
  'use strict';
  const make=value=>({...value,unitId:'tools-actions',conceptId:value.id,labId:'ticket-lookup'});
  const lessons=[
    make({
      id:'tool-function',title:'A tool is a callable function',short:'Callable functions',minutes:8,prerequisites:['compare-prompts'],
      objective:'Connect a named tool to one application function and explain why a proposal cannot run arbitrary code.',
      summary:'The model may request a capability. Your application chooses the allowed functions and owns their execution.',
      definition:['Tool','A named capability with an input contract that application code can validate and invoke. A tool description does not grant permission.'],
      paragraphs:[
        'SupportDesk can summarize a ticket supplied by staff. Its next small capability is looking up a fictional ticket summary. A tool named lookup_ticket points to an ordinary C# function. It accepts a ticket identifier such as DEMO-104 and returns a short fictional summary. Think of a controller calling a service method: a name and arguments describe a request; application code performs the work.',
        'Expose a small allowlist of capabilities. In this unit the only allowed name is lookup_ticket. A request for refund_customer or run_sql must be rejected even if it sounds helpful. The application maps the allowed name directly to its known function. It does not compile generated C#, evaluate expressions, use reflection to discover a method, or execute text returned by a tool.',
        'Our local normalized proposal is {"tool":"lookup_ticket","arguments":{"ticketId":"DEMO-104"}}. This is a teaching contract, not literal OpenAI wire format. In a real provider integration, an adapter would map the documented function name, argument JSON, and call ID into application values, then associate any returned result with that provider call. No adapter or model provider is implemented here.',
        'The exercise asks you to select the allowlisted capability. Every displayed proposal and result is authored, and there are no API calls. The ticket-lookup lab remains synthetic and read-only: no database, network, or business writes. Even a read needs validation and permission checks because showing someone another caller’s ticket can disclose information.'
      ],
      takeaway:'A tool is a narrow function your application exposes, not permission to run whatever code a model invents.',
      example:{title:'Route one known name to one known capability.',input:'Request: show the summary of fictional ticket DEMO-104.',paths:[{title:'lookup_ticket',detail:'Maps directly to a read-only C# function with a ticketId argument.',result:'Allowed name; further checks still required',tone:'accent'},{title:'refund_customer',detail:'Not in this lab’s allowlist, regardless of any explanation supplied.',result:'Reject before invocation',tone:'neutral'}],explanation:'An allowlist limits which capability can be considered. It does not validate its arguments, authorize the caller, or approve an invocation.'},
      experiment:'tools-function',exercise:'Choose a callable capability and inspect why only the allowlisted name can proceed.',
      quiz:{question:'A proposal requests run_sql, which the application never registered. What should happen?',options:[{text:'Reject the name before any function is invoked.',why:'Correct. Application routing must enforce the allowlist. A persuasive explanation cannot add a capability.'},{text:'Generate a C# method with that name and execute it.',why:'The lab routes to a known function; generated code is not an allowed execution path.'},{text:'Run it because the prompt asked for helpful behavior.',why:'A prompt describes behavior; it cannot authorize a capability.'}],answer:0},
      dotnet:{title:'Use a small typed proposal, then allowlist the name.',text:'Illustrative C# application fragments, not a complete program or provider SDK types. The ordinary function returns only fictional text. Its caller must enforce the later validation, permission, and explicit approval gates before invoking it.',code:'public sealed record LookupArguments(string TicketId);\npublic sealed record ToolProposal(\n    string Tool, LookupArguments Arguments);\n\n// Ordinary function; this declaration does not run it.\nstatic string LookupTicket(LookupArguments args) =>\n    args.TicketId == "DEMO-104"\n        ? "Fictional ticket: export error; open."\n        : "Ticket unavailable.";\n\nvar proposal = new ToolProposal(\n    "lookup_ticket", new LookupArguments("DEMO-104"));\nbool knownTool = proposal.Tool == "lookup_ticket";\n// This known name maps to LookupTicket.\n// Reject unknown names; do not invoke before all gates pass.',label:'C# · local proposal and allowlist',contribution:'SupportDesk gets one explicit read capability with a reviewable name and input shape.',next:'Validate the argument JSON before trusting a typed value.'},reference:'tl-functions'
    }),
    make({
      id:'tool-arguments',title:'Typed arguments',short:'Typed arguments',minutes:10,prerequisites:['tool-function'],
      objective:'Separate JSON parsing, exact argument validation, and C# mapping from permission and approval.',
      summary:'A typed argument is useful only after its field names, values, and input bounds have been checked.',
      definition:['Argument contract','The exact fields and values a function accepts. This lab accepts only tool and arguments, with only ticketId inside arguments.'],
      paragraphs:[
        'The lookup accepts a ticket identifier, not a free-form instruction. Require the exact case-sensitive fields tool and arguments, and require exactly ticketId inside arguments. Tool must be lookup_ticket; ticketId must be a string matching DEMO- followed by exactly three ASCII digits, such as DEMO-104. Reject nulls, arrays, missing fields, extra fields, and values such as DEMO-104 followed by a newline.',
        'Limit the proposal to 4000 UTF-16 code units before parsing. The C# lab also rejects duplicate JSON properties and depth above six. Duplicate keys are dangerous because different parsers can interpret the same text differently. A DTO constructor does not make hostile JSON safe: check the raw document and values, then map them into ToolProposal(Tool, LookupArguments) and LookupArguments(TicketId).',
        'The browser exercise uses JSON.parse followed by exact shape and value checks. JSON.parse keeps the last duplicate key, and this small teaching validator does not independently enforce a parser depth limit. Its accepted message therefore means local shape accepted, not server-approved. The C# validator is the stronger boundary and must reject duplicates and enforce MaxDepth = 6 before mapping.',
        'Identity and access scope are deliberately absent from model arguments. The app supplies its simulated demo caller context separately; a real service would obtain trusted context from its own identity system. Adding caller: admin to JSON is an unknown-field error, not a login. After valid mapping, the application must still authorize the target ticket and obtain explicit approval before invocation.'
      ],
      takeaway:'Validate bounded raw JSON and exact values before creating a trusted application proposal; identity comes from the app.',
      example:{title:'Correct JSON syntax does not mean correct arguments.',input:'{"tool":"lookup_ticket","arguments":{"ticketId":"DEMO-104","caller":"admin"}}',paths:[{title:'Parse syntax only',detail:'The text is valid JSON, but it contains an unexpected caller field.',result:'Insufficient validation',tone:'neutral'},{title:'Check the exact contract',detail:'Reject caller; require only ticketId. Obtain caller context from the app.',result:'Shape rejected; no read',tone:'accent'}],explanation:'A model-controlled identity field cannot establish authority. Even the valid two-level proposal still needs authorization and explicit approval.'},
      experiment:'tools-arguments',exercise:'Edit a bounded JSON proposal and inspect syntax, exact-field, type, and ticket-ID feedback.',
      quiz:{question:'The browser accepts JSON with a duplicate ticketId key. Can the C# lab trust that result?',options:[{text:'Yes, browser acceptance proves every parser agrees.',why:'JSON.parse collapses duplicates. A browser teaching check cannot replace the server boundary.'},{text:'No. Validate the raw JSON again, rejecting duplicates and excessive depth.',why:'Correct. The C# boundary enforces its own stronger parser and exact-value rules before DTO mapping.'},{text:'Yes, provided the JSON includes caller: admin.',why:'Caller is not an allowed argument. Application context supplies identity separately.'}],answer:1},
      dotnet:{title:'Check exact shape and values before mapping.',text:'Illustrative C# fragment after bounded JsonDocument parsing, duplicate-property rejection, and exact-key checks in the lab validator. MaxDepth limits nesting; a separate recursive property-name check rejects duplicates. Neither check authorizes a read.',code:'if (json.Length > 4000) return Invalid();\nusing var doc = JsonDocument.Parse(json,\n    new JsonDocumentOptions { MaxDepth = 6 });\n// First reject duplicate, missing, and unknown properties.\n// Then require string-valued tool and arguments.ticketId.\nstring id = doc.RootElement.GetProperty("arguments")\n    .GetProperty("ticketId").GetString()!;\nif (!Regex.IsMatch(id, @"\\ADEMO-[0-9]{3}\\z"))\n    return Invalid();\n// Map only after tool == "lookup_ticket" and all checks pass.\nvar proposal = new ToolProposal(\n    "lookup_ticket", new LookupArguments(id));',label:'C# · illustrative parser and value checks',contribution:'SupportDesk receives a bounded, explicit ticket ID rather than arbitrary instructions.',next:'Keep a validated proposal separate from an actual function invocation.'},reference:'tl-json'
    }),
    make({
      id:'tool-execution',title:'Tool selection versus execution',short:'Selection and execution',minutes:9,prerequisites:['tool-arguments'],
      objective:'Trace proposal, validation, authorization, approval, invocation, and result without confusing selection with action.',
      summary:'A proposal names an intended call. Only an explicitly gated application path may invoke the function.',
      definition:['Invocation','The application actually enters the allowed function. Receiving or validating a proposal is not an invocation.'],
      paragraphs:[
        'A returned tool proposal is data. It says which function a model would like the application to use and with which arguments. It does not prove the function ran, that a ticket exists, or that a caller may see it. In a .NET full-stack app, keep this proposal as a value your service can review before it calls the lookup function.',
        'Follow a visible sequence: propose, validate the contract, authorize the caller for the target, request explicit approval, then invoke. Authorization asks whether the caller may access the ticket. Approval asks whether this particular reviewed request should run now. This teaching lab requires both, including for its read-only function. A checkbox or a prompt sentence alone must not bypass service-side gates.',
        'The exercise starts with an invocation counter at zero. Creating a proposal and checking it leave the counter at zero. Clicking Invoke too early is blocked. Only after checks and explicit approval does the authored lookup run once and return its fictional summary. A repeat click shows the recorded result without increasing the counter, after the same request and caller checks.',
        'A real provider adapter would also preserve call correlation and handle the provider’s documented outputs before building this local proposal. These exercises omit that adapter entirely. Their Success and Unknown labels describe application outcomes, not literal provider statuses. No model runs, no customer data is read, and no remote request is made.'
      ],
      takeaway:'Selection creates data; invocation performs work. Keep the gate between them in application code.',
      example:{title:'A selected tool has not performed a lookup.',input:'Local proposal: lookup_ticket(DEMO-104). Invocation counter: 0.',paths:[{title:'Receive and validate proposal',detail:'The name and ticketId pass contract checks; no function has been entered.',result:'Counter remains 0',tone:'neutral'},{title:'Authorize, approve, and invoke',detail:'Application checks pass for the exact reviewed request and simulated caller.',result:'Counter becomes 1; fictional summary returned',tone:'accent'}],explanation:'Validation is not execution. A successful function result must come from the invocation path, not from a model sentence saying it completed.'},
      experiment:'tools-execution',exercise:'Step through the gates and watch when the invocation counter actually increases.',
      quiz:{question:'A valid proposal has arrived, but approval has not been granted. How many lookups should run?',options:[{text:'One, because selecting a tool executes it.',why:'A proposal is data. The application has not yet passed its invocation gates.'},{text:'One, because valid arguments also authorize the caller.',why:'Argument shape says nothing about caller permission or approval.'},{text:'Zero; the application must finish its checks and explicit approval first.',why:'Correct. Invocation begins only after all required application gates pass.'}],answer:2},
      dotnet:{title:'Put the checks on the invocation path.',text:'Illustrative service flow. ValidateContract, CanRead, and ApprovalMatches describe application checks, not provider SDK calls. Invoke must recheck authorization and exact approval immediately before a read or cached replay.',code:'// caller and requestId come from application context.\nif (!ValidateContract(proposal)) return Invalid();\nif (!CanRead(caller, proposal.Arguments.TicketId))\n    return TicketUnavailable();\nif (!ApprovalMatches(requestId, proposal, caller))\n    return ApprovalRequired();\nreturn Invoke(requestId, proposal, caller);\n// Invoke repeats permission and approval checks.\n// Then it returns a matching cache entry or performs one read.',label:'C# · illustrative invocation gates',contribution:'SupportDesk can distinguish an intended lookup from a recorded function result.',next:'Bind approval to the exact request and keep permissions current.'},reference:'tl-functions'
    }),
    make({
      id:'tool-authorization',title:'Authorization and approvals',short:'Permission and approval',minutes:10,prerequisites:['tool-execution'],
      objective:'Use app-supplied caller context, avoid ticket existence leaks, and invalidate approval when the reviewed request changes.',
      summary:'Permission and approval are distinct checks. Both must still match when the app reads or replays a result.',
      definition:['Request-bound approval','A decision bound to request ID, tool name, exact argument values, and caller context. Changing any of them invalidates the decision.'],
      paragraphs:[
        'The exercise supplies fake identities through a clearly labeled demo selector. Demo reader may see DEMO-104; demo guest may not. These are simulated permissions, not authentication. The model’s JSON contains only the function name and ticketId. Production identity would come from trusted application context, not a caller name proposed by a model or a browser field.',
        'For an inaccessible ticket and an unknown ticket, show the same generic message: Ticket unavailable. Do not reveal that DEMO-105 exists to a caller who cannot read it. The public result should not distinguish not-found from denied. The sample first checks the caller’s allowed scope before returning a summary, and never uses hidden record details in feedback.',
        'Explicit approval records the exact request ID, lookup_ticket name, ticketId, and demo caller context being reviewed. Editing the ticket ID or changing identity clears approval, even if you later change back. The application must obtain a fresh approval. Authorization cannot be bypassed by approving a request, and changing prompt text cannot grant access.',
        'Check permission again at Invoke, including before returning a cached result. Permission may have been revoked since the original read. The exercise includes a simulated revoke action so you can see replay blocked without another read or cached disclosure. The in-memory browser state is a teaching simulation; real server enforcement belongs on the service boundary.'
      ],
      takeaway:'The app owns caller context, rechecks access, and binds approval to exactly what was reviewed.',
      example:{title:'Approval does not travel with an edited ticket ID.',input:'Approve request demo-auth-1 for demo-reader and lookup_ticket(DEMO-104); then change ticketId.',paths:[{title:'Reuse the old approval',detail:'The reviewed argument no longer matches the current request.',result:'Blocked; approval invalidated',tone:'neutral'},{title:'Recheck and request fresh approval',detail:'Validate the new argument, authorize its scope, and approve that exact request.',result:'Read only if all gates pass',tone:'accent'}],explanation:'An authorized read still needs this lab’s explicit approval. An unauthorized or unknown target always produces the same generic unavailable message.'},
      experiment:'tools-authorization',exercise:'Change a simulated caller or ticket, approve a request, and revoke permission before a cached replay.',
      quiz:{question:'The caller loses ticket permission after a successful read. What should a matching cached replay do?',options:[{text:'Recheck permission and block disclosure with the generic unavailable message.',why:'Correct. Cached data is still protected; a previous success does not preserve revoked access.'},{text:'Return the cache because it performs no new read.',why:'Returning cached content still discloses ticket information and needs current authorization.'},{text:'Reveal that the ticket exists but hide its summary.',why:'That leaks existence. Unknown and inaccessible tickets use the same generic public message.'}],answer:0},
      dotnet:{title:'Compare the reviewed request as a value.',text:'Illustrative C# records and comparison. Immutable record value equality includes nested LookupArguments. CallerVersion represents the relevant app context revision; actual permission is still checked again at invoke and replay.',code:'public sealed record Approval(\n    string RequestId, ToolProposal Proposal,\n    string CallerId, int CallerVersion);\n\nbool Matches(Approval approved, string requestId,\n    ToolProposal proposal, DemoCaller caller) =>\n    approved.RequestId == requestId &&\n    approved.Proposal == proposal &&\n    approved.CallerId == caller.Id &&\n    approved.CallerVersion == caller.Version;\n// Clear approval on edits, even if values later change back.\n// Never accept caller identity from proposal.Arguments.',label:'C# · illustrative request-bound approval',contribution:'SupportDesk reviews a precise request without treating model text as identity or authority.',next:'Decide which failures can be retried and which results must remain unknown.'},reference:'tl-authorization'
    }),
    make({
      id:'tool-retries',title:'Retries and duplicate actions',short:'Retries and duplicates',minutes:12,prerequisites:['tool-authorization'],
      objective:'Bound retries to known failures before a read and distinguish a duplicate replay, argument conflict, and unknown result.',
      summary:'Retry only when you know the read did not start. Reuse one request ID for an exact replay; preserve uncertainty after a lost response.',
      definition:['Idempotent replay','Returning a recorded outcome for the same request ID and exact parameters, without performing the lookup again. This lab keeps records only in memory.'],
      paragraphs:[
        'Suppose the fictional lookup reports a known temporary failure before it reads any record. Because the operation has not reached the read, this lab permits one retry: at most two attempts in total. If both attempts fail at that same boundary, record a known Failed outcome with zero reads. Do not apply this policy to every exception; an unclassified failure may have occurred after work started.',
        'To handle a duplicate submission, the app assigns a request ID outside model arguments. For the same caller, tool, and exact argument values, a completed record can be replayed without another read. JSON whitespace or property order is irrelevant after validated mapping. Reusing that ID with changed arguments produces Conflict. A different caller cannot reuse the record to retrieve its result.',
        'A lost response after the read is different. The execution path crossed the read boundary, but a trustworthy result did not reach the result-recording boundary. Record Unknown, not Success, and do not retry automatically. Reconcile with reliable execution evidence or let a human deliberately request a separate read. A new read may return current information; it does not prove what the original response contained.',
        'The exercise offers fixed success, temporary-before-read, repeated-temporary-failure, and lost-after-read scenarios. Replay preserves the recorded outcome and checks authorization and approval again. All state disappears on reset, remount, or page reload. This is memory-only deduplication, not durable exactly-once execution. Writes require a separate, much stronger design and are not implemented.'
      ],
      takeaway:'Bound known-safe retries, replay exact requests, reject changed parameters, and preserve Unknown when delivery is uncertain.',
      example:{title:'Two failures need different recovery paths.',input:'Same read-only function; different evidence about where the failure occurred.',paths:[{title:'Known transient before read',detail:'Attempt 1 fails before reading. Attempt 2 returns the fictional summary.',result:'Success; 2 attempts, 1 read',tone:'accent'},{title:'Response lost after read',detail:'The result cannot be confirmed at the recording boundary.',result:'Unknown; 1 attempt, no automatic retry',tone:'neutral'}],explanation:'A safe retry requires positive evidence that no read began. A timeout alone is insufficient. An Unknown record must not be converted into success or rerun by pressing Replay.'},
      experiment:'tools-retries',exercise:'Run a fixed failure scenario, replay the same request, and try conflicting arguments under the same ID.',
      quiz:{question:'A response is lost after a read and the result cannot be confirmed. What is the correct recorded outcome?',options:[{text:'Success, because a read probably happened.',why:'Work crossing the read boundary does not establish a delivered, trustworthy result.'},{text:'Unknown; stop automatic retries and reconcile or arrange a human-controlled read.',why:'Correct. Preserve uncertainty rather than hiding it with success or an automatic repeat.'},{text:'Retry until a response arrives, with no attempt limit.',why:'Only known transient failures before the read are eligible for this lab’s bounded retry.'}],answer:1},
      dotnet:{title:'Retry only an explicitly known boundary failure.',text:'Illustrative C# fragment. DemoTransientBeforeRead is raised only by the synthetic pre-read hook. InvokeOnce checks current permission and exact approval before either a read or replay. An unknown result is recorded and held, not automatically retried.',code:'for (int attempt = 1; attempt <= 2; attempt++)\n{\n    try { return InvokeOnce(request, caller, attempt); }\n    catch (DemoTransientBeforeRead)\n    {\n        if (attempt == 2) return RecordFailed(request);\n    }\n    catch (DemoResponseLostAfterRead)\n    {\n        return RecordUnknown(request); // No automatic retry.\n    }\n}\nthrow new InvalidOperationException("Unreachable");\n// Same ID + exact parameters: replay after current gates.\n// Same ID + changed parameters: Conflict; no second read.',label:'C# · illustrative bounded retry policy',contribution:'SupportDesk separates safe retry evidence from duplicate submissions and uncertain delivery.',next:'Record enough evidence to explain the outcome without logging sensitive ticket payloads.'},reference:'tl-retries'
    }),
    make({
      id:'tool-audit',title:'Audit trails and unknown results',short:'Audit and uncertainty',minutes:9,prerequisites:['tool-retries'],
      objective:'Read a minimal audit trace and distinguish a known outcome, a replay, and an unresolved result.',
      summary:'Record what the application knows, including uncertainty, without storing secrets or complete ticket content.',
      definition:['Audit trail','A sequence of application events that connects a request, caller, tool, target, attempts, and outcome so a reviewer can understand what occurred.'],
      paragraphs:[
        'When someone asks what the assistant did, a fluent reply is not enough evidence. Connect the application request ID to the tool name, fictional ticket ID, simulated caller, attempt count, replay flag, and outcome. Known outcomes include Success, Blocked, Invalid, Conflict, and a known Failed-before-read result. Unknown explicitly records an unresolved result. These are local application labels, not provider wire statuses.',
        'Record a replay as a new event linked to the same request, with replay true and no additional read. Keep the original attempt count so a reviewer can distinguish two execution attempts from two clicks that returned one recorded outcome. If permission is revoked, audit the blocked replay without exposing the cached summary. A browser trace here is authored and volatile, not a production audit store.',
        'Do not log API keys, tokens, full model prompts, or complete sensitive ticket payloads. A compact event containing the request, tool, caller, target identifier, and outcome is enough for this fictional lesson. In a real system, protect identifiers too, apply retention and access controls, and store only the evidence necessary for review. Never copy untrusted argument text directly into an audit field.',
        'Unknown must remain visible until reliable evidence resolves it. Do not rewrite it to Success because the model says done, and do not automatically repeat a possibly completed action. This lab has only local fictional reads; a deliberate human-controlled new read is a separate request. Run the ticket-lookup lab to inspect the same validation, permission, approval, retry, replay, and audit boundaries together.'
      ],
      takeaway:'Audit confirmed outcomes and uncertainty honestly. A replay is not another read, and Unknown is not success.',
      example:{title:'A trace must preserve an unresolved result.',input:'Request demo-audit-1, lookup_ticket, DEMO-104, demo-reader; response lost after read.',paths:[{title:'Overconfident log',detail:'Writes Success because the function was selected or a draft reply says done.',result:'Evidence lost; misleading record',tone:'neutral'},{title:'Bounded audit event',detail:'Records Unknown, attempts 1, replay false; a later replay remains Unknown.',result:'Reviewer can see the unresolved outcome',tone:'accent'}],explanation:'A reviewer needs evidence about execution and result delivery. Neither the proposal nor generated prose establishes successful completion.'},
      experiment:'tools-audit',exercise:'Inspect authored known-outcome, replay, and unknown audit traces without ticket summaries or secrets.',
      quiz:{question:'Which audit entry best represents a replay of an unresolved result?',options:[{text:'Success; full ticket text and API key included for debugging.',why:'The outcome is still unknown, and secrets or full sensitive payloads do not belong in the trace.'},{text:'Success; attempts increased because the replay button was clicked.',why:'A replay performs no new invocation and cannot resolve the earlier uncertainty.'},{text:'Same request and target, Unknown, original attempts, replay true.',why:'Correct. The entry preserves correlation, uncertainty, and the fact that no new read was performed.'}],answer:2},

    {
      id: 'ai-features', conceptId: 'ai-feature', title: 'What makes a feature an AI feature?', short: 'Recognize an AI feature', minutes: 8, prerequisites: [],
      objective: 'Tell the difference between code that follows a rule and a model that learns patterns.',
      summary: 'Start with a support inbox, not a new framework.',

      paragraphs: [
        'Imagine you are building SupportDesk, an ASP.NET Core application where customers ask for help. A message arrives: “I paid twice. Can you return one payment?” Your first feature is to send that message to the right team.',
        'You could write a C# rule: if the message contains “refund”, send it to Billing. You chose the word and wrote the decision yourself. That is ordinary application logic.',

      id: 'rules', conceptId: 'deterministic-rule', title: 'When ordinary C# rules are enough', short: 'Keep exact rules in C#', minutes: 10, prerequisites: ['ai-features'],

      summary: 'A useful suggestion can still be an incorrect suggestion.',

      paragraphs: [
        'A support model learned from examples, not from every possible customer message. New wording, unclear requests, and patterns missing from training data can lead to a wrong category.',
        'Consider “My refund button crashes.” The word refund is about Billing, but the actual problem might be Technical. Even a person may need more context. The right design allows correction instead of treating the first suggestion as a fact.',
        'To evaluate a classifier, compare its predictions with reviewed categories on examples that were not used to train it. This helps reveal how it behaves on new data. Do not judge it only by examples it has already learned from.',

(function(root, factory) {

      button('Invoke or replay','invoke',()=>{
        // Check current permission before approval or cache disclosure.
        if(!canRead(identity.value,ticket.value,revoked)){result.textContent='Blocked\nReads: '+reads;explain(unavailable);return;}
        if(approval!==binding()){result.textContent='Blocked\nReads: '+reads;explain('Fresh explicit approval required for this exact request.');return;}
        const key=binding(),replay=cache.has(key);if(!replay){reads++;cache.set(key,fictionalSummary);}result.textContent='Success\nReads: '+reads+'\nReplay: '+replay+'\n'+cache.get(key);explain('Current permission and exact approval passed. '+(replay?'Returned the recorded fictional result without another read.':'Performed one fictional read.'),true);
      },controls);
      button('Revoke demo reader permission','revoke',()=>{revoked=true;approval=null;result.textContent='Simulated permission revoked. Cached summary hidden.\nReads: '+reads;explain('Try Invoke or replay. Current authorization will block disclosure, including a cached result.');},controls);
      explain('Approve DEMO-104 as demo-reader, then invoke. Edit a field or revoke permission to observe the boundary.');
    }else if(type==='tools-retries'){
      body.append(el('p','One idea: retry only a known transient before the read. Maximum two attempts total. The app supplies request demo-retry-1 and a simulated demo-reader approval for the exact proposal; it rechecks both before read or replay.'));
      body.append(el('p','This exercise keeps one result in memory. Changing scenario explicitly resets that teaching run and clears its cache. Reload/remount also loses state. No durable exactly-once guarantee. Unknown is held for reconciliation or a separate human-controlled read; writes are not implemented.'));
      const scenario=select('Authored failure scenario','scenario',[['success','Normal read succeeds'],['transient','Known transient before read, then success'],['exhausted','Known transient before read, twice'],['lost','Response lost after read']]);
      const result=output('Recorded outcome, attempts, reads, and replay'),controls=group();let record=null,reads=0,revoked=false;
      const key=json(['demo-retry-1','lookup_ticket','DEMO-104','demo-reader']);
      function show(outcome,attempts,replay=false){result.textContent='Outcome: '+outcome+'\nRequest: demo-retry-1\nTool: lookup_ticket\nTicket: DEMO-104\nCaller: demo-reader\nAttempts: '+attempts+'\nReads: '+reads+'\nReplay: '+replay;}
      function run(replayOnly=false,changed=false){
        if(!canRead('demo-reader','DEMO-104',revoked)){show('Blocked',record?record.attempts:0);explain(unavailable);return;}
        if(changed){if(!record){explain('Run the original approved request before trying changed parameters.');return;}show('Conflict',record.attempts);explain('Same request ID with changed arguments conflicts. No read or cached payload is returned. The edit also invalidates its earlier approval.');return;}
        if(record){if(record.key!==key){show('Conflict',record.attempts);return;}show(record.outcome,record.attempts,true);explain(record.outcome==='Unknown'?'Unknown remains Unknown. No automatic retry or new read. Reconcile or deliberately arrange a separate human-controlled read.':'Current permission and exact original approval checked. Replayed the memory-only record with no additional read.',record.outcome==='Success');return;}
        if(replayOnly){explain('No recorded outcome yet. Run the scenario first.');return;}
        // Literal synthetic boundary outcomes, not real transient/network errors.
        const attempts=['transient','exhausted'].includes(scenario.value)?2:1;
        reads=scenario.value==='exhausted'?0:1;
        const outcome=scenario.value==='lost'?'Unknown':scenario.value==='exhausted'?'Failed':'Success';
        record={key,outcome,attempts};show(outcome,attempts);
        explain(outcome==='Unknown'?'Response lost AFTER read: Unknown. Stop automatic retry; no successful result can be claimed.':outcome==='Failed'?'Two known transient-before-read failures. Stop at two attempts; zero reads.':'Recorded success after '+attempts+' attempt(s) and one fictional read.',outcome==='Success');
      }
      button('Run approved scenario','run',()=>run(),controls);button('Replay same request','replay',()=>run(true),controls);button('Try changed arguments, same ID','conflict',()=>run(false,true),controls);
      button('Revoke demo permission','revoke',()=>{revoked=true;result.textContent='Permission revoked; recorded payload hidden.\nReads: '+reads;explain('Replay must recheck current permission.');},controls);
      on(scenario,'change',()=>{record=null;reads=0;revoked=false;result.textContent='New teaching run; in-memory record cleared.\nAttempts: 0\nReads: 0';explain('Scenario reset supplies a new simulated exact approval for the original DEMO-104 proposal. Run the selected fixed case.');});
      explain('Run a scenario, then replay it or try a conflicting argument. No network request is made.');
    }else if(type==='tools-audit'){
      body.append(el('p','Inspect a fixed application trace. Fields contain only fictional identifiers and bounded outcomes. No secrets, complete ticket payload, or raw untrusted argument text is logged. These are local labels, not provider statuses; this trace is not durable.'));
      const scenario=select('Authored trace','scenario',[['success','Known success and cached replay'],['blocked','Permission blocked'],['invalid','Argument contract rejected'],['conflict','Changed arguments under one request ID'],['failed','Known failures before read'],['unknown','Lost response and unresolved replay']]);
      const result=output('Minimal fictional audit events');
      button('Inspect audit trace','trace',()=>{
        const base={requestId:'demo-audit-1',tool:'lookup_ticket',ticketId:'DEMO-104',callerId:'demo-reader',attempts:1,replay:false};
        const events={success:[{...base,outcome:'Success'},{...base,replay:true,outcome:'Success'}],blocked:[{...base,callerId:'demo-guest',attempts:0,outcome:'Blocked'}],invalid:[{...base,ticketId:null,attempts:0,outcome:'Invalid'}],conflict:[{...base,outcome:'Success'},{...base,ticketId:'DEMO-105',attempts:0,outcome:'Conflict'}],failed:[{...base,attempts:2,outcome:'Failed'}],unknown:[{...base,outcome:'Unknown'},{...base,replay:true,outcome:'Unknown'}]};
        const chosen=events[scenario.value]||events.success;result.textContent=chosen.map(json).join('\n\n');
        explain(scenario.value==='unknown'?'Unknown is preserved on replay; no new execution attempt is claimed. Reconcile using reliable evidence or arrange a separate human-controlled read.':scenario.value==='invalid'?'Invalid input has no validated ticket ID, so the trace records null rather than copying raw text.':'Trace records known application outcomes and exact correlation. Replay does not increase the original attempt count.');
      });
      on(scenario,'change',()=>{result.textContent='Selection changed. Inspect the selected trace.';explain('No new result is claimed until you inspect the selected authored trace.');});explain('Inspect Success, Blocked, Invalid, Conflict, Failed, or Unknown. Never infer success from a proposal or generated prose.');
    }else explain('This tools experiment is not available.');
    body.append(feedback);
    const cleanup=()=>{if(disposed)return;disposed=true;listeners.forEach(remove=>remove());body.querySelectorAll('button, select, textarea, input').forEach(control=>{control.disabled=true;});mounted.delete(node);};
    mounted.set(node,cleanup);return cleanup;
  }
  return {mount};
});

/* Small, deterministic teaching interactions. No model or API runs here. */
(function() {
  'use strict';
  const esc = value => String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const scenarios = {
    'sort-features': {
      labels: ['An explicit rule', 'A learned model'],
      items: [
        ['The API rejects messages with more than 2,000 characters.',0,'The developer specifies the limit exactly. No learned patterns are needed.'],
        ['A service categorizes unfamiliar messages using patterns learned from past tickets.',1,'The behavior comes from learned examples. A category is a suggestion to evaluate, not a guaranteed fact.'],
        ['The screen displays “Thanks for contacting us” whenever a ticket is saved.',0,'A friendly sentence can be a fixed template. The appearance of intelligence does not tell you how a feature works.']
      ]
    },
    'training-sort': {
      labels: ['Training', 'Inference', 'Collecting feedback'],
      items: [
        ['A console tool uses labelled messages to adjust the model’s learned patterns.',0,'This is training: examples change the model’s learned behavior.'],
        ['An ASP.NET Core service asks a saved model to categorize a new message.',1,'This is inference: the application uses a model that already exists.'],
        ['A staff member corrects Billing to Technical, and your app stores the correction.',2,'This records feedback. It can support a future training dataset, but it is not automatically a training run.']
      ]
    },
    choose: {
      labels: ['An explicit C# rule', 'A small classifier', 'An LLM with review'],
      items: [
        ['Reject requests with no visible message text.',0,'The condition is exact. Use ordinary validation and test it directly.'],
        ['Suggest one of three ticket categories. You have suitable labelled examples and want a small local baseline to evaluate.',1,'A small classifier is a sensible starting point under these assumptions. Compare measured quality before considering a larger model.'],
        ['Draft a new reply that summarizes a conversation and suggests a next step for an agent to approve.',2,'This requires generating language. A language model may help, while a person reviews the proposed response.']
      ]
    }
  };
  function renderScenarios(node, config) {
    let index = 0;
    function draw(focus) {
      const item=config.items[index];
      node.innerHTML=`<div class="experiment-head"><span>SupportDesk decision</span><span>${index+1} of ${config.items.length}</span></div><div class="experiment-body"><p class="scenario-text" tabindex="-1">${esc(item[0])}</p><div class="choice-grid">${config.labels.map((text,i)=>`<button class="choice-button" data-pick="${i}" aria-pressed="false">${esc(text)}</button>`).join('')}</div><div class="feedback" role="status" aria-live="polite"></div><div class="experiment-actions"><span>Try a choice to see why it fits.</span><button class="button secondary" data-next>${index===config.items.length-1?'Start again':'Next scenario'}</button></div></div>`;
      if(focus) node.querySelector('.scenario-text').focus({preventScroll:true});
      node.querySelectorAll('[data-pick]').forEach(button=>button.addEventListener('click',()=>{
        const chosen=Number(button.dataset.pick), correct=chosen===item[1];
        node.querySelectorAll('[data-pick]').forEach(b=>{b.setAttribute('aria-pressed',String(b===button));b.classList.toggle('correct',b===button&&correct);});
        const feedback=node.querySelector('.feedback');
        feedback.classList.toggle('success',correct);
        feedback.innerHTML=`<strong>${correct?'That fits.':'Consider how the decision is made.'}</strong><p>${esc(correct?item[2]:`The best fit here is “${config.labels[item[1]]}”. ${item[2]}`)}</p>`;
      }));
      node.querySelector('[data-next]').addEventListener('click',()=>{index=(index+1)%config.items.length;draw(true);});
    }
    draw(false);
  }
  function keyword(node) {
    node.innerHTML=`<div class="experiment-head"><span>Exact keyword rule</span><span>Editable C# behavior</span></div><div class="experiment-body"><label class="field">Customer message<textarea id="rule-message" rows="3" maxlength="2000">I need a refund</textarea></label><label class="field">Send to Billing when this word appears<input id="rule-keyword" value="refund" maxlength="40" autocomplete="off"></label><div class="chip-group" aria-label="Example messages"><button class="chip-button" data-message="I need a refund">Exact keyword</button><button class="chip-button" data-message="Please return my payment">Same intent, different words</button><button class="chip-button" data-message="I cannot sign in">Different request</button></div><div class="result-output" aria-live="polite"><span>Rule chooses</span><strong id="rule-result"></strong></div><p class="caption" id="rule-explanation" style="margin:14px 0 0"></p></div>`;
    const message=node.querySelector('#rule-message'), keyword=node.querySelector('#rule-keyword');
    const update=()=>{
      const result=AcademyCore.classifyRule(message.value,keyword.value);
      node.querySelector('#rule-result').textContent=result;
      node.querySelector('#rule-explanation').textContent=!message.value.trim()?'This demo has no message to route. The desktop lab adds explicit rejection for empty input.':!keyword.value.trim()?'Enter a keyword to define a condition. Without one, this demo uses the General queue.':result==='Billing'?'The characters match, ignoring letter case. This rule does not understand the meaning of the message.':'The keyword was not found. A related meaning alone cannot satisfy this exact rule.';
    };
    message.addEventListener('input',update);keyword.addEventListener('input',update);
    node.querySelectorAll('[data-message]').forEach(b=>b.addEventListener('click',()=>{message.value=b.dataset.message;update();}));update();
  }
  function boundary(node) {
    const examples=[['I was charged twice.','Billing','Show a Billing suggestion. Staff can verify the payment in an authorized system.'],['I cannot reset my password.','Account','Show an Account suggestion. Do not reset credentials without the application’s normal checks.'],['The upload button stops responding.','Technical','Show a Technical suggestion. Saving a ticket is still an application responsibility.']];
    node.innerHTML=`<div class="experiment-head"><span>Inspect the model boundary</span><span>Fixed example responses</span></div><div class="experiment-body"><label class="field">Choose an input message<select id="model-input">${examples.map((x,i)=>`<option value="${i}">${esc(x[0])}</option>`).join('')}</select></label><div id="model-result" aria-live="polite"></div></div>`;
    const update=()=>{
      const example=examples[Number(node.querySelector('select').value)];
      node.querySelector('#model-result').innerHTML=`<div class="result-output"><span>Illustrative category output</span><strong>${esc(example[1])}</strong></div><div class="connection-note"><strong>Your application’s responsibility</strong><p>${esc(example[2])}</p></div><p class="caption" style="margin:16px 0 0">Changing this selection looks up an authored example. It does not call or train a model.</p>`;
    };
    node.querySelector('select').addEventListener('change',update);update();
  }
  function evaluate(node) {
    const rows=[['Please refund this duplicate charge.','Billing','Billing'],['My password reset link expired.','Account','Account'],['My refund button crashes.','Billing','Technical'],['The screen freezes on upload.','Technical','Technical'],['Please help me access my account.','General','Account']];
    node.innerHTML=`<div class="experiment-head"><span>Five held-out messages</span><span>Illustrative evaluation</span></div><div class="experiment-body"><p>Each message has a category reviewed by a person. Compare the sample predictions with those labels.</p><button class="button" id="reveal-evaluation">Reveal predictions and compare</button><div id="evaluation-results" aria-live="polite"></div></div>`;
    node.querySelector('button').addEventListener('click',()=>{
      node.querySelector('#evaluation-results').innerHTML=`<ul class="evaluation-list">${rows.map(row=>`<li>${esc(row[0])}<div class="evaluation-labels"><span>Predicted: ${esc(row[1])}</span><span class="${row[1]===row[2]?'':'miss'}">Reviewed: ${esc(row[2])} · ${row[1]===row[2]?'Match':'Mismatch'}</span></div></li>`).join('')}</ul><div class="feedback"><strong>3 of 5 match. Inspect the 2 mistakes.</strong><p>The crash is a technical issue, and the access request concerns an account. Five examples are too few to establish production quality. These fixed examples teach the evaluation process.</p></div>`;
      node.querySelector('button').textContent='Predictions revealed';node.querySelector('button').disabled=true;
    });
  }
  window.AcademyExperiments={mount(node,type){
    if(scenarios[type])renderScenarios(node,scenarios[type]);
    else if(type==='keyword')keyword(node);
    else if(type==='model-boundary')boundary(node);
    else if(type==='evaluate')evaluate(node);
    else if(type.startsWith('ml-'))AcademyMlnetExperiments.mount(node,type);
    else if(type.startsWith('lm-'))AcademyLanguageExperiments.mount(node,type);
    else if(type.startsWith('reliable-'))AcademyReliableExperiments.mount(node,type);
    else if(type.startsWith('tools-'))AcademyToolsExperiments.mount(node,type);
  }};
})();

    main.innerHTML=`<div class="wide-view">${breadcrumb('ML.NET classifier lab')}${warning()}<div class="lab-heading"><div class="lab-tags"><span>C# and ML.NET</span><span>45–60 min</span><span>Synthetic data included</span></div><h1 tabindex="-1">Train your first SupportDesk category model.</h1><p class="lede">Build a real text classifier, evaluate it on separate messages, save it, and load it from another C# process. Compare its predictions with the rule you already understand.</p></div><div class="lab-layout"><div>
      <section class="lab-step"><h2>1. Get ready</h2><p>Use a desktop with the .NET 10 SDK. The first package restore needs internet access to download Microsoft.ML from NuGet. Training and prediction then run locally; no AI provider account, API key, database, or paid service is required.</p><p>Read <a href="#lesson/train-test-split/understand">Separate training and testing</a> and <a href="#lesson/mlnet-pipeline/understand">Build and train the pipeline</a> first. The lab is a console application, not a deployed web service.</p>${codeBlock('dotnet --version','Terminal · check the SDK')}<p class="caption">The SDK version should start with 10. Install the <a href="https://dotnet.microsoft.com/en-us/download/dotnet/10.0" target="_blank" rel="noopener noreferrer">.NET 10 SDK</a> if needed, then reopen the terminal.</p></section>

      <section class="lab-step"><h2>4. Approve and invoke one permitted read</h2><p>Inspect the exact ticket ID and demo identity, approve the proposal, then execute it. Only this final step calls the local lookup function. Read the structured result and audit record.</p><p>Change the proposal or identity. The earlier approval and result must be cleared. The server binds approval to the request, arguments, and caller; a checkbox or prompt instruction alone is not an authorization boundary.</p></section>
      <section class="lab-step"><h2>5. Check the team boundary</h2><p>DEMO-104 belongs to the billing demo team; DEMO-205 belongs to the technical demo team. Attempt the first lookup with the technical identity or the no-access identity. The function must not disclose the other team's ticket.</p><p>An inaccessible ID and an unknown ID receive the same generic unavailable outcome. This avoids revealing whether a ticket exists outside the caller's scope. The executor rechecks permission before invocation and before returning a cached result.</p></section>
      <section class="lab-step"><h2>6. Observe retries and duplicate requests</h2><p>After a successful read, replay the same request. A known result should be returned without another function invocation. Reusing an ID with changed arguments is a conflict, not a different request that may silently reuse old approval.</p><p>Try the transient-before-read scenario. The demonstration permits only one bounded retry, at most two attempts. It represents a known failure before the read, not a general license to retry any business operation.</p><p>Next try the lost-response scenario. The read may have happened, but delivery is not confirmed. Its result is Unknown, not successful. Replaying that request must not silently execute it again. The lab performs no irreversible action; real writes require their own durable reconciliation and idempotency design.</p></section>
      <section class="lab-step"><h2>7. Read the audit and verify</h2><p>Use the request ID to connect the proposal, caller, tool, attempts, and outcome. Distinguish denied, completed, replayed, failed, and unknown results. Audit records must not contain secrets or unrelated ticket payloads.</p>${codeBlock('dotnet run -- --verify','Terminal · local deterministic checks')}<p>The verification covers strict arguments, approval and permission checks, duplicate/conflicting requests, retry limits, unknown outcomes, and bounded local records. All data is fictional. Approval, cache, and audit are in memory and disappear when the scoped demo session ends; this is not durable exactly-once execution.</p><label class="lab-complete"><input id="complete-lookup-lab" type="checkbox" ${state.labs['ticket-lookup']?'checked':''}><span>I ran the checks and can explain why a proposed tool call is not an authorized execution.<small style="display:block;color:var(--muted)">Self-reported: the academy cannot inspect your terminal or demo session.</small></span></label></section>
      <section class="lab-step"><h2>If something goes wrong</h2><ul><li><strong>No project found:</strong> open the terminal in the extracted project folder.</li><li><strong>Approval cleared:</strong> validate and approve the new request deliberately; do not reuse approval after changing inputs.</li><li><strong>Ticket unavailable:</strong> check the simulated caller's scope. Do not reveal other-team details to explain a denial.</li><li><strong>Unknown result:</strong> inspect the audit. Do not report success or use an automatic retry loop.</li></ul><a class="button secondary" href="#lesson/tool-audit/dotnet">Return to the audit lesson</a></section>
      </div><aside class="lab-aside"><section class="surface"><h2>Complete lookup project</h2><p>The ZIP includes the tool boundary, fictional tickets, approval/cache/audit behavior, Blazor screen, and executable checks.</p><a class="button" href="${download('downloads/supportdesk-ticket-lookup.zip')}" download="supportdesk-ticket-lookup.zip">${icon('download')}Download complete lookup lab (.zip)</a><details><summary>Individual source files</summary><div class="file-links">${AcademyLookupFiles.map(([file,label])=>`<a href="${download('labs/supportdesk-ticket-lookup/'+file)}" download="${file.split('/').at(-1)}">${icon('download')}${label}</a>`).join('')}</div></details><div class="context-section"><h3>Your result</h3><p>A narrowly scoped, reviewable read-only tool with deterministic permission checks and an inspectable outcome.</p></div><a class="button quiet" href="#map/tools-actions">See all six lessons</a></section></aside></div>${bottom()}</div>`;
    main.querySelector('#complete-lookup-lab').addEventListener('change',event=>onComplete(event.target.checked));
  }
};

  const labCode=`string[] messages =
[
    "I need a refund",
    "Please return my payment",
    "I cannot sign in",
    "   "
];

foreach (string message in messages)
{
    string display = string.IsNullOrWhiteSpace(message)
        ? "<empty>" : message;
    Console.WriteLine($"{display} -> {Route(message)}");
}

static string Route(string message)
{
    if (string.IsNullOrWhiteSpace(message))
        return "Rejected";

    return message.Contains("refund",
        StringComparison.OrdinalIgnoreCase)
        ? "Billing" : "General";
}`;
  function renderLab(){
    $('#main-content').innerHTML=`<div class="wide-view">${breadcrumb('Desktop lab')}${warning()}<div class="lab-heading"><div class="lab-tags"><span>C# console app</span><span>20–30 min</span><span>No paid services</span></div><h1 tabindex="-1">Build your SupportDesk rules baseline.</h1><p class="lede">Run a small, predictable routing rule. Then see exactly where it stops helping. This is the first code milestone for your future support application.</p></div><div class="lab-layout"><div><section class="lab-step"><h2>1. Get ready</h2><p>Use a desktop with the .NET 10 SDK and a terminal. You can read this lab on your phone and run it later. Knowing basic C# is enough.</p><p>Recommended first: <a href="${lessonUrl('rules')}">When ordinary C# rules are enough</a>. The lab creates a console application, not the full web portal.</p>${codeBlock('dotnet --version','Terminal · check your SDK')}<p class="caption">The version should start with 10. If the command is missing, install the .NET 10 SDK from <a href="https://dotnet.microsoft.com/en-us/download/dotnet/10.0" target="_blank" rel="noopener noreferrer">Microsoft’s .NET download page</a>, then open a new terminal.</p></section><section class="lab-step"><h2>2. Create the starting project</h2><p>Choose a folder for your learning code, then run:</p>${codeBlock('dotnet new console --name SupportDesk.Rules --framework net10.0\ncd SupportDesk.Rules','Terminal · create your project')}<p>The first command creates a project file and a starter <code class="inline-code">Program.cs</code>. The second moves your terminal into that folder. No additional NuGet package is needed.</p></section><section class="lab-step"><h2>3. Replace Program.cs</h2><p>The four example messages include one that means “refund” without using that word. Replace the starter file with this code:</p>${codeBlock(labCode,'Program.cs · complete runnable starting exercise')}<ul><li><code class="inline-code">IsNullOrWhiteSpace</code> rejects input that has no visible text.</li><li><code class="inline-code">Contains</code> checks characters, ignoring letter case.</li><li>The other messages go to General. This is a baseline, not a learned classifier.</li></ul></section><section class="lab-step"><h2>4. Run it and compare</h2>${codeBlock('dotnet run','Terminal · run the exercise')}${codeBlock('I need a refund -> Billing\nPlease return my payment -> General\nI cannot sign in -> General\n<empty> -> Rejected','Expected output')}<p>Why does the second message go to General? The meaning is similar, but the keyword is absent. That is the limitation to record before trying a learned model.</p></section><section class="lab-step"><h2>5. Prove it and record the limitation</h2><p>The supplied downloadable project adds six executable checks to the same rule. Download its project file and Program.cs into the same folder, then run:</p>${codeBlock('dotnet run -- --verify','Terminal · run the supplied verification cases')}${codeBlock('PASS: explicit refund\nPASS: case-insensitive keyword\nPASS: related wording has no keyword\nPASS: unrelated message\nPASS: whitespace is rejected\nPASS: empty input is rejected\n6/6 checks passed.','Expected verification output')}<p>Change <code class="inline-code">Route</code> to return Billing for every message and run the checks again. They should fail and return a nonzero exit code. Restore the rule when you have seen why the checks matter.</p><p>In your own README, explain which requirement the rule handles well and one wording it misses. Later, we will compare a model with this baseline using held-out examples.</p></section><section class="lab-step"><h2>If something goes wrong</h2><ul><li><strong>“dotnet” is not recognized:</strong> install the SDK, then reopen the terminal.</li><li><strong>No project found:</strong> run the command inside the folder containing the .csproj file.</li><li><strong>The target framework is unsupported:</strong> check that the installed SDK is version 10.</li><li><strong>No verification summary appears:</strong> use the supplied downloadable Program.cs. The shorter exercise above demonstrates routing only.</li></ul><label class="lab-complete"><input id="complete-lab" type="checkbox" ${state.labs[C.labId]?'checked':''}><span>I ran the supplied checks and can explain the keyword limitation.<small style="display:block;color:var(--muted)">This milestone is self-reported; the website cannot inspect your terminal.</small></span></label></section></div><aside class="lab-aside"><section class="surface"><h2>The complete lab files</h2><p>Save both source files together in a folder. The README includes the same commands and expected results.</p><div class="file-links"><a href="data:text/plain;charset=utf-8,%3CProject%20Sdk%3D%22Microsoft.NET.Sdk%22%3E%0A%20%20%3CPropertyGroup%3E%0A%20%20%20%20%3COutputType%3EExe%3C%2FOutputType%3E%0A%20%20%20%20%3CTargetFramework%3Enet10.0%3C%2FTargetFramework%3E%0A%20%20%20%20%3CImplicitUsings%3Eenable%3C%2FImplicitUsings%3E%0A%20%20%20%20%3CNullable%3Eenable%3C%2FNullable%3E%0A%20%20%20%20%3CTreatWarningsAsErrors%3Etrue%3C%2FTreatWarningsAsErrors%3E%0A%20%20%3C%2FPropertyGroup%3E%0A%3C%2FProject%3E%0A" download>${icon('download')}Project file (.csproj)</a><a href="data:text/plain;charset=utf-8,%2F%2F%20SupportDesk%3A%20an%20explicit%20routing%20baseline%2C%20not%20a%20learned%20model.%0Aif%20(args.Contains(%22--verify%22%2C%20StringComparer.OrdinalIgnoreCase))%0A%7B%0A%20%20%20%20(string%20Name%2C%20string%20Input%2C%20string%20Expected)%5B%5D%20cases%20%3D%0A%20%20%20%20%5B%0A%20%20%20%20%20%20%20%20(%22explicit%20refund%22%2C%20%22I%20need%20a%20refund%22%2C%20%22Billing%22)%2C%0A%20%20%20%20%20%20%20%20(%22case-insensitive%20keyword%22%2C%20%22REFUND%20PLEASE%22%2C%20%22Billing%22)%2C%0A%20%20%20%20%20%20%20%20(%22related%20wording%20has%20no%20keyword%22%2C%20%22Please%20return%20my%20payment%22%2C%20%22General%22)%2C%0A%20%20%20%20%20%20%20%20(%22unrelated%20message%22%2C%20%22I%20cannot%20sign%20in%22%2C%20%22General%22)%2C%0A%20%20%20%20%20%20%20%20(%22whitespace%20is%20rejected%22%2C%20%22%20%20%20%22%2C%20%22Rejected%22)%2C%0A%20%20%20%20%20%20%20%20(%22empty%20input%20is%20rejected%22%2C%20%22%22%2C%20%22Rejected%22)%0A%20%20%20%20%5D%3B%0A%0A%20%20%20%20int%20passed%20%3D%200%3B%0A%20%20%20%20foreach%20(var%20test%20in%20cases)%0A%20%20%20%20%7B%0A%20%20%20%20%20%20%20%20string%20actual%20%3D%20Route(test.Input)%3B%0A%20%20%20%20%20%20%20%20bool%20ok%20%3D%20actual%20%3D%3D%20test.Expected%3B%0A%20%20%20%20%20%20%20%20Console.WriteLine(%24%22%7B(ok%20%3F%20%22PASS%22%20%3A%20%22FAIL%22)%7D%3A%20%7Btest.Name%7D%22)%3B%0A%20%20%20%20%20%20%20%20if%20(ok)%0A%20%20%20%20%20%20%20%20%20%20%20%20passed%2B%2B%3B%0A%20%20%20%20%20%20%20%20else%0A%20%20%20%20%20%20%20%20%20%20%20%20Console.WriteLine(%24%22%20%20Expected%20%7Btest.Expected%7D%3B%20got%20%7Bactual%7D.%22)%3B%0A%20%20%20%20%7D%0A%0A%20%20%20%20Console.WriteLine(%24%22%7Bpassed%7D%2F%7Bcases.Length%7D%20checks%20passed.%22)%3B%0A%20%20%20%20return%20passed%20%3D%3D%20cases.Length%20%3F%200%20%3A%201%3B%0A%7D%0A%0Astring%5B%5D%20messages%20%3D%0A%5B%0A%20%20%20%20%22I%20need%20a%20refund%22%2C%0A%20%20%20%20%22Please%20return%20my%20payment%22%2C%0A%20%20%20%20%22I%20cannot%20sign%20in%22%2C%0A%20%20%20%20%22%20%20%20%22%0A%5D%3B%0A%0Aforeach%20(string%20message%20in%20messages)%0A%7B%0A%20%20%20%20string%20display%20%3D%20string.IsNullOrWhiteSpace(message)%20%3F%20%22%3Cempty%3E%22%20%3A%20message%3B%0A%20%20%20%20Console.WriteLine(%24%22%7Bdisplay%7D%20-%3E%20%7BRoute(message)%7D%22)%3B%0A%7D%0Areturn%200%3B%0A%0Astatic%20string%20Route(string%20message)%0A%7B%0A%20%20%20%20if%20(string.IsNullOrWhiteSpace(message))%0A%20%20%20%20%20%20%20%20return%20%22Rejected%22%3B%0A%0A%20%20%20%20return%20message.Contains(%22refund%22%2C%20StringComparison.OrdinalIgnoreCase)%0A%20%20%20%20%20%20%20%20%3F%20%22Billing%22%0A%20%20%20%20%20%20%20%20%3A%20%22General%22%3B%0A%7D%0A" download>${icon('download')}Program.cs with checks</a><a href="data:text/plain;charset=utf-8,%23%20SupportDesk%20%E2%80%94%20C%23%20rules%20baseline%0A%0ABuild%20the%20first%20code%20milestone%20in%20the%20AI%20for%20.NET%20developers%20preview.%20This%20is%20a%20deterministic%20console%20application%2C%20not%20a%20trained%20model.%20All%20messages%20are%20fictional.%20No%20account%2C%20API%2C%20database%2C%20or%20additional%20package%20is%20needed.%0A%0A%23%23%20Prerequisites%0A%0AUse%20a%20desktop%20terminal%20with%20the%20.NET%2010%20SDK.%20%60dotnet%20--version%60%20should%20start%20with%2010.%20Install%20the%20SDK%20from%20https%3A%2F%2Fdotnet.microsoft.com%2Fen-us%2Fdownload%2Fdotnet%2F10.0%20if%20needed.%20Read%20the%20website%20lesson%20%E2%80%9CWhen%20ordinary%20C%23%20rules%20are%20enough%E2%80%9D%20first.%0A%0A%23%23%20Run%20the%20supplied%20files%0A%0APut%20%60SupportDesk.Rules.csproj%60%20and%20%60Program.cs%60%20in%20the%20same%20folder.%20Open%20a%20terminal%20there%3A%0A%0A%60%60%60shell%0Adotnet%20run%0A%60%60%60%0A%0AExpected%20application%20output%20(the%20first%20run%20can%20also%20print%20SDK%20setup%20messages)%3A%0A%0A%60%60%60text%0AI%20need%20a%20refund%20-%3E%20Billing%0APlease%20return%20my%20payment%20-%3E%20General%0AI%20cannot%20sign%20in%20-%3E%20General%0A%3Cempty%3E%20-%3E%20Rejected%0A%60%60%60%0A%0A%60IsNullOrWhiteSpace%60%20rejects%20empty%20input.%20%60Contains%60%2C%20with%20ordinal%20case-insensitive%20comparison%2C%20routes%20text%20containing%20%E2%80%9Crefund%E2%80%9D%20to%20Billing.%20Everything%20else%20goes%20to%20General.%0A%0A%23%23%20Verify%20the%20behavior%0A%0A%60%60%60shell%0Adotnet%20run%20--%20--verify%0A%60%60%60%0A%0A%60%60%60text%0APASS%3A%20explicit%20refund%0APASS%3A%20case-insensitive%20keyword%0APASS%3A%20related%20wording%20has%20no%20keyword%0APASS%3A%20unrelated%20message%0APASS%3A%20whitespace%20is%20rejected%0APASS%3A%20empty%20input%20is%20rejected%0A6%2F6%20checks%20passed.%0A%60%60%60%0A%0AThe%20verification%20process%20exits%20with%200%20when%20       const focusTarget=same?$('.lesson-panel h2'):$('h1');
      if(focusTarget){focusTarget.setAttribute('tabindex','-1');focusTarget.focus({preventScroll:true});}
      if(same&&$('.section-tabs')){const y=$('.section-tabs').getBoundingClientRect().top+scrollY-parseInt(getComputedStyle(document.documentElement).getPropertyValue('--header'))-16;window.scrollTo({top:Math.max(0,y),behavior:'instant'});}
      else window.scrollTo({top:0,behavior:'instant'});
    }
  }
  window.addEventListener('hashchange',()=>render(false));
  function syncMapSidebar(){
    if(active?.type!=='map')return;
    const boundary=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--header'))+140;
    const stages=Array.from(document.querySelectorAll('.stage'));
    const current=stages.filter(stage=>stage.getBoundingClientRect().top<=boundary).at(-1)||stages[0];
    if(!current)return;
    const id=current.id.replace('unit-','');active.id=id;
    document.querySelectorAll('.unit-link').forEach(link=>{
      const selected=link.getAttribute('href')==='#map/'+id;
      link.classList.toggle('active',selected);
      if(selected)link.setAttribute('aria-current','location');else link.removeAttribute('aria-current');
    });
  }
  let scrollPending=false;
  window.addEventListener('scroll',()=>{
    if(active?.type!=='map'||scrollPending)return;
    scrollPending=true;
    requestAnimationFrame(()=>{
      scrollPending=false;syncMapSidebar();
    });
  },{passive:true});
  window.addEventListener('storage',event=>{if(event.key===KEY){try{state=core.sanitizeProgress(JSON.parse(event.newValue||'null'));render(true);}catch{storageFailed=true;syncWarning();}}});
  render(true);
})();

</script>
</body>
</html>
