%60%20in%20%60LabData.cs%60%20describes%20the%20input%3A%20%60Label%60%20is%20the%20known%20answer%20during%20training%2Fevaluation%3B%20%60Text%60%20is%20the%20message%20to%20learn%20from.%20%60%5BLoadColumn%5D%60%20records%20the%20TSV%20column%20positions.%20The%20strict%20reader%20checks%20the%20header%2C%20column%20count%2C%20labels%2C%20and%20nonempty%20text%20before%20%60LoadFromEnumerable%60%20creates%20ML.NET%27s%20data%20view.%20%60SupportPrediction%60%20uses%20%60%5BColumnName(%22PredictedLabel%22)%5D%60%20and%20%60%5BColumnName(%22Score%22)%5D%60%20to%20bind%20model%20output%20to%20C%23%20properties.%0A%0A%60SupportClassifier.cs%60%20creates%20%60MLContext(seed%3A%2042)%60%20and%20this%20pipeline%3A%0A%0A1.%20%60MapValueToKey%60%20turns%20the%20three%20string%20labels%20into%20the%20numeric%20keys%20the%20trainer%20expects.%0A2.%20%60FeaturizeText%60%20turns%20**Text%20only**%20into%20a%20numeric%20%60Features%60%20vector%20using%20text%20patterns.%20The%20answer%20label%20is%20never%20included%20in%20%60Features%60.%0A3.%20%60SdcaMaximumEntropy%60%20learns%20a%20multiclass%20classifier%20from%20those%20features%20and%20labels.%20A%20single%20training%20thread%20reduces%20run-to-run%20variation%20in%20this%20small%20lab.%0A4.%20%60MapKeyToValue%60%20turns%20the%20predicted%20key%20back%20into%20a%20readable%20category.%0A%0A%60Fit(trainingData)%60%20learns%20the%20vocabulary%2C%20text%20transformations%2C%20and%20classifier%20weights%20from%20**train.tsv%20only**.%20Saving%20persists%20the%20whole%20fitted%20pipeline.%20%60Transform(testData)%60%20applies%20that%20existing%20pipeline%3B%20it%20does%20not%20fit%20a%20new%20vocabulary%20or%20update%20weights.%20A%20test%20label%20supplies%20the%20answer%20for%20counting%20correct%20predictions%2C%20not%20an%20input%20text%20feature.%20Prediction%20supplies%20only%20the%20message%20text%3B%20its%20unused%20label%20is%20empty.%0A%0AKeeping%20%60Fit%60%20and%20%60Transform%60%20separate%20matters%3A%20fitting%20on%20test%20messages%20would%20leak%20information%20into%20the%20model%20and%20make%20the%20evaluation%20less%20honest.%20The%20test%20file%20contains%20separately%20authored%20messages%20with%20different%20wording%2C%20not%20copied%20training%20sentences.%20Verification%20rejects%20duplicates%20within%20or%20across%20splits%20after%20lowercasing%20and%20normalizing%20punctuation%2Fwhitespace.%20This%20catches%20normalized%20duplicates%2C%20not%20all%20paraphrases%20or%20semantic%20overlap%3B%20related%20support%20vocabulary%20is%20intentional.%0A%0A%23%23%20Compare%20against%20the%20original%20rules%20lab%0A%0AThe%20comparison%20reuses%20the%20**exact%20%60Route%60%20behavior%20from%20%60labs%2Fsupportdesk-rules%2FProgram.cs%60**%2C%20with%20no%20extra%20keywords%20or%20categories.%20It%20is%20ordinary%20C%23%2C%20not%20a%20second%20learned%20model%3A%0A%0A%60%60%60csharp%0Aif%20(string.IsNullOrWhiteSpace(message))%0A%20%20%20%20return%20%22Rejected%22%3B%0A%0Areturn%20message.Contains(%22refund%22%2C%20StringComparison.OrdinalIgnoreCase)%0A%20%20%20%20%3F%20%22Billing%22%0A%20%20%20%20%3A%20%22General%22%3B%0A%60%60%60%0A%0AEmpty%2Fwhitespace%20text%20returns%20**Rejected**.%20The%20case-insensitive%20**substring**%20%60refund%60%20returns%20**Billing**%2C%20including%20inside%20a%20word%20such%20as%20%60unrefunded%60.%20Every%20other%20nonempty%20message%20returns%20**General**%2C%20even%20if%20it%20mentions%20invoices%2C%20payments%2C%20passwords%2C%20or%20crashes.%20The%20rules%20are%20fixed%20and%20learn%20nothing%20from%20either%20data%20file.%0A%0AThe%20ML.NET%20model%20still%20predicts%20only%20**Billing%20%2F%20Account%20%2F%20Technical**.%20**General%20is%20only%20the%20original%20baseline%27s%20fallback**%2C%20never%20a%20model%20label%20or%20a%20dataset%20label.%20The%20held-out%20file%20contains%20no%20empty%20messages%2C%20so%20the%20baseline%27s%20Rejected%20branch%20is%20exercised%20by%20verification%20rather%20than%20evaluation.%20Correct%20counts%20use%20exact%20label%20equality%3A%20a%20General%20result%20is%20wrong%20against%20any%20of%20the%20three%20dataset%20labels.%0A%0AEvaluation%20applies%20both%20approaches%20to%20exactly%20the%20same%20held-out%20rows.%20In%20the%20updated%20verified%20run%20the%20model%20got%20**15%2F18**%20correct%20and%20the%20original%20baseline%20got%20**0%2F18**.%20None%20of%20the%2018%20held-out%20messages%20contains%20the%20substring%20%60refund%60%2C%20so%20the%20unchanged%20original%20rule%20returns%20General%20for%20every%20row.%20The%20synthetic%20data%20has%20not%20been%20altered%20to%20improve%20either%20result.%0A%0AThis%20comparison%20illustrates%20the%20original%20rule%27s%20limited%20scope%20and%20sensitivity%20to%20wording.%20The%20rule%20cannot%20output%20Account%20or%20Technical%20at%20all%3B%20these%20counts%20are%20**not%20a%20fair%20benchmark%20between%20equally%20capable%20three-category%20classifiers**%20or%20a%20promise%20that%20machine%20learning%20wins.%20Inspect%20the%20printed%20mistakes%20and%20outputs.%20Do%20not%20tune%20training%20data%20against%20this%20test%20set%20and%20then%20call%20it%20an%20independent%20benchmark%3B%20create%20a%20fresh%20unseen%20split%20for%20later%20experiments.%0A%0A%23%23%20What%20verification%20checks%0A%0AThe%20built-in%20verifier%20exercises%20the%20real%20pipeline%20without%20a%20separate%20test%20framework%3A%0A%0A-%20Valid%20command%20parsing%20and%20preservation%20of%20quoted%20text%3B%20invalid%20commands%2C%20extra%20arguments%2C%20missing%2Fempty%2Fwhitespace%20messages%20are%20rejected.%0A-%20Invalid%2Fempty%20TSV%20input%2C%20wrong%20headers%2Fcolumn%20counts%2C%20and%20unknown%20labels%20are%20rejected.%0A-%20Both%20splits%20are%20nonempty%2C%20contain%20every%20category%2C%20and%20have%20no%20normalized%20duplicates.%20Deliberately%20constructed%20leakage%2C%20duplicate%2C%20and%20missing-category%20fixtures%20must%20fail%20the%20guard.%0A-%20Literal%20original-rule%20examples%20check%20case-insensitive%20substring%20handling%2C%20empty%2Fwhitespace%20rejection%2C%20and%20General%20fallback.%20A%20four-message%20evaluation%20fixture%20checks%20that%20only%20its%20explicit%20refund%20is%20correct%20and%20that%20General%20counts%20as%20wrong%20for%20the%20three%20dataset%20labels.%0A-%20Training%20creates%20a%20nonempty%20saved%20model%3B%20all%20held-out%20predictions%20have%20known%20labels%20and%20three%20finite%20scores%2C%20and%20saving%2Freloading%20preserves%20labels%20and%20scores%20within%20a%20small%20numeric%20tolerance.%0A-%20Evaluation%20covers%20every%20held-out%20row%20in%20order%2C%20agrees%20with%20single-message%20prediction%2C%20and%20returns%20bounded%2C%20independently%20recounted%20model%2Fbaseline%20correct%20counts.%20Empty%20evaluation%20is%20rejected.%0A%0AIt%20exits%20nonzero%20on%20the%20first%20failed%20invariant%20and%20prints%20its%20error.%20There%20is%20**no%20fragile%20accuracy%20threshold**%3B%20correctness%20of%20the%20workflow%20is%20distinct%20from%20quality%20of%20a%20tiny%20model.%20The%20verifier%20retrains%20on%20every%20run%20so%20changes%20to%20source%20data%20are%20exercised.%0A%0A%23%23%20Reuse%20the%20saved%20classifier%20from%20C%23%0A%0AThe%20console%20command%20handler%20calls%20the%20reusable%20%60SupportClassifier%60%20class.%20After%20training%2C%20another%20console%20flow%20in%20the%20same%20project%20can%20use%20the%20saved%20model%20like%20this%3A%0A%0A%60%60%60csharp%0Ausing%20SupportDesk.Classifier%3B%0A%0Avar%20classifier%20%3D%20new%20SupportClassifier()%3B%0Avar%20savedModel%20%3D%20classifier.Load()%3B%0ASupportPrediction%20result%20%3D%20classifier.Predict(savedModel%2C%20%22My%20screen%20turns%20blank%20after%20refresh%22)%3B%0AConsole.WriteLine(result.Category)%3B%0A%60%60%60%0A%0AThis%20code%20loads%20existing%20weights%20and%20does%20no%20training.%20It%20illustrates%20C%23%20reuse%2C%20not%20a%20web%20API%20implementation.%20%60PredictionEngine%60%20is%20not%20thread-safe%3B%20this%20lab%20creates%20and%20disposes%20one%20per%20console%20prediction.%20Hosting%20and%20concurrent%20serving%20are%20separate%20topics.%0A%0A%23%23%20Honest%20limits%0A%0AThere%20are%20only%2072%20fictional%20English%20messages%2C%20hand-labeled%20into%20three%20coarse%20categories.%20They%20do%20not%20represent%20real%20users%2C%20languages%2C%20class%20imbalance%2C%20ambiguous%20requests%2C%20sensitive%20content%2C%20or%20changing%20business%20rules.%20The%20model%20always%20chooses%20one%20of%20these%20three%20labels%2C%20even%20for%20an%20unrelated%20message%3B%20it%20has%20no%20%E2%80%9Cunknown%E2%80%9D%20category%20or%20reliable%20abstention.%20Scores%20are%20not%20a%20guarantee%20of%20correctness%20or%20calibrated%20confidence%2C%20so%20the%20CLI%20prints%20a%20category%20rather%20than%20a%20confidence%20claim.%0A%0AOne%20changed%20prediction%20moves%20the%20test%20score%20by%20about%205.6%20percentage%20points.%20A%20fixed%20seed%20helps%20repeatability%2C%20but%20results%20can%20still%20vary%20with%20runtime%2Fpackage%2Fplatform%20changes.%20A%20useful%20real%20evaluation%20would%20need%20far%20more%20representative%2C%20appropriately%20handled%20data%20and%20an%20untouched%20test%20set.%20This%20lab%20teaches%20the%20local%20train%2Fsave%2Fload%2Fevaluate%2Fpredict%20workflow%2C%20not%20production%20readiness.%0A%0AReference%3A%20Microsoft%27s%20%5BML.NET%20multiclass%20classification%20tutorial%5D(https%3A%2F%2Flearn.microsoft.com%2Fen-us%2Fdotnet%2Fmachine-learning%2Ftutorials%2Fgithub-issue-classification)%20explains%20the%20same%20core%20APIs.%20Package%3A%20%5BMicrosoft.ML%205.0.1%20on%20NuGet%5D(https%3A%2F%2Fwww.nuget.org%2Fpackages%2FMicrosoft.ML%2F5.0.1).%0A"};</script>

      dotnet:{title:'Think of a dataset as a list of typed rows.',text:'You can represent one labelled example with a small C# class. The lab will load a file into rows like this. This first shape is illustrative; the supplied lab includes its full model classes.',code:'public sealed class SupportMessage\n{\n    public string Text { get; set; } = "";\n    public string Label { get; set; } = "";\n}\n\n// One row: Text = "I was charged twice"\n//          Label = "Billing"',label:'C# · one example as a typed object',contribution:'You define the input rows for a future SupportDesk category classifier.',next:'Separate what the model receives from what it is trying to predict.'}

      dotnet:{title:'Keep the boundary visible in code.',text:'IDataView is ML.NET’s table-like data interface. Loading a file is not the same as training. The important boundary is which table you pass to Fit.',code:'IDataView trainingData = LoadTrainingRows();\nIDataView testData = LoadTestRows();\n\nITransformer model = pipeline.Fit(trainingData);\nIDataView predictions = model.Transform(testData);\n\n// LoadTrainingRows/LoadTestRows are explanatory\n// names here; the lab supplies the actual file loader.',label:'C# · illustrative train/test boundary',contribution:'You separate SupportDesk training examples from evaluation evidence.',next:'Build the small ML.NET pipeline that prepares inputs and learns categories.'}

  <script>
(function(root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('./curriculum.js'));
  else root.AcademyCore = factory(root.AcademyContent);
})(typeof globalThis !== 'undefined' ? globalThis : this, function(content) {
  'use strict';
  const getLesson = id => content.lessons.find(x => x.id === id);
  const lessonsForUnit = id => content.lessons.filter(x=>x.unitId===id);
  const unitForLesson = id => content.stages.find(x=>x.id===getLesson(id)?.unitId);
  function sanitizeProgress(input) {
    const state = { lessons: {}, labs: {} };
    if (!input || typeof input !== 'object' || Array.isArray(input)) return state;
    for (const lesson of content.lessons) {
      const entry = input.lessons?.[lesson.id];
      if (entry && typeof entry === 'object' && !Array.isArray(entry)) {
        state.lessons[lesson.id] = { read: entry.read === true, checked: entry.checked === true };
      }
    }
    for(const lab of content.labs)if(input.labs?.[lab.id]===true)state.labs[lab.id]=true;
    return state;
  }
  function grade(id, choice) {
    const quiz = getLesson(id)?.quiz;
    if (!quiz || !Number.isInteger(choice) || !quiz.options[choice]) return { correct: false, explanation: 'Choose one of the available answers.' };
    return { correct: choice === quiz.answer, explanation: quiz.options[choice].why };
  }
  function recordAnswer(input, id, choice) {
    const state = sanitizeProgress(input);
    if (!getLesson(id)) return state;
    const entry = state.lessons[id] || { read: false, checked: false };
    state.lessons[id] = { ...entry, checked: entry.checked || grade(id, choice).correct };
    return state;
  }
  function nextLesson(input) {
    const state = sanitizeProgress(input);
    return content.lessons.find(x => !state.lessons[x.id]?.checked) || content.lessons[content.lessons.length - 1];
  }
  function missingPrerequisites(input, id) {
    const state = sanitizeProgress(input);
    return (getLesson(id)?.prerequisites || []).filter(x => !state.lessons[x]?.checked).map(getLesson);
  }
  function classifyRule(message, keyword) {
    if (!String(message).trim() || !String(keyword).trim()) return 'General';
    return String(message).toLowerCase().includes(String(keyword).trim().toLowerCase()) ? 'Billing' : 'General';
  }
  function readBackup(text) {
    if (new TextEncoder().encode(text).length > 2000000) throw new Error('Choose a backup smaller than 2 MB.');
    let backup;
    try { backup = JSON.parse(text); } catch { throw new Error('The file is not valid JSON. Choose an exported progress backup.'); }
    if (backup?.app !== 'dotnet-ai-workspace' || backup?.version !== 1) throw new Error('Choose a progress backup exported by this learning workspace.');
    if (!backup.progress || typeof backup.progress !== 'object' || Array.isArray(backup.progress)) throw new Error('The backup has no valid progress object.');
    return sanitizeProgress(backup.progress);
  }
  return { getLesson, lessonsForUnit, unitForLesson, sanitizeProgress, grade, recordAnswer, nextLesson, missingPrerequisites, classifyRule, readBackup };
});

      node.innerHTML=`<div class="experiment-head"><span>SupportDesk decision</span><span>${index+1} of ${config.items.length}</span></div><div class="experiment-body"><p class="scenario-text" tabindex="-1">${esc(item[0])}</p><div class="choice-grid">${config.labels.map((text,i)=>`<button class="choice-button" data-pick="${i}" aria-pressed="false">${esc(text)}</button>`).join('')}</div><div class="feedback" role="status" aria-live="polite"></div><div class="experiment-actions"><span>Try a choice to see why it fits.</span><button class="button secondary" data-next>${index===config.items.length-1?'Start again':'Next scenario'}</button></div></div>`;
      if(focus) node.querySelector('.scenario-text').focus({preventScroll:true});
      node.querySelectorAll('[data-pick]').forEach(button=>button.addEventListener('click',()=>{
        const chosen=Number(button.dataset.pick), correct=chosen===item[1];
        node.querySelectorAll('[data-pick]').forEach(b=>{b.setAttribute('aria-pressed',String(b===button));b.classList.toggle('correct',b===button&&correct);});
        const feedback=node.querySelector('.feedback');
        feedback.classList.toggle('success',correct);
        feedback.innerHTML=`<strong>${correct?'That fits.':'Consider how the decision is made.'}</strong><p>${esc(correct?item[2]:`The best fit here is “${config.labels[item[1]]}”. ${item[2]}`)}</p>`;
      }));
      node.querySelector('[data-next]').addEventListener('click',()=>{index=(index+1)%config.items.length;draw(true);});
    }
    draw(false);
  }
  function keyword(node) {
    node.innerHTML=`<div class="experiment-head"><span>Exact keyword rule</span><span>Editable C# behavior</span></div><div class="experiment-body"><label class="field">Customer message<textarea id="rule-message" rows="3" maxlength="2000">I need a refund</textarea></label><label class="field">Send to Billing when this word appears<input id="rule-keyword" value="refund" maxlength="40" autocomplete="off"></label><div class="chip-group" aria-label="Example messages"><button class="chip-button" data-message="I need a refund">Exact keyword</button><button class="chip-button" data-message="Please return my payment">Same intent, different words</button><button class="chip-button" data-message="I cannot sign in">Different request</button></div><div class="result-output" aria-live="polite"><span>Rule chooses</span><strong id="rule-result"></strong></div><p class="caption" id="rule-explanation" style="margin:14px 0 0"></p></div>`;
    const message=node.querySelector('#rule-message'), keyword=node.querySelector('#rule-keyword');
    const update=()=>{
      const result=AcademyCore.classifyRule(message.value,keyword.value);
      node.querySelector('#rule-result').textContent=result;
      node.querySelector('#rule-explanation').textContent=!message.value.trim()?'This demo has no message to route. The desktop lab adds explicit rejection for empty input.':!keyword.value.trim()?'Enter a keyword to define a condition. Without one, this demo uses the General queue.':result==='Billing'?'The characters match, ignoring letter case. This rule does not understand the meaning of the message.':'The keyword was not found. A related meaning alone cannot satisfy this exact rule.';
    };
    message.addEventListener('input',update);keyword.addEventListener('input',update);
    node.querySelectorAll('[data-message]').forEach(b=>b.addEventListener('click',()=>{message.value=b.dataset.message;update();}));update();
  }
  function boundary(node) {
    const examples=[['I was charged twice.','Billing','Show a Billing suggestion. Staff can verify the payment in an authorized system.'],['I cannot reset my password.','Account','Show an Account suggestion. Do not reset credentials without the application’s normal checks.'],['The upload button stops responding.','Technical','Show a Technical suggestion. Saving a ticket is still an application responsibility.']];
    node.innerHTML=`<div class="experiment-head"><span>Inspect the model boundary</span><span>Fixed example responses</span></div><div class="experiment-body"><label class="field">Choose an input message<select id="model-input">${examples.map((x,i)=>`<option value="${i}">${esc(x[0])}</option>`).join('')}</select></label><div id="model-result" aria-live="polite"></div></div>`;
    const update=()=>{
      const example=examples[Number(node.querySelector('select').value)];
      node.querySelector('#model-result').innerHTML=`<div class="result-output"><span>Illustrative category output</span><strong>${esc(example[1])}</strong></div><div class="connection-note"><strong>Your application’s responsibility</strong><p>${esc(example[2])}</p></div><p class="caption" style="margin:16px 0 0">Changing this selection looks up an authored example. It does not call or train a model.</p>`;
    };
    node.querySelector('select').addEventListener('change',update);update();
  }
  function evaluate(node) {
    const rows=[['Please refund this duplicate charge.','Billing','Billing'],['My password reset link expired.','Account','Account'],['My refund button crashes.','Billing','Technical'],['The screen freezes on upload.','Technical','Technical'],['Please help me access my account.','General','Account']];
    node.innerHTML=`<div class="experiment-head"><span>Five held-out messages</span><span>Illustrative evaluation</span></div><div class="experiment-body"><p>Each message has a category reviewed by a person. Compare the sample predictions with those labels.</p><button class="button" id="reveal-evaluation">Reveal predictions and compare</button><div id="evaluation-results" aria-live="polite"></div></div>`;
    node.querySelector('button').addEventListener('click',()=>{
      node.querySelector('#evaluation-results').innerHTML=`<ul class="evaluation-list">${rows.map(row=>`<li>${esc(row[0])}<div class="evaluation-labels"><span>Predicted: ${esc(row[1])}</span><span class="${row[1]===row[2]?'':'miss'}">Reviewed: ${esc(row[2])} · ${row[1]===row[2]?'Match':'Mismatch'}</span></div></li>`).join('')}</ul><div class="feedback"><strong>3 of 5 match. Inspect the 2 mistakes.</strong><p>The crash is a technical issue, and the access request concerns an account. Five examples are too few to establish production quality. These fixed examples teach the evaluation process.</p></div>`;
      node.querySelector('button').textContent='Predictions revealed';node.querySelector('button').disabled=true;
    });
  }
  window.AcademyExperiments={mount(node,type){
    if(scenarios[type])renderScenarios(node,scenarios[type]);
    else if(type==='keyword')keyword(node);
    else if(type==='model-boundary')boundary(node);
    else if(type==='evaluate')evaluate(node);
    else if(type.startsWith('ml-'))AcademyMlnetExperiments.mount(node,type);
  }};
})();

</script>

/* The desktop lab performs real ML.NET training; browser lessons stay offline. */
window.AcademyMlnetLab={
  render({main,codeBlock,icon,warning,breadcrumb,bottom,state,onComplete}){
    const files=AcademyLabFiles;
    const fileUrl=path=>window.AcademyLabDownloads?.['labs/supportdesk-classifier/'+path]||'labs/supportdesk-classifier/'+path;
    const archiveUrl=window.AcademyLabDownloads?.['downloads/supportdesk-classifier.zip']||'downloads/supportdesk-classifier.zip';
    main.innerHTML=`<div class="wide-view">${breadcrumb('ML.NET classifier lab')}${warning()}<div class="lab-heading"><div class="lab-tags"><span>C# and ML.NET</span><span>45–60 min</span><span>Synthetic data included</span></div><h1 tabindex="-1">Train your first SupportDesk category model.</h1><p class="lede">Build a real text classifier, evaluate it on separate messages, save it, and load it from another C# process. Compare its predictions with the rule you already understand.</p></div><div class="lab-layout"><div>
      <section class="lab-step"><h2>1. Get ready</h2><p>Use a desktop with the .NET 10 SDK. The first package restore needs internet access to download Microsoft.ML from NuGet. Training and prediction then run locally; no AI provider account, API key, database, or paid service is required.</p><p>Read <a href="#lesson/train-test-split/understand">Separate training and testing</a> and <a href="#lesson/mlnet-pipeline/understand">Build and train the pipeline</a> first. The lab is a console application, not a deployed web service.</p>${codeBlock('dotnet --version','Terminal · check the SDK')}<p class="caption">The SDK version should start with 10. Install the <a href="https://dotnet.microsoft.com/en-us/download/dotnet/10.0" target="_blank" rel="noopener noreferrer">.NET 10 SDK</a> if needed, then reopen the terminal.</p></section>
      <section class="lab-step"><h2>2. Save the supplied project and data</h2><p>Download the complete lab ZIP, extract it, and open the extracted folder. The archive includes every source file, the package configuration, and both data files:</p>${codeBlock('SupportDesk.Classifier/\n  SupportDesk.Classifier.csproj\n  Program.cs\n  data/\n    train.tsv\n    test.tsv\n  README.md','Your lab folder')}<p>Open a terminal in the folder containing the .csproj file. Restore the pinned package:</p>${codeBlock('dotnet restore','Terminal · restore the lab')}<p class="caption">The project file pins Microsoft.ML so you do not need to choose an algorithm package or install Python. All supplied messages are fictional.</p></section>
      <section class="lab-step"><h2>3. Read one row before training</h2><p>Each data row contains a reviewed Label and message Text, in that order. The columns are separated by a tab character. The supported categories are Billing, Account, and Technical.</p>${codeBlock('Label\tText\nBilling\tI was charged twice','Illustrative TSV row · inspect the supplied files too')}<ul><li><strong>Text:</strong> the input available for a new ticket.</li><li><strong>Label:</strong> the reviewed training label or evaluation answer.</li><li><strong>train.tsv:</strong> rows the model may learn from.</li><li><strong>test.tsv:</strong> separate rows used to check it after training.</li></ul><p>Do not merge the test messages into the training file to improve the test score. The verification command checks basic data separation.</p></section>
      <section class="lab-step"><h2>4. Train and save the pipeline</h2>${codeBlock('dotnet run -- train','Terminal · train a real model')}<p>The command loads training rows, maps category strings to label keys, featurizes message text, fits a multiclass classifier, and saves the fitted pipeline. The terminal prints the model location. Keep this output so you know what the later commands load.</p>${codeBlock('MapValueToKey: Category → Label\nFeaturizeText: Message → Features\nSdcaMaximumEntropy: learn category selection\nMapKeyToValue: predicted key → category text\nFit(trainingData): produce the fitted model','The pipeline responsibilities')}<p class="caption">The model is generated by the training command, not supplied as a pre-trained download. The console project contains the complete working calls behind this outline.</p></section>
      <section class="lab-step"><h2>5. Evaluate on held-out messages</h2>${codeBlock('dotnet run -- evaluate','Terminal · evaluate the saved model')}<p>Read the model’s correct count and total, then compare it with the keyword baseline on the same held-out rows. Inspect the predicted and reviewed categories, especially mismatches.</p><div class="connection-note"><strong>What counts as success in this learning lab?</strong><p>The process runs, reports the denominator, checks separate data, and exposes mistakes. The model does not have to beat the rule. A high score on a tiny synthetic dataset does not establish real-world quality. The original rule recognizes only “refund”, then falls back to General; it cannot predict Account or Technical, so the comparison also reflects different category coverage.</p></div><p class="caption">In a verified local run, the model matched 15 of 18 labels and the original rule matched 0 of 18. None of these held-out texts contains “refund”, so the original rule always returns General. This describes the supplied teaching split, not a competitive benchmark or an expected score for every environment.</p><p>Write down one message the rule misses and one prediction you would want a staff member to review. If the model has no errors on this small set, add a separate, reviewed challenge set rather than claiming it can never fail.</p></section>
      <section class="lab-step"><h2>6. Load the saved model from C#</h2>${codeBlock('dotnet run -- predict "My password reset link expired"','Terminal · inference in a new process')}<p>This starts another process, loads the saved artifact, validates the text, and prints a proposed category. It does not retrain the model. Try a Billing message and a Technical message too, then compare the results with your understanding of the categories.</p><p>The console prediction helper is not a ready-made ASP.NET Core concurrency pattern. Do not share a PredictionEngine unsafely across HTTP requests; later application integration needs an appropriate service boundary and prediction lifetime.</p></section>
      <section class="lab-step"><h2>7. Verify the complete workflow</h2>${codeBlock('dotnet run -- --verify','Terminal · execute the verification cases')}<p>The supplied verification checks input/data assumptions, separation of training and test messages, the model artifact, save/reload consistency, and valid evaluation counts. It returns a nonzero exit code if an invariant fails. It does not assert a fragile accuracy threshold or certify production readiness.</p><label class="lab-complete"><input id="complete-mlnet-lab" type="checkbox" ${state.labs['mlnet-classifier']?'checked':''}><span>I trained, evaluated, and reloaded the model, and I can explain its comparison with the rule.<small style="display:block;color:var(--muted)">Self-reported: the website cannot inspect your terminal.</small></span></label></section>
      <section class="lab-step"><h2>If something goes wrong</h2><ul><li><strong>No saved model:</strong> run the train command successfully before evaluate or predict.</li><li><strong>Package restore fails:</strong> confirm internet/NuGet access. Use the package version in the supplied project file.</li><li><strong>No project found:</strong> open the terminal in the folder containing the .csproj.</li><li><strong>Data file missing:</strong> keep train.tsv and test.tsv in the data subfolder; build again after restoring missing files.</li><li><strong>Unexpected category:</strong> inspect training coverage, the input text, and reviewed labels. An uncertain prediction is a result to investigate, not a reason to change the test answers.</li></ul><a class="button secondary" href="#lesson/save-load/dotnet">Return to the save/load lesson</a></section>
      </div><aside class="lab-aside"><section class="surface"><h2>Source and synthetic data</h2><p>The ZIP preserves the complete source and data folders.</p><a class="button" href="${archiveUrl}" download="supportdesk-classifier.zip">${icon('download')}Download complete lab (.zip)</a><details><summary>Individual source files</summary><div class="file-links">${files.map(([path,label])=>`<a href="${fileUrl(path)}" download="${path.split('/').at(-1)}">${icon('download')}${label}</a>`).join('')}</div></details><div class="context-section"><h3>Your result</h3><p>A reusable category model, a held-out evaluation, and a comparison with the original, narrowly scoped keyword rule.</p></div><a class="button quiet" href="#lab">Compare with the rules-baseline lab</a></section></aside></div>${bottom()}</div>`;
    main.querySelector('#complete-mlnet-lab').addEventListener('change',event=>onComplete(event.target.checked));
  }
};

  const labCode=`string[] messages =
[
    "I need a refund",
    "Please return my payment",
    "I cannot sign in",
    "   "
];

foreach (string message in messages)
{
    string display = string.IsNullOrWhiteSpace(message)
        ? "<empty>" : message;
    Console.WriteLine($"{display} -> {Route(message)}");
}

static string Route(string message)
{
    if (string.IsNullOrWhiteSpace(message))

    return message.Contains("refund",
        StringComparison.OrdinalIgnoreCase)

  function renderLab(){

e text.</li><li><code class="inline-code">Contains</code> checks characters, ignoring letter case.</li><li>The other messages go to General. This is a baseline, not a learned classifier.</li></ul></section><section class="lab-step"><h2>4. Run it and compare</h2>${codeBlock('dotnet run','Terminal · run the exercise')}${codeBlock('I need a refund -> Billing\nPlease return my payment -> General\nI cannot sign in -> General\n<empty> -> Rejected','Expected output')}<p>Why does the second message go to General? The meaning is similar, but the keyword is absent. That is the limitation to record before trying a learned model.</p></section><section class="lab-step"><h2>5. Prove it and record the limitation</h2><p>The supplied downloadable project adds six executable checks to the same rule. Download its project file and Program.cs into the same folder, then run:</p>${codeBlock('dotnet run -- --verify','Terminal · run the supplied verification cases')}${codeBlock('PASS: explicit refund\nPASS: case-insensitive keyword\nPASS: related wording has no keyword\nPASS: unrelated message\nPASS: whitespace is rejected\nPASS: empty input is rejected\n6/6 checks passed.','Expected verification output')}<p>Change <code class="inline-code">Route</code> to return Billing for every message and run the checks again. They should fail and return a nonzero exit code. Restore the rule when you have seen why the checks matter.</p><p>In your own README, explain which requirement the rule handles well and one wording it misses. Later, we will compare a model with this baseline using held-out examples.</p></section><section class="lab-step"><h2>If something goes wrong</h2><ul><li><strong>“dotnet” is not recognized:</strong> install the SDK, then reopen the terminal.</li><li><strong>No project found:</strong> run the command inside the folder containing the .csproj file.</li><li><strong>The target framework is unsupported:</strong> check that the installed SDK is version 10.</li><li><strong>No verification summary appears:</strong> use the supplied downloadable Program.cs. The shorter exercise above demonstrates routing only.</li></ul><label class="lab-complete"><input id="complete-lab" type="checkbox" ${state.labs[C.labId]?'checked':''}><span>I ran the supplied checks and can explain the keyword limitation.<small style="display:block;color:var(--muted)">This milestone is self-reported; the website cannot inspect your terminal.</small></span></label></section></div><aside class="lab-aside"><section class="surface"><h2>The complete lab files</h2><p>Save both source files together in a folder. The README includes the same commands and expected results.</p><div class="file-links"><a href="data:text/plain;charset=utf-8,%3CProject%20Sdk%3D%22Microsoft.NET.Sdk%22%3E%0A%20%20%3CPropertyGroup%3E%0A%20%20%20%20%3COutputType%3EExe%3C%2FOutputType%3E%0A%20%20%20%20%3CTargetFramework%3Enet10.0%3C%2FTargetFramework%3E%0A%20%20%20%20%3CImplicitUsings%3Eenable%3C%2FImplicitUsings%3E%0A%20%20%20%20%3CNullable%3Eenable%3C%2FNullable%3E%0A%20%20%20%20%3CTreatWarningsAsErrors%3Etrue%3C%2FTreatWarningsAsErrors%3E%0A%20%20%3C%2FPropertyGroup%3E%0A%3C%2FProject%3E%0A" download>${icon('download')}Project file (.csproj)</a><a href="data:text/plain;charset=utf-8,%2F%2F%20SupportDesk%3A%20an%20explicit%20routing%20baseline%2C%20not%20a%20learned%20model.%0Aif%20(args.Contains(%22--verify%22%2C%20StringComparer.OrdinalIgnoreCase))%0A%7B%0A%20%20%20%20(string%20Name%2C%20string%20Input%2C%20string%20Expected)%5B%5D%20cases%20%3D%0A%20%20%20%20%5B%0A%20%20%20%20%20%20%20%20(%22explicit%20refund%22%2C%20%22I%20need%20a%20refund%22%2C%20%22Billing%22)%2C%0A%20%20%20%20%20%20%20%20(%22case-insensitive%20keyword%22%2C%20%22REFUND%20PLEASE%22%2C%20%22Billing%22)%2C%0A%20%20%20%20%20%20%20%20(%22related%20wording%20has%20no%20keyword%22%2C%20%22Please%20return%20my%20payment%22%2C%20%22General%22)%2C%0A%20%20%20%20%20%20%20%20(%22unrelated%20message%22%2C%20%22I%20cannot%20sign%20in%22%2C%20%22General%22)%2C%0A%20%20%20%20%20%20%20%20(%22whitespace%20is%20rejected%22%2C%20%22%20%20%20%22%2C%20%22Rejected%22)%2C%0A%20%20%20%20%20%20%20%20(%22empty%20input%20is%20rejected%22%2C%20%22%22%2C%20%22Rejected%22)%0A%20%20%20%20%5D%3B%0A%0A%20%20%20%20int%20passed%20%3D%200%3B%0A%20%20%20%20foreach%20(var%20test%20in%20cases)%0A%20%20%20%20%7B%0A%20%20%20%20%20%20%20%20string%20actual%20%3D%20Route(test.Input)%3B%0A%20%20%20%20%20%20%20%20bool%20ok%20%3D%20actual%20%3D%3D%20test.Expected%3B%0A%20%20%20%20%20%20%20%20Console.WriteLine(%24%22%7B(ok%20%3F%20%22PASS%22%20%3A%20%22FAIL%22)%7D%3A%20%7Btest.Name%7D%22)%3B%0A%20%20%20%20%20%20%20%20if%20(ok)%0A%20%20%20%20%20%20%20%20%20%20%20%20passed%2B%2B%3B%0A%20%20%20%20%20%20%20%20else%0A%20%20%20%20%20%20%20%20%20%20%20%20Console.WriteLine(%24%22%20%20Expected%20%7Btest.Expected%7D%3B%20got%20%7Bactual%7D.%22)%3B%0A%20%20%20%20%7D%0A%0A%20%20%20%20Console.WriteLine(%24%22%7Bpassed%7D%2F%7Bcases.Length%7D%20checks%20passed.%22)%3B%0A%20%20%20%20return%20passed%20%3D%3D%20cases.Length%20%3F%200%20%3A%201%3B%0A%7D%0A%0Astring%5B%5D%20messages%20%3D%0A%5B%0A%20%20%20%20%22I%20need%20a%20refund%22%2C%0A%20%20%20%20%22Please%20return%20my%20payment%22%2C%0A%20%20%20%20%22I%20cannot%20sign%20in%22%2C%0A%20%20%20%20%22%20%20%20%22%0A%5D%3B%0A%0Aforeach%20(string%20message%20in%20messages)%0A%7B%0A%20%20%20%20string%20display%20%3D%20string.IsNullOrWhiteSpace(message)%20%3F%20%22%3Cempty%3E%22%20%3A%20message%3B%0A%20%20%20%20Console.WriteLine(%24%22%7Bdisplay%7D%20-%3E%20%7BRoute(message)%7D%22)%3B%0A%7D%0Areturn%200%3B%0A%0Astatic%20string%20Route(string%20message)%0A%7B%0A%20%20%20%20if%20(string.IsNullOrWhiteSpace(message))%0A%20%20%20%20%20%20%20%20return%20%22Rejected%22%3B%0A%0A%20%20%20%20return%20message.Contains(%22refund%22%2C%20StringComparison.OrdinalIgnoreCase)%0A%20%20%20%20%20%20%20%20%3F%20%22Billing%22%0A%20%20%20%20%20%20%20%20%3A%20%22General%22%3B%0A%7D%0A" download>${icon('download')}Program.cs with checks</a><a href="data:text/plain;charset=utf-8,%23%20SupportDesk%20%E2%80%94%20C%23%20rules%20baseline%0A%0ABuild%20the%20first%20code%20milestone%20in%20the%20AI%20for%20.NET%20developers%20preview.%20This%20is%20a%20deterministic%20console%20application%2C%20not%20a%20trained%20model.%20All%20messages%20are%20fictional.%20No%20account%2C%20API%2C%20database%2C%20or%20additional%20package%20is%20needed.%0A%0A%23%23%20Prerequisites%0A%0AUse%20a%20desktop%20terminal%20with%20the%20.NET%2010%20SDK.%20%60dotnet%20--version%60%20should%20start%20with%2010.%20Install%20the%20SDK%20from%20https%3A%2F%2Fdotnet.microsoft.com%2Fen-us%2Fdownload%2Fdotnet%2F10.0%20if%20needed.%20Read%20the%20website%20lesson%20%E2%80%9CWhen%20ordinary%20C%23%20rules%20are%20enough%E2%80%9D%20first.%0A%0A%23%23%20Run%20the%20supplied%20files%0A%0APut%20%60SupportDesk.Rules.csproj%60%20and%20%60Program.cs%60%20in%20the%20same%20folder.%20Open%20a%20terminal%20there%3A%0A%0A%60%60%60shell%0Adotnet%20run%0A%60%60%60%0A%0AExpected%20application%20output%20(the%20first%20run%20can%20also%20print%20SDK%20setup%20messages)%3A%0A%0A%60%60%60text%0AI%20need%20a%20refund%20-%3E%20Billing%0APlease%20return%20my%20payment%20-%3E%20General%0AI%20cannot%20sign%20in%20-%3E%20General%0A%3Cempty%3E%20-%3E%20Rejected%0A%60%60%60%0A%0A%60IsNullOrWhiteSpace%60%20rejects%20empty%20input.%20%60Contains%60%2C%20with%20ordinal%20case-insensitive%20comparison%2C%20routes%20text%20containing%20%E2%80%9Crefund%E2%80%9D%20to%20Billing.%20Everything%20else%20goes%20to%20General.%0A%0A%23%23%20Verify%20the%20behavior%0A%0A%60%60%60shell%0Adotnet%20run%20--%20--verify%0A%60%60%60%0A%0A%60%60%60text%0APASS%3A%20explicit%20refund%0APASS%3A%20case-insensitive%20keyword%0APASS%3A%20related%20wording%20has%20no%20keyword%0APASS%3A%20unrelated%20message%0APASS%3A%20whitespace%20is%20rejected%0APASS%3A%20empty%20input%20is%20rejected%0A6%2F6%20checks%20passed.%0A%60%60%60%0A%0AThe%20verification%20process%20exits%20with%200%20when%20all%20cases%20pass%20and%201%20if%20any%20case%20fails.%20To%20see%20a%20real%20failure%2C%20temporarily%20change%20%60Route%60%20to%20return%20%60Billing%60%20for%20every%20message.%20Run%20the%20checks%20again%2C%20inspect%20the%20failures%2C%20then%20restore%20the%20rule.%0A%0A%23%23%20Start%20from%20a%20new%20project%20instead%0A%0AIn%20your%20own%20learning-code%20folder%3A%0A%0A%60%60%60shell%0Adotnet%20new%20console%20--name%20SupportDesk.Rules%20--framework%20net10.0%0Acd%20SupportDesk.Rules%0A%60%60%60%0A%0AReplace%20the%20generated%20%60Program.cs%60%20with%20the%20supplied%20file%2C%20then%20run%20the%20commands%20above.%20The%20shorter%20exercise%20shown%20inside%20the%20website%20illustrates%20routing%3B%20this%20supplied%20file%20also%20includes%20the%20%60--verify%60%20mode.%0A%0A%23%23%20Explain%20what%20happened%0A%0A1.%20Why%20did%20%E2%80%9CPlease%20return%20my%20payment%E2%80%9D%20go%20to%20General%3F%0A2.%20Why%20is%20rejecting%20empty%20input%20an%20application%20rule%20rather%20than%20a%20model%20task%3F%0A3.%20Would%20detecting%20the%20word%20%E2%80%9Crefund%E2%80%9D%20be%20enough%20to%20authorize%20a%20refund%3F%20Explain%20why%20not.%0A%0AWrite%20one%20limitation%20and%20one%20testable%20strength%20of%20this%20approach%20in%20your%20own%20README.%20Later%20lessons%20will%20compare%20a%20small%20ML.NET%20classifier%20with%20this%20baseline%20on%20messages%20held%20out%20from%20training.%0A%0A%23%23%20Troubleshooting%0A%0A-%20%60dotnet%60%20not%20recognized%3A%20install%20the%20SDK%2C%20then%20reopen%20the%20terminal.%0A-%20No%20project%20found%3A%20change%20into%20the%20folder%20containing%20the%20.csproj%20file.%0A-%20Target%20framework%20unsupported%3A%20use%20the%20.NET%2010%20SDK.%0A-%20Verification%20output%20missing%3A%20use%20the%20supplied%20Program.cs%2C%20not%20only%20the%20shorter%20website%20snippet.%0A-%20This%20demo%20checks%20substrings%2C%20not%20word%20meaning%20or%20intent.%20A%20model%20needs%20its%20own%20evaluation%3B%20it%20is%20not%20automatically%20an%20improvement.%0A" download>${icon('download')}Lab instructions (.md)</a></div><div class="context-section"><h3>What you are building</h3><p>Message → validation → keyword rule → queue.</p><p>Keep this as your baseline before introducing ML.NET.</p></div><a class="button quiet" href="${lessonUrl('rules','dotnet')}">Back to the .NET connection</a></section></aside></div>${bottom()}</div>`;
    $('#complete-lab').addEventListener('change',event=>{if(event.target.checked)state.labs[C.labId]=true;else delete state.labs[C.labId];save();toast(event.target.checked?'Lab milestone marked complete.':'Lab milestone marked incomplete.');});
  }
  function download(name,text,type){
    const url=URL.createObjectURL(new Blob([text],{type})),link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),10000);
  }
  function closeDrawer(){if($('#course-drawer').open)$('#course-drawer').close();document.body.classList.remove('drawer-open');}
  $('#open-course').addEventListener('click',()=>{updateNav();$('#course-drawer').showModal();document.body.classList.add('drawer-open');});
  $('#close-course').addEventListener('click',closeDrawer);
  $('#course-drawer').addEventListener('close',()=>document.body.classList.remove('drawer-open'));
  $('#course-drawer').addEventListener('click',event=>{if(event.target===event.currentTarget&&event.offsetX>event.currentTarget.clientWidth)closeDrawer();});
  document.addEventListener('click',async event=>{
    const anchor=event.target.closest('a');if(anchor&&$('#course-drawer').contains(anchor))closeDrawer();
    const button=event.target.closest('[data-copy]');if(!button)return;
    const code=button.closest('.code-block').querySelector('code').textContent;
    try{await navigator.clipboard.writeText(code);button.innerHTML=`${icon('check')}Copied`;toast('Code copied.');setTimeout(()=>{if(button.isConnected)button.innerHTML=`${icon('copy')}Copy`;},2000);}
    catch{const range=document.createRange();range.selectNodeContents(button.closest('.code-block').querySelector('code'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);toast('Code selected. Use your device’s copy command.');}
  });
  function render(initial=false){
    if(location.hash==='#main-content'){$('#main-content').focus();return;}
    const previous=active,parts=location.hash.slice(1).split('/');
    $('#toast').hidden=true;
    let type=parts[0],id=parts[1],section=parts[2]||'understand';
    if(!type)type='home';
    if(type==='learn'){
      type='lesson';id=core.nextLesson(state).id;section='understand';
      history.replaceState(null,'',lessonUrl(id,section));
    }
    active={type,id,section};
    document.body.dataset.view=type;
    if(type==='home'){
      $('#main-content').innerHTML=warning()+AcademyHome.markup({lessons:C.lessons,state,next:core.nextLesson(state),esc,icon});
      document.title='AI for .NET developers · Learn, practise, build';
    }else if(type==='lesson'&&core.getLesson(id)&&sections.some(x=>x[0]===section)){
      renderLesson(core.getLesson(id),section);document.title=`${core.getLesson(id).short} · AI for .NET developers`;
    }else if(type==='map'){renderMap();document.title='Learning path · AI for .NET developers';}
    else if(type==='progress'){renderProgress();document.title='My progress · AI for .NET developers';}
    else if(type==='lab'&&id==='mlnet-classifier'){AcademyMlnetLab.render({main:$('#main-content'),codeBlock,icon,warning,breadcrumb,bottom,state,onComplete:done=>{if(done)state.labs['mlnet-classifier']=true;else delete state.labs['mlnet-classifier'];save();toast(done?'Classifier lab marked complete.':'Classifier lab marked incomplete.');}});document.title='ML.NET classifier lab · AI for .NET developers';}
    else if(type==='lab'){renderLab();document.title='C# rules-baseline lab · AI for .NET developers';}
    else{$('#main-content').innerHTML=`<div class="wide-view"><h1 tabindex="-1">That lesson link is unavailable.</h1><p>Choose a foundation lesson or explore the course map.</p><a class="button" href="#map">Open the course map</a></div>`;}
    updateNav();
    const mapTarget=type==='map'&&id?document.getElementById('unit-'+id):null;
    if(mapTarget){
      closeDrawer();mapTarget.querySelector('h2').focus({preventScroll:true});
      const headerHeight=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--header'));
      window.scrollTo({top:Math.max(0,mapTarget.getBoundingClientRect().top+scrollY-headerHeight-20),behavior:'instant'});
      syncMapSidebar();
      return;
    }
    if(!initial){
      closeDrawer();const same=previous?.type==='lesson'&&type==='lesson'&&previous.id===id;
      const focusTarget=same?$('.lesson-panel h2'):$('h1');
      if(focusTarget){focusTarget.setAttribute('tabindex','-1');focusTarget.focus({preventScroll:true});}
      if(same&&$('.section-tabs')){const y=$('.section-tabs').getBoundingClientRect().top+scrollY-parseInt(getComputedStyle(document.documentElement).getPropertyValue('--header'))-16;window.scrollTo({top:Math.max(0,y),behavior:'instant'});}
      else window.scrollTo({top:0,behavior:'instant'});
    }
  }
  window.addEventListener('hashchange',()=>render(false));
  function syncMapSidebar(){
    if(active?.type!=='map')return;
    const boundary=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--header'))+140;
    const stages=Array.from(document.querySelectorAll('.stage'));
    const current=stages.filter(stage=>stage.getBoundingClientRect().top<=boundary).at(-1)||stages[0];
    if(!current)return;
    const id=current.id.replace('unit-','');active.id=id;
    document.querySelectorAll('.unit-link').forEach(link=>{
      const selected=link.getAttribute('href')==='#map/'+id;
      link.classList.toggle('active',selected);
      if(selected)link.setAttribute('aria-current','location');else link.removeAttribute('aria-current');
    });
  }
  let scrollPending=false;
  window.addEventListener('scroll',()=>{
    if(active?.type!=='map'||scrollPending)return;
    scrollPending=true;
    requestAnimationFrame(()=>{
      scrollPending=false;syncMapSidebar();
    });
  },{passive:true});
  window.addEventListener('storage',event=>{if(event.key===KEY){try{state=core.sanitizeProgress(JSON.parse(event.newValue||'null'));render(true);}catch{storageFailed=true;syncWarning();}}});
  render(true);
})();
