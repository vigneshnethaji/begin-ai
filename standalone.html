%60%20in%20%60LabData.cs%60%20describes%20the%20input%3A%20%60Label%60%20is%20the%20known%20answer%20during%20training%2Fevaluation%3B%20%60Text%60%20is%20the%20message%20to%20learn%20from.%20%60%5BLoadColumn%5D%60%20records%20the%20TSV%20column%20positions.%20The%20strict%20reader%20checks%20the%20header%2C%20column%20count%2C%20labels%2C%20and%20nonempty%20text%20before%20%60LoadFromEnumerable%60%20creates%20ML.NET%27s%20data%20view.%20%60SupportPrediction%60%20uses%20%60%5BColumnName(%22PredictedLabel%22)%5D%60%20and%20%60%5BColumnName(%22Score%22)%5D%60%20to%20bind%20model%20output%20to%20C%23%20properties.%0A%0A%60SupportClassifier.cs%60%20creates%20%60MLContext(seed%3A%2042)%60%20and%20this%20pipeline%3A%0A%0A1.%20%60MapValueToKey%60%20turns%20the%20three%20string%20labels%20into%20the%20numeric%20keys%20the%20trainer%20expects.%0A2.%20%60FeaturizeText%60%20turns%20**Text%20only**%20into%20a%20numeric%20%60Features%60%20vector%20using%20text%20patterns.%20The%20answer%20label%20is%20never%20included%20in%20%60Features%60.%0A3.%20%60SdcaMaximumEntropy%60%20learns%20a%20multiclass%20classifier%20from%20those%20features%20and%20labels.%20A%20single%20training%20thread%20reduces%20run-to-run%20variation%20in%20this%20small%20lab.%0A4.%20%60MapKeyToValue%60%20turns%20the%20predicted%20key%20back%20into%20a%20readable%20category.%0A%0A%60Fit(trainingData)%60%20learns%20the%20vocabulary%2C%20text%20transformations%2C%20and%20classifier%20weights%20from%20**train.tsv%20only**.%20Saving%20persists%20the%20whole%20fitted%20pipeline.%20%60Transform(testData)%60%20applies%20that%20existing%20pipeline%3B%20it%20does%20not%20fit%20a%20new%20vocabulary%20or%20update%20weights.%20A%20test%20label%20supplies%20the%20answer%20for%20counting%20correct%20predictions%2C%20not%20an%20input%20text%20feature.%20Prediction%20supplies%20only%20the%20message%20text%3B%20its%20unused%20label%20is%20empty.%0A%0AKeeping%20%60Fit%60%20and%20%60Transform%60%20separate%20matters%3A%20fitting%20on%20test%20messages%20would%20leak%20information%20into%20the%20model%20and%20make%20the%20evaluation%20less%20honest.%20The%20test%20file%20contains%20separately%20authored%20messages%20with%20different%20wording%2C%20not%20copied%20training%20sentences.%20Verification%20rejects%20duplicates%20within%20or%20across%20splits%20after%20lowercasing%20and%20normalizing%20punctuation%2Fwhitespace.%20This%20catches%20normalized%20duplicates%2C%20not%20all%20paraphrases%20or%20semantic%20overlap%3B%20related%20support%20vocabulary%20is%20intentional.%0A%0A%23%23%20Compare%20against%20the%20original%20rules%20lab%0A%0AThe%20comparison%20reuses%20the%20**exact%20%60Route%60%20behavior%20from%20%60labs%2Fsupportdesk-rules%2FProgram.cs%60**%2C%20with%20no%20extra%20keywords%20or%20categories.%20It%20is%20ordinary%20C%23%2C%20not%20a%20second%20learned%20model%3A%0A%0A%60%60%60csharp%0Aif%20(string.IsNullOrWhiteSpace(message))%0A%20%20%20%20return%20%22Rejected%22%3B%0A%0Areturn%20message.Contains(%22refund%22%2C%20StringComparison.OrdinalIgnoreCase)%0A%20%20%20%20%3F%20%22Billing%22%0A%20%20%20%20%3A%20%22General%22%3B%0A%60%60%60%0A%0AEmpty%2Fwhitespace%20text%20returns%20**Rejected**.%20The%20case-insensitive%20**substring**%20%60refund%60%20returns%20**Billing**%2C%20including%20inside%20a%20word%20such%20as%20%60unrefunded%60.%20Every%20other%20nonempty%20message%20returns%20**General**%2C%20even%20if%20it%20mentions%20invoices%2C%20payments%2C%20passwords%2C%20or%20crashes.%20The%20rules%20are%20fixed%20and%20learn%20nothing%20from%20either%20data%20file.%0A%0AThe%20ML.NET%20model%20still%20predicts%20only%20**Billing%20%2F%20Account%20%2F%20Technical**.%20**General%20is%20only%20the%20original%20baseline%27s%20fallback**%2C%20never%20a%20model%20label%20or%20a%20dataset%20label.%20The%20held-out%20file%20contains%20no%20empty%20messages%2C%20so%20the%20baseline%27s%20Rejected%20branch%20is%20exercised%20by%20verification%20rather%20than%20evaluation.%20Correct%20counts%20use%20exact%20label%20equality%3A%20a%20General%20result%20is%20wrong%20against%20any%20of%20the%20three%20dataset%20labels.%0A%0AEvaluation%20applies%20both%20approaches%20to%20exactly%20the%20same%20held-out%20rows.%20In%20the%20updated%20verified%20run%20the%20model%20got%20**15%2F18**%20correct%20and%20the%20original%20baseline%20got%20**0%2F18**.%20None%20of%20the%2018%20held-out%20messages%20contains%20the%20substring%20%60refund%60%2C%20so%20the%20unchanged%20original%20rule%20returns%20General%20for%20every%20row.%20The%20synthetic%20data%20has%20not%20been%20altered%20to%20improve%20either%20result.%0A%0AThis%20comparison%20illustrates%20the%20original%20rule%27s%20limited%20scope%20and%20sensitivity%20to%20wording.%20The%20rule%20cannot%20output%20Account%20or%20Technical%20at%20all%3B%20these%20counts%20are%20**not%20a%20fair%20benchmark%20between%20equally%20capable%20three-category%20classifiers**%20or%20a%20promise%20that%20machine%20learning%20wins.%20Inspect%20the%20printed%20mistakes%20and%20outputs.%20Do%20not%20tune%20training%20data%20against%20this%20test%20set%20and%20then%20call%20it%20an%20independent%20benchmark%3B%20create%20a%20fresh%20unseen%20split%20for%20later%20experiments.%0A%0A%23%23%20What%20verification%20checks%0A%0AThe%20built-in%20verifier%20exercises%20the%20real%20pipeline%20without%20a%20separate%20test%20framework%3A%0A%0A-%20Valid%20command%20parsing%20and%20preservation%20of%20quoted%20text%3B%20invalid%20commands%2C%20extra%20arguments%2C%20missing%2Fempty%2Fwhitespace%20messages%20are%20rejected.%0A-%20Invalid%2Fempty%20TSV%20input%2C%20wrong%20headers%2Fcolumn%20counts%2C%20and%20unknown%20labels%20are%20rejected.%0A-%20Both%20splits%20are%20nonempty%2C%20contain%20every%20category%2C%20and%20have%20no%20normalized%20duplicates.%20Deliberately%20constructed%20leakage%2C%20duplicate%2C%20and%20missing-category%20fixtures%20must%20fail%20the%20guard.%0A-%20Literal%20original-rule%20examples%20check%20case-insensitive%20substring%20handling%2C%20empty%2Fwhitespace%20rejection%2C%20and%20General%20fallback.%20A%20four-message%20evaluation%20fixture%20checks%20that%20only%20its%20explicit%20refund%20is%20correct%20and%20that%20General%20counts%20as%20wrong%20for%20the%20three%20dataset%20labels.%0A-%20Training%20creates%20a%20nonempty%20saved%20model%3B%20all%20held-out%20predictions%20have%20known%20labels%20and%20three%20finite%20scores%2C%20and%20saving%2Freloading%20preserves%20labels%20and%20scores%20within%20a%20small%20numeric%20tolerance.%0A-%20Evaluation%20covers%20every%20held-out%20row%20in%20order%2C%20agrees%20with%20single-message%20prediction%2C%20and%20returns%20bounded%2C%20independently%20recounted%20model%2Fbaseline%20correct%20counts.%20Empty%20evaluation%20is%20rejected.%0A%0AIt%20exits%20nonzero%20on%20the%20first%20failed%20invariant%20and%20prints%20its%20error.%20There%20is%20**no%20fragile%20accuracy%20threshold**%3B%20correctness%20of%20the%20workflow%20is%20distinct%20from%20quality%20of%20a%20tiny%20model.%20The%20verifier%20retrains%20on%20every%20run%20so%20changes%20to%20source%20data%20are%20exercised.%0A%0A%23%23%20Reuse%20the%20saved%20classifier%20from%20C%23%0A%0AThe%20console%20command%20handler%20calls%20the%20reusable%20%60SupportClassifier%60%20class.%20After%20training%2C%20another%20console%20flow%20in%20the%20same%20project%20can%20use%20the%20saved%20model%20like%20this%3A%0A%0A%60%60%60csharp%0Ausing%20SupportDesk.Classifier%3B%0A%0Avar%20classifier%20%3D%20new%20SupportClassifier()%3B%0Avar%20savedModel%20%3D%20classifier.Load()%3B%0ASupportPrediction%20result%20%3D%20classifier.Predict(savedModel%2C%20%22My%20screen%20turns%20blank%20after%20refresh%22)%3B%0AConsole.WriteLine(result.Category)%3B%0A%60%60%60%0A%0AThis%20code%20loads%20existing%20weights%20and%20does%20no%20training.%20It%20illustrates%20C%23%20reuse%2C%20not%20a%20web%20API%20implementation.%20%60PredictionEngine%60%20is%20not%20thread-safe%3B%20this%20lab%20creates%2       example:{title:'The answer is present during training, absent on a new request.',input:'“The upload screen freezes.”',paths:[{title:'A labelled training row',detail:'A reviewer identified an application failure.',result:'Label: Technical',tone:'accent'},{title:'A new prediction request',detail:'Only message text arrives at the model.',result:'Prediction: a proposed category',tone:'neutral'}],explanation:'When we evaluate, we compare the proposal with a separate reviewed label. At inference time in the real application, staff may supply the accepted category later.'},
      experiment:'ml-labels',exercise:'Choose a reviewed category for three clearly described messages, then inspect what happens when the message is ambiguous.',
      quiz:{question:'What is the label for a training row?',options:[{text:'The HTTP route used to call the API.',why:'The route is an application address, not the target answer attached to the example.'},{text:'Whatever the model happens to predict.',why:'A model prediction is a proposal. The reviewed label is the answer used to teach or evaluate it.'},{text:'The reviewed target category, such as Billing.',why:'Correct. The training example includes a reference answer the learner can compare its behavior against.'}],answer:2},
      dotnet:{title:'Keep input and prediction types distinct.',text:'The lab uses ML.NET column attributes for predicted output. A prediction request needs Message, while training rows also contain a category. These names describe responsibilities; use the supplied lab for the full compiled definitions.',code:'// Training row: Message + reviewed Category\n// Prediction input: Message\n// Prediction output: PredictedCategory\n\n// Never copy the model proposal into the reviewed\n// label merely to make evaluation look correct.',label:'Data contract · input, label, and prediction',contribution:'You establish the three category meanings for SupportDesk.',next:'Check whether your examples are consistent and appropriate to learn from.'}
    }),
    make({
      id:'clean-examples',title:'Good examples matter more than extra rows',short:'Check data quality',minutes:10,prerequisites:['target-labels'],
      objective:'Recognize missing text, conflicting labels, duplicates, and overly narrow examples before training.',
      summary:'More examples help only when they describe the right task.',
      definition:['Data quality','How suitable, consistent, and relevant your examples are for the task you want the model to learn.'],
      paragraphs:[
        'A blank message labelled Billing does not teach the meaning of a payment question. Two identical messages with different labels may reveal a labelling mistake or a rule that reviewers have not agreed on.',
        'Duplicates can also mislead you. Copying the same message many times increases the file size without adding new wording. If a duplicate appears in both training and testing, the test no longer cleanly represents unseen examples.',
        'Coverage matters too. Include examples for each category and variations in how people express the same need. A dataset containing only “refund” messages cannot teach the model the range of Account or Technical issues.',
        'Our downloadable files use fictional messages and intentionally small datasets. For real work, define appropriate data access and review before using messages that may contain personal or confidential information. Data preparation is an engineering step, not a reason to copy customer records into a learning project.'
      ],
      takeaway:'Check content and labels, not just row counts. Review ambiguous examples instead of guessing their answers.',
      example:{title:'Two rows can disagree before a model is involved.',input:'Row A: “Reset my password” → Account. Row B: “Reset my password” → Billing.',paths:[{title:'What the rows say',detail:'The same input has conflicting target answers.',result:'Review the labels',tone:'accent'},{title:'What not to assume',detail:'The trainer cannot resolve your undefined policy.',result:'More training is not the first fix',tone:'neutral'}],explanation:'Some messages genuinely have several meanings, but the single-category task needs a clear labelling policy. The tiny lab includes a dataset-separation check, not a comprehensive data-governance system.'},
      experiment:'ml-quality',exercise:'Decide whether an example can be used, needs review, or should be removed from this small teaching dataset.',
      quiz:{question:'What should you do first with identical messages carrying conflicting labels?',options:[{text:'Review the examples and clarify the category policy.',why:'Correct. Resolve the inconsistency or identify genuine ambiguity before using the rows as trusted examples.'},{text:'Copy both rows ten more times.',why:'Repeating the conflict does not add clarity. It amplifies inconsistent teaching examples.'},{text:'Hide the conflict and report only the best model result.',why:'That would conceal a data problem. Inspecting failures is part of building a useful application.'}],answer:0},
      dotnet:{title:'Validate training inputs like other application data.',text:'Reject empty text and unknown categories before fitting the pipeline. The lab’s verification checks basic dataset structure and separation; a real application needs a broader review process.',code:'if (string.IsNullOrWhiteSpace(row.Text))\n    throw new InvalidDataException("Message is empty.");\n\nvar allowed = new[] { "Billing", "Account", "Technical" };\nif (!allowed.Contains(row.Label))\n    throw new InvalidDataException("Unknown category.");',label:'C# · illustrative input validation',contribution:'You define simple checks before SupportDesk learns from reviewed messages.',next:'Keep a separate set of examples for a meaningful first evaluation.'},reference:'ml-data'
    }),
    make({
      id:'train-test-split',title:'Keep test messages out of training',short:'Separate training and testing',minutes:10,prerequisites:['clean-examples'],
      objective:'Explain why evaluation needs messages the training process has not used.',
      summary:'An exam should not simply repeat the answers used during practice.',
      definition:['Held-out test set','Reviewed examples kept separate from training, then used to check the trained model on unseen inputs.'],
      paragraphs:[
        'Imagine studying six practice questions and then taking an exam with exactly the same six questions. A high score would not tell you much about handling new situations.',
        'A classifier needs a similar separation. Training examples teach the model patterns. Test examples check the result after training. Both sets have reviewed categories, but only the training set should be passed to Fit.',
        'Our lab supplies separate train.tsv and test.tsv files. A TSV is a text file whose columns are separated by tab characters. Each file contains Label and Text columns: the category answer and the message input. The lab checks that their message texts do not overlap.',
        'A random split is not always enough for real systems. Similar tickets, the same customer conversation, or future information can still leak across a split. As you improve a model repeatedly, use a validation process for tuning and reserve a final test set for an independent check. This first lab keeps the workflow small so the separation is easy to inspect.'
      ],
      takeaway:'Fit on training rows. Evaluate on separate reviewed rows. Do not train on the test set to improve its score.',
      example:{title:'The two files serve different jobs.',input:'You have reviewed support messages with known categories.',paths:[{title:'train.tsv',detail:'Read these examples inside the learning process.',result:'Used by Fit',tone:'accent'},{title:'test.tsv',detail:'Use these after the model is trained.',result:'Used by evaluation',tone:'neutral'}],explanation:'A test label lets us check the prediction. It must not be included among the input features or passed into the training run that is being evaluated.'},
      experiment:'ml-split',exercise:'Place a teaching example in training or testing. Watch why reusing the same message in both creates misleading evidence.',
      quiz:{question:'Which input should you pass to pipeline.Fit?',options:[{text:'The combined training and test rows, then report the test result as unseen performance.',why:'This allows the learner to see its exam examples. The reported test score would not measure held-out behavior.'},{text:'Only the training rows, keeping the test rows for evaluation.',why:'Correct. The model learns from training rows; the separate test rows check its behavior afterward.'},{text:'Only the test labels, with no message text.',why:'Labels alone do not show the relationship between messages and categories.'}],answer:1},
      dotnet:{title:'Keep the boundary visible in code.',text:'IDataView is ML.NET’s table-like data interface. Loading a file is not the same as training. The important boundary is which table you pass to Fit.',code:'IDataView trainingData = LoadTrainingRows();\nIDataView testData = LoadTestRows();\n\nITransformer model = pipeline.Fit(trainingData);\nIDataView predictions = model.Transform(testData);\n\n// LoadTrainingRows/LoadTestRows are explanatory\n// names here; the lab supplies the actual file loader.',label:'C# · illustrative train/test boundary',contribution:'You separate SupportDesk training examples from evaluation evidence.',next:'Build the small ML.NET pipeline that prepares inputs and learns categories.'}
    }),
    make({
      id:'mlnet-pipeline',title:'Train your first ML.NET text pipeline',short:'Build and train the pipeline',minutes:15,prerequisites:['train-test-split'],
      objective:'Identify input preparation, category learning, and output conversion in a small ML.NET pipeline.',
      summary:'A pipeline puts preparation and learning steps in a repeatable order.',
      definition:['Pipeline','A sequence of data-preparation and learning operations. Calling Fit runs the learning process and returns a reusable trained model.'],
      paragraphs:[
        'Install Microsoft.ML in a C# console project. MLContext is the main starting object for ML.NET operations, similar to a context that groups related library services. Our lab supplies the complete project and package version.',
        'The first pipeline step maps category strings such as Billing to numeric keys in a Label column. MapValueToKey performs that conversion. The next step, FeaturizeText, turns the message Text column into a numeric Features column.',
        'A multiclass trainer learns to choose one of several categories from those features. Our example uses SdcaMaximumEntropy. You do not need to memorize the algorithm name: first understand that it learns a relationship between input features and target labels.',
        'MapKeyToValue turns the predicted numeric category back into readable text. Calling Fit on the training rows builds the fitted transforms and classifier. Defining the steps alone does not train anything. The fitted preparation steps must stay with the classifier when you save it.'
      ],
      takeaway:'Define the preparation and learner, then call Fit with training data to obtain a model you can use.',
      example:{title:'The message moves through one reusable pipeline.',input:'Message: “The upload button freezes.” Category on the training row: Technical.',paths:[{title:'Prepare inputs and labels',detail:'Category → Label key; Message → Features.',result:'Numeric columns the trainer can use',tone:'accent'},{title:'Learn and decode',detail:'Train category selection; turn the result back into text.',result:'A reusable text classifier',tone:'neutral'}],explanation:'The browser exercise illustrates the operation order. The desktop lab runs these operations with the actual Microsoft.ML package and synthetic files.'},
      experiment:'ml-pipeline',exercise:'Assemble the preparation, training, and readable-output steps. See which operation actually starts learning.',
      quiz:{question:'What actually starts the training process?',options:[{text:'Adding a using Microsoft.ML statement.',why:'That makes library names available to C# code. It does not read examples or train a model.'},{text:'Displaying a predicted label in Blazor.',why:'Displaying an existing output is application UI work, not training.'},{text:'Calling Fit with the training data on the defined pipeline.',why:'Correct. Fit learns from those rows and returns the fitted transforms and model.'}],answer:2},
      dotnet:{title:'Four named steps, one Fit call.',text:'This is the core pattern used in the supplied lab. The surrounding lab defines its input types, reads data, saves a model, and handles failures.',code:'var pipeline = ml.Transforms.Conversion\n    .MapValueToKey("Label", "Label")\n    .Append(ml.Transforms.Text\n        .FeaturizeText("Features", "Text"))\n    .Append(ml.MulticlassClassification.Trainers\n        .SdcaMaximumEntropy("Label", "Features"))\n    .Append(ml.Transforms.Conversion\n        .MapKeyToValue("PredictedLabel"));\n\nvar model = pipeline.Fit(trainingData);',label:'C# · core ML.NET pipeline pattern',contribution:'You can train a real first category classifier for SupportDesk.',next:'Measure its output on the separate test messages.',lab:true}
    }),
    make({
      id:'evaluate-model',title:'Evaluate predictions and inspect the mistakes',short:'Measure and inspect mistakes',minutes:12,prerequisites:['mlnet-pipeline'],
      objective:'Compare held-out predictions with reviewed labels and interpret an accuracy count without overstating it.',
      summary:'A score starts a conversation; the failed examples explain what to improve.',
      definition:['Accuracy','The fraction of evaluated examples whose predicted category matches the reviewed category. A small or unrepresentative test set can give a misleading impression.'],
      paragraphs:[
        'Once the model is trained, run each held-out message through it and compare the proposed category with its reviewed label. Count how many match. If four of five match, the accuracy on those five examples is 80 percent.',
        'That number describes those examples, not every future support request. A tiny synthetic test set is useful for learning the workflow. It is not evidence of performance with your customers or a promise that the model beats a simple rule.',
        'Inspect the mismatches. “The refund screen crashes” might be a Technical issue even though it contains a payment word. Ask whether the label is consistent, the training examples cover the wording, and the category boundaries fit the application.',
        'Compare your model with the earlier keyword baseline on the same held-out examples. Include the error consequences in the decision. Our lab reports both results, and it is acceptable for the small model to lose. Do not repeatedly train on test messages to make the comparison look better.'
      ],
      takeaway:'Report the dataset and count, inspect the errors, and compare against a baseline before claiming an improvement.',
      example:{title:'One result can hide the most important failure.',input:'An illustrative evaluation matches 4 of 5 reviewed examples.',paths:[{title:'The headline count',detail:'Four predictions match their reviewed labels.',result:'80% on this five-row example',tone:'accent'},{title:'The engineering question',detail:'Which message failed, and what happens if staff accept it?',result:'Inspect the mismatch',tone:'neutral'}],explanation:'The figures in this worked example are authored for teaching. The runnable lab prints its own measured counts and per-message results; its numbers can differ.'},
      experiment:'ml-evaluate',exercise:'Reveal a five-message evaluation. Count matches and inspect the wrong prediction instead of stopping at a percentage.',
      quiz:{question:'A toy test reports 100% accuracy. What can you safely conclude?',options:[{text:'All evaluated toy examples matched their reviewed labels; broader quality is still unproven.',why:'Correct. The result describes that test set. More representative held-out evaluation and failure analysis are still needed.'},{text:'The application will never route a real customer message incorrectly.',why:'The test cannot cover every future message or ambiguity. Perfect toy-data results do not guarantee real-world behavior.'},{text:'The model no longer needs application validation or human review.',why:'Model evaluation does not replace authorization, input validation, or decisions about uncertain actions.'}],answer:0},
      dotnet:{title:'Evaluate the model and baseline on the same rows.',text:'The lab runs the saved model against held-out rows and also applies the rules baseline. Its output includes the denominator, predicted and reviewed categories, and mismatches.',code:'var classifier = new SupportClassifier();\nvar saved = classifier.Load();\nvar rows = LabData.Load("test.tsv");\nvar report = classifier.Evaluate(saved, rows);\n\nConsole.WriteLine($"{report.Correct}/{report.Total}");\nreport.Print(); // Counts, baseline, and wrong cases',label:'C# · evaluation flow used by the lab',contribution:'You can report honest evidence for the SupportDesk classifier.',next:'Save the fitted pipeline and reuse it for new requests.',lab:true},reference:'ml-evaluation'
    }),
    make({
      id:'save-load',title:'Save the model, then use it from C#',short:'Save, load, and predict',minutes:12,prerequisites:['evaluate-model'],
      objective:'Save and reload the fitted model without retraining for each new prediction.',
      summary:'Training produces an artifact your application can reuse.',
      definition:['Model artifact','A saved representation of a fitted model and its required preparation steps. The application loads it to perform inference.'],
      paragraphs:[
        'After training, save the fitted pipeline to a model file. Keep the text preparation steps with the classifier: a new message must be represented in the same way as the training messages.',
        'A later C# process loads that file and predicts a category for new text. It does not need to train again for each request. In our console lab, train writes the artifact and predict loads it.',
        'Keep the training and prediction commands separate so you can observe the difference. Run a prediction, close the process, then run another prediction. The model is reused; it has not learned from those new messages merely because you called it.',
        'The first lab is a console application. When you later integrate with ASP.NET Core, keep the model behind a service boundary and use a suitable concurrent prediction pattern. PredictionEngine is intended for one-at-a-time use and must not be shared unsafely across concurrent HTTP requests. Also validate input, handle model-version and loading failures, and keep staff review of the category suggestion.'
      ],
      takeaway:'Train deliberately. Save the fitted pipeline. Load it for inference, and keep application responsibilities around it.',
      example:{title:'Two separate commands use one saved artifact.',input:'First: train on reviewed examples. Later: receive “My password reset link expired.”',paths:[{title:'Training command',detail:'Fit on train.tsv and save the model.',result:'A model file',tone:'accent'},{title:'Prediction command',detail:'Load that file and process new message text.',result:'A category suggestion',tone:'neutral'}],explanation:'The saved file is not the training dataset. Loading it restores learned behavior and transforms. A new model version should be evaluated before replacing one in an application.'},
      experiment:'ml-lifecycle',exercise:'Choose the correct operation when the model file exists, when it is missing, and when reviewed data changes.',
      quiz:{question:'A new support message arrives after the model was saved. What should the console app do?',options:[{text:'Add the unknown message to the test set and claim its predicted category is the correct label.',why:'An unchecked prediction is not a reviewed label. That would manufacture misleading evaluation evidence.'},{text:'Load the saved model and request a prediction, while validating the input.',why:'Correct. This is inference. Training is a separate operation, and the returned category is still a suggestion.'},{text:'Train the model again for every message even if no reviewed examples changed.',why:'That repeats work unnecessarily and mixes training with serving requests. Load and reuse the evaluated model instead.'}],answer:1},
      dotnet:{title:'Finish the first learned SupportDesk component.',text:'Use the downloadable lab to run train, evaluate, and predict in separate processes. The following calls illustrate the save/load boundary. The lab includes the concrete classes and paths.',code:'ml.Model.Save(model, trainingData.Schema, path);\n\nvar loaded = ml.Model.Load(path, out var schema);\nusing var engine = ml.Model.CreatePredictionEngine<\n    SupportMessage, SupportPrediction>(loaded);\n\nvar suggestion = engine.Predict(new SupportMessage\n{\n    Text = "My password reset link expired"\n});',label:'C# · illustrative saved-model reuse',contribution:'You have a trained, evaluated, reusable classifier to compare with the original C# rule.',next:'Run the full classifier lab. Continue into the available Language models in C# unit, starting with generated text and its limits.',lab:true},reference:'ml-save'
    })
  ];
  return {lessons,references:{
    'ml-classifier':{title:'Microsoft Learn: Categorize support issues with ML.NET',url:'https://learn.microsoft.com/en-us/dotnet/machine-learning/tutorials/github-issue-classification',note:'Optional official example of a multiclass text pipeline. Our lab uses smaller fictional support data.'},
    'ml-data':{title:'Microsoft Learn: Prepare data for ML.NET',url:'https://learn.microsoft.com/en-us/dotnet/machine-learning/how-to-guides/prepare-data-ml-net',note:'More detail about features, labels, and preparation after you finish the lesson.'},
    'ml-evaluation':{title:'Microsoft Learn: Evaluate an ML.NET model',url:'https://learn.microsoft.com/en-us/dotnet/machine-learning/resources/metrics',note:'Official guidance on evaluation metrics. Start with the lesson’s correct-count example before exploring more metrics.'},
    'ml-save':{title:'Microsoft Learn: Save and load trained models',url:'https://learn.microsoft.com/en-us/dotnet/machine-learning/how-to-guides/save-load-machine-learning-models-ml-net',note:'Official save/load guidance for the artifact boundary shown in our lab.'}

  <script>
/* Unit 3. Authored explanations; all browser exercises are simulations. */
(function(root,factory){
  const content=factory();
  if(typeof module==='object'&&module.exports)module.exports=content;
  else root.AcademyLanguageContent=content;
})(typeof globalThis!=='undefined'?globalThis:this,function(){
  'use strict';
  const make=value=>({...value,unitId:'language-models',conceptId:value.id,labId:'draft-replies'});
  const lessons=[
    make({
      id:'generated-text',title:'Generated text is a draft, not a verified answer',short:'Generated text and its limits',minutes:8,prerequisites:['save-load'],
      objective:'Distinguish generating a useful draft from checking whether its claims are true.',
      summary:'A language model proposes words. Your application and a reviewer remain responsible for their use.',
      definition:['Generated text','New text produced from instructions and supplied context using a model’s learned patterns. Fluent wording is not evidence that its claims are correct.'],
      paragraphs:[
        'Your ML.NET classifier proposed one category. A language model can instead compose a reply, such as a polite acknowledgement of a duplicate charge. You supply a message and instructions; the model generates text rather than selecting only Billing, Account, or Technical.',
        'That flexibility creates a new failure to inspect. A draft might say “Your refund was processed today” even though the application never checked a payment record. The sentence sounds helpful but adds an unsupported fact. Generated text is not truth, and confidence in its wording does not verify it.',
        'For SupportDesk, ask for a draft that acknowledges the issue and avoids promising actions. Display it for human review. Staff should verify payment facts through the authorized application, edit the reply, and explicitly decide whether to send it. Generating a draft must not issue a refund or send a message.',
        'Begin the draft-replies lab in its free sample-response mode. It returns authored text so you can learn the service and screen without an account, network call, or charge. That sample is not model inference. The optional provider mode can generate different text and needs the same review boundary.'
      ],
      takeaway:'Treat every generated reply as a proposal. Verify claims and keep sending under explicit human control.',
      example:{title:'A convincing refund claim can still be unsupported.',input:'Fictional ticket: “I was charged twice.” No payment records were supplied.',paths:[{title:'Unsafe draft',detail:'“Your refund was processed today.”',result:'Unsupported claim: review required',tone:'neutral'},{title:'A bounded draft',detail:'“Thanks for reporting the duplicate charge. Our team will review it.”',result:'Acknowledge without claiming a completed refund',tone:'accent'}],explanation:'The second draft still needs review, including whether it matches team policy. Neither sentence proves anything happened in the payment system.'},
      experiment:'lm-review',exercise:'Inspect an authored draft with an unsupported refund claim. Choose the next action and read why it matters.',
      quiz:{question:'A generated reply says a refund is complete, but no payment record was checked. What should happen?',options:[{text:'Send it because the wording is confident.',why:'Fluent wording does not establish that a refund happened.'},{text:'Verify the payment facts and edit the draft before deciding to send.',why:'Correct. A person checks claims against an authorized source and controls sending.'},{text:'Ask for a longer reply so the claim becomes reliable.',why:'Length does not supply missing evidence. The unsupported claim still needs verification.'}],answer:1},
      dotnet:{title:'Place drafting behind a service boundary.',text:'Illustrative C# contract shared by the free sample and optional provider. Each yielded string is a text fragment, not a verified fact or necessarily one token. The lab supplies the implementations.',code:'public interface IDraftReplyService\n{\n    IAsyncEnumerable<string> StreamAsync(\n        string message, CancellationToken cancellationToken);\n}\n\n// Review the assembled draft before sending anything.',label:'C# · illustrative draft service contract',contribution:'SupportDesk gains a reviewable reply draft without coupling its screen to a provider.',next:'Understand how the supplied context and output share a limited budget.'},reference:'lm-generation'
    }),
    make({
      id:'tokens-context',title:'Plan room for instructions, history, and the reply',short:'Tokens and context limits',minutes:9,prerequisites:['generated-text'],
      objective:'Explain tokens and context, and reserve output space without treating a rough estimate as an exact count.',
      summary:'The model receives a bounded amount of information. Choose relevant context and leave room for output.',
      definition:['Token and context','A token is a model-specific piece of encoded text. Context is the information available for a request, subject to that model’s limits. A token is not always a word or character.'],
      paragraphs:[
        'A provider represents text as tokens. A short word might be one token, while a longer word or identifier can be split into several pieces. Punctuation, code, and different languages affect counts. A character count divided by four is only a rough teaching estimate for some English text, not a tokenizer.',
        'A drafting request may include instructions, the current message, and selected conversation history. These all consume input space. Reserve room for the reply too. Exact accounting and limits depend on the chosen model, and some models also use a reasoning budget; consult that model’s documentation before relying on a numeric limit.',
        'More history is not automatically more useful. Keep the facts needed for this reply, remove irrelevant repetition, and use approved summaries where appropriate. Do not silently drop a customer’s important constraint just to make the request fit. If context is insufficient, ask for clarification instead of inventing details.',
        'The browser exercise uses a fictional 128-token capacity and estimates fixed English samples by character count. Changing history or the output reserve makes the tradeoff visible. These numbers describe only this simulation. The optional server provider uses OPENAI_MODEL so the lab does not promise one model’s context size forever.'
      ],
      takeaway:'Budget for input and output together. Estimates help explain the tradeoff; model-specific token counting establishes real limits.',
      example:{title:'A fictional budget exposes the tradeoff.',input:'Teaching capacity: 128 units. Estimated input: 92. Reserved output: 48.',paths:[{title:'Keep everything',detail:'92 + 48 = 140 estimated units.',result:'12 over the teaching capacity',tone:'neutral'},{title:'Remove irrelevant history',detail:'An edited input of 60 plus the same 48 reserve is 108.',result:'20 units of teaching headroom',tone:'accent'}],explanation:'This arithmetic is illustrative, not a provider quota or actual tokenizer result. Review what was removed and use model-specific accounting for a real request.'},
      experiment:'lm-context',exercise:'Choose short or repeated history, reserve output space, and check the resulting fictional budget.',
      quiz:{question:'What does this exercise’s characters-divided-by-four estimate tell you?',options:[{text:'An approximate teaching budget, not the exact token count for a model.',why:'Correct. Real counts depend on the tokenizer and the complete request.'},{text:'The exact bill for every provider call.',why:'A rough count and fictional capacity cannot establish usage or price.'},{text:'That one word always equals one token.',why:'Token boundaries depend on encoding. Words can span several tokens.'}],answer:0},
      dotnet:{title:'Bound input separately from token accounting.',text:'Illustrative application validation before StreamAsync. A character limit protects your input boundary; it is not a substitute for model-specific token counting or an output limit in the optional provider.',code:'if (string.IsNullOrWhiteSpace(message))\n    throw new ArgumentException("Enter a message.");\nif (message.Length > 2000)\n    throw new ArgumentException("Keep the message within 2000 characters.");\n\nawait foreach (var part in drafts.StreamAsync(message, cancellationToken))\n{\n    // Accumulate as plain text for human review.\n}',label:'C# · illustrative input boundary',contribution:'You decide what context SupportDesk sends and keep requests bounded.',next:'Follow one request through the sample service and optional provider.'},reference:'lm-tokens'
    }),
    make({
      id:'first-provider-call',title:'Follow a first request through the .NET service',short:'A first provider call',minutes:10,prerequisites:['tokens-context'],
      objective:'Trace a draft request from the service contract to an optional server-side Responses API call.',
      summary:'Use one service contract for a free sample and an explicitly configured external provider.',
      definition:['Provider','The external service hosting the language model. Your server adapts its HTTP protocol into the draft service contract used by the application.'],
      paragraphs:[
        'First run the sample implementation of IDraftReplyService. The screen submits a fictional support message and consumes text fragments from StreamAsync(string, CancellationToken). A fixed sample is enough to check loading, cancellation, and review behavior without making a paid call.',
        'The optional server implementation uses HttpClient to POST JSON to the OpenAI Responses endpoint. It supplies the configured model, instructions, input, and stream: true. OPENAI_MODEL selects the model and OPENAI_API_KEY authorizes the request. This mode sends the supplied data externally and may incur provider charges.',
        'A successful streaming response contains server-sent events, or SSE: typed event messages carried over HTTP. The adapter extracts response.output_text.delta text, handles completion and failure events, and yields strings through the same contract. A network read is not necessarily a complete SSE event; use proper event framing rather than treating every line or byte block as a finished reply.',
        'Check the HTTP status before reading events. A rejected request, interrupted stream, refusal, or incomplete result needs an honest user-facing state. Never quietly replace a provider error with the sample and claim a model succeeded. This browser exercise only looks up authored outcomes; it never contacts OpenAI.'
      ],
      takeaway:'The service contract stays stable while the adapter handles provider HTTP, event parsing, errors, and cancellation.',
      example:{title:'The same screen can use two honest modes.',input:'SupportDesk asks: draft a reply to “I was charged twice.”',paths:[{title:'Sample mode',detail:'The local service yields authored sample fragments.',result:'Free sample, visibly labelled',tone:'accent'},{title:'Optional provider mode',detail:'The server sends an authorized HTTPS request and parses SSE.',result:'Generated draft or an explicit error',tone:'neutral'}],explanation:'The browser simulation does neither operation for real. The lab implements the shared contract, with the sample as the default learning path.'},
      experiment:'lm-provider',exercise:'Select a service mode and a simulated provider outcome. Observe when an error must be shown instead of a draft.',
      quiz:{question:'The optional provider returns HTTP 401. What should the adapter do?',options:[{text:'Render the HTTP error body as a customer reply.',why:'An error response is not a generated draft and can expose implementation details.'},{text:'Claim the sample was a successful model response.',why:'That would hide the failure and misrepresent how the text was produced.'},{text:'Report a safe configuration failure and keep sample mode explicitly separate.',why:'Correct. Check server configuration without exposing credentials or inventing success.'}],answer:2},
      dotnet:{title:'See the request boundary before the full parser.',text:'Illustrative server-only excerpt inside the optional provider, with an injected HttpClient named http and a configured model. It is not a complete StreamAsync implementation: the lab must parse SSE, yield text deltas, handle terminal events, and dispose the stream.',code:'using var request = new HttpRequestMessage(\n    HttpMethod.Post, "https://api.openai.com/v1/responses");\nrequest.Content = JsonContent.Create(new\n{\n    model, input = message,\n    instructions = "Draft for human review. Do not invent completed actions.",\n    stream = true\n});\n// Server adds the Authorization header from its configuration.\nusing var response = await http.SendAsync(request,\n    HttpCompletionOption.ResponseHeadersRead, cancellationToken);\nresponse.EnsureSuccessStatusCode();',label:'C# · illustrative Responses HTTP boundary',contribution:'You connect the draft contract to a provider without changing the review screen.',next:'Keep authorization on the server and out of browser-delivered files.'},reference:'lm-stream'
    }),
    make({
      id:'server-credentials',title:'Keep provider credentials on the server',short:'Server-side credentials',minutes:8,prerequisites:['first-provider-call'],
      objective:'Locate provider credentials in server configuration and explain why browser-delivered assets cannot hold secrets.',
      summary:'InteractiveServer runs the drafting service on the server. Browser code must never receive the provider key.',
      definition:['Server-side credential','Authorization material read only by trusted server code and excluded from browser payloads, repository history, and logs.'],
      paragraphs:[
        'The .NET 10 lab uses Blazor InteractiveServer. Component event handlers and the draft service execute on the server, while UI updates reach the browser through the Blazor connection. The optional provider’s HttpClient call belongs on that server. This is not a WebAssembly example that embeds a key in downloaded code.',
        'Read OPENAI_API_KEY and OPENAI_MODEL from the server process environment when configuring the optional provider. These variable names are configuration inputs, not values to paste into a page. The free sample path needs neither variable. Do not force learners to obtain credentials just to practise the workflow.',
        'A browser JavaScript file, local storage entry, or WebAssembly assembly can be inspected by its user. Committing the key to a settings file also exposes it to repository readers and history. Keep secrets out of these locations and out of exception details, screenshots, request logs, and responses sent to the browser.',
        'Server storage does not replace application controls. Authorize who may request drafts, bound input and output, and apply usage limits appropriate to the application. This exercise asks where configuration belongs and never asks for a real or pretend key. Review the optional provider configuration privately on the server.'
      ],
      takeaway:'Only server code reads provider authorization. A screen needs the resulting draft and safe status, not the key.',
      example:{title:'Follow configuration without copying its value.',input:'An operator configures the optional provider for the server process.',paths:[{title:'Correct boundary',detail:'Server environment → provider configuration → Authorization header.',result:'The browser receives no key',tone:'accent'},{title:'Exposed boundary',detail:'Key in a JavaScript bundle or committed appsettings file.',result:'Treat it as exposed and replace it',tone:'neutral'}],explanation:'Do not log or render secret values to demonstrate configuration. The model identifier is not a credential, but both settings belong to the optional server provider’s configuration.'},
      experiment:'lm-credentials',exercise:'Choose a location for the provider key. Inspect the explanation without entering any credential.',
      quiz:{question:'Where should the optional provider read OPENAI_API_KEY?',options:[{text:'From browser local storage.',why:'Browser storage is available to browser code and users; it is not a server secret boundary.'},{text:'From server configuration, without returning or logging the value.',why:'Correct. The server uses the key for authorization and returns only safe application results.'},{text:'From a settings file committed beside public assets.',why:'Committing a key exposes it to repository readers and preserves it in history.'}],answer:1},
      dotnet:{title:'Fail optional-provider setup without exposing values.',text:'Illustrative server startup excerpt used only when provider mode is explicitly selected. The environment must belong to the server process; sample mode should work with no configuration.',code:'var key = Environment.GetEnvironmentVariable("OPENAI_API_KEY");\nvar model = Environment.GetEnvironmentVariable("OPENAI_MODEL");\nif (string.IsNullOrWhiteSpace(key) || string.IsNullOrWhiteSpace(model))\n    throw new InvalidOperationException(\n        "Provider mode needs server configuration.");\n\n// Inside the server adapter; never log this header.\nrequest.Headers.Authorization =\n    new AuthenticationHeaderValue("Bearer", key);',label:'C# · illustrative server configuration',contribution:'SupportDesk can use a provider without distributing its credentials.',next:'Make waiting bounded and pass cancellation through every async layer.'},reference:'lm-security'
    }),
    make({
      id:'timeouts-cancellation',title:'Make a slow request stoppable',short:'Timeouts and cancellation',minutes:10,prerequisites:['server-credentials'],
      objective:'Distinguish a deadline from a user stop, and propagate their cancellation through a streaming request.',
      summary:'A Stop button only works when the cancellation token reaches the work that is waiting.',
      definition:['Cancellation and timeout','Cancellation asks cooperative work to stop. A timeout is a deadline that triggers cancellation when the allowed waiting period expires.'],
      paragraphs:[
        'A provider can respond slowly or stop midway through a stream. Leaving a spinner forever is not a useful outcome. Set a deliberate deadline and give the user a Stop button. A cancelled or timed-out draft remains incomplete, even if some text is already visible.',
        'The component owns cancellation for its active request. Pass its token into IDraftReplyService.StreamAsync(string, CancellationToken), then through HttpClient.SendAsync and stream reads. For an async iterator, connect the token to enumeration as well. Merely cancelling a local flag while the HTTP operation ignores the token does not stop the waiting work.',
        'The provider can link the caller token with a deadline token. Catch OperationCanceledException at the application boundary and distinguish a user stop from an expired deadline where possible. Disposing a token source alone does not request cancellation. Cancel active work before cleaning up its resources, and dispose request resources after the operation unwinds.',
        'The exercise advances a fictional clock one second per click and has a five-second deadline. Choose a response delay, start, then either advance or stop. It makes no request and measures no real latency. Stopping local work is also not a promise that a remote provider has instantly stopped processing or that no usage will be charged.'
      ],
      takeaway:'Give every request an owner, a deadline, and a cancellation path that reaches the underlying I/O.',
      example:{title:'The first terminal outcome wins.',input:'Teaching response delay: 8 seconds. Teaching deadline: 5 seconds.',paths:[{title:'Wait five steps',detail:'The deadline arrives before the response.',result:'Timed out; no completed draft',tone:'neutral'},{title:'Stop after two steps',detail:'Caller cancellation arrives before the deadline.',result:'Stopped by user; no completed draft',tone:'accent'}],explanation:'A three-second response would complete before this deadline. At exactly five seconds, this simulation gives the deadline priority; real concurrent operations still need one consistent terminal state.'},
      experiment:'lm-cancellation',exercise:'Compare completion, manual cancellation, and a five-second deadline using a clock you advance yourself.',
      quiz:{question:'What makes the Stop button effective across the service boundary?',options:[{text:'Pass the cancellation token through the service, HTTP send, and stream reads.',why:'Correct. Each awaited operation must observe the request’s cancellation.'},{text:'Hide the spinner but leave the request running.',why:'That changes the screen without stopping server work.'},{text:'Dispose a token source without calling Cancel.',why:'Dispose releases resources; it does not signal cancellation to active work.'}],answer:0},
      dotnet:{title:'Link a deadline to the caller’s token.',text:'Illustrative excerpt inside the optional provider. Keep the linked source alive for the full stream, not just until headers arrive. The component still calls StreamAsync(message, itsRequestToken); error handling and SSE parsing are omitted here.',code:'using var deadline = CancellationTokenSource.CreateLinkedTokenSource(\n    cancellationToken);\ndeadline.CancelAfter(TimeSpan.FromSeconds(30));\n\nusing var response = await http.SendAsync(request,\n    HttpCompletionOption.ResponseHeadersRead, deadline.Token);\nresponse.EnsureSuccessStatusCode();\nawait using var body = await response.Content.ReadAsStreamAsync(deadline.Token);\n// Pass deadline.Token to every subsequent body read too.',label:'C# · illustrative streaming deadline',contribution:'SupportDesk can stop waiting and accurately label an unfinished draft.',next:'Consume fragments in an InteractiveServer component and stop work when it is disposed.'},reference:'lm-lifecycle'
    }),
    make({
      id:'blazor-streaming',title:'Show a draft in Blazor as fragments arrive',short:'Streaming into Blazor',minutes:12,prerequisites:['timeouts-cancellation'],
      objective:'Consume service fragments in an InteractiveServer component while managing completion, stop, and disposal.',
      summary:'Append plain text, render intermediate state, and stop active work when the component leaves the screen.',
      definition:['Streaming draft','A reply displayed incrementally as text fragments arrive. Fragments are delivery pieces, not necessarily whole words, sentences, or tokens.'],
      paragraphs:[
        'A .NET 10 InteractiveServer component can await foreach over IDraftReplyService.StreamAsync(string, CancellationToken). Append each fragment to a draft string and request a render so the user sees progress before the event handler finishes. Display the string using ordinary Razor text interpolation; never treat a model reply as trusted HTML.',
        'Keep explicit states for idle, receiving, completed, stopped, and failed. Disable duplicate starts while a request is active. A complete-looking sentence is not proof that the stream completed: a completion event and successful service enumeration establish delivery state. Even a fully delivered reply still needs human review before sending.',
        'Navigation can dispose the component while an awaited operation is suspended. On disposal, cancel active work and prevent continuations from changing disposed UI state. Release request resources when the operation unwinds, and do not call StateHasChanged from Dispose. Avoid starting a paid request automatically during initialization, which can also run during prerendering.',
        'The free sample lab lets you practise this lifecycle with authored fragments. The browser simulation delivers three fixed chunks only when you press Receive next chunk. Stop preserves the partial draft; Dispose blocks further delivery; Mount fresh component starts a new lifecycle. There are no timers or animated typing, so the interaction also works without motion.'
      ],
      takeaway:'Streaming improves visibility, not truth. Own the request lifecycle and keep partial drafts distinct from completed drafts.',
      example:{title:'A partial draft must remain visibly partial.',input:'Three authored fragments: “Thanks for ”, “reporting this. ”, “Our team will review it.”',paths:[{title:'Receive all three',detail:'The simulated stream completes successfully.',result:'Complete draft; human review still required',tone:'accent'},{title:'Stop or dispose after one',detail:'Only “Thanks for ” has arrived.',result:'Partial draft; further chunks are blocked',tone:'neutral'}],explanation:'The simulated component releases its controls on real unmount through the returned cleanup function. A real Blazor component uses its disposal lifecycle to cancel the server operation.'},
      experiment:'lm-streaming',exercise:'Start, receive chunks, stop, and dispose the simulated component. Mount a fresh component to compare a complete draft with a partial one.',
      quiz:{question:'The user navigates away during streaming. What should the component do?',options:[{text:'Continue updating the old screen until the reply is complete.',why:'The component has been disposed. Continuing work can waste resources and access invalid state.'},{text:'Call StateHasChanged inside Dispose to show one final chunk.',why:'Rendering from Dispose is unsupported. Teardown should cancel work and release resources.'},{text:'Cancel its active request and guard continuations against updating disposed state.',why:'Correct. Cancellation and a disposed-state guard protect the request and component lifecycle.'}],answer:2},
      dotnet:{title:'Consume fragments on the server and render plain text.',text:'Illustrative .NET 10 Razor excerpt: use @rendermode InteractiveServer, inject IDraftReplyService as Drafts, and display @draft as text. Complete event wiring and error UI belong in the lab. A local source is disposed in finally, after its operation unwinds; Dispose only signals cancellation.',code:'// Fields: string draft = "", message = ""; bool disposed;\n// CancellationTokenSource? active;\nasync Task GenerateAsync()\n{\n    if (disposed || active is not null) return;\n    using var requestCts = new CancellationTokenSource();\n    active = requestCts;\n    draft = "";\n    try\n    {\n        await foreach (var part in Drafts.StreamAsync(message, requestCts.Token))\n        {\n            if (disposed || requestCts.IsCancellationRequested) break;\n            draft += part;\n            await InvokeAsync(StateHasChanged);\n        }\n    }\n    catch (OperationCanceledException) when (requestCts.IsCancellationRequested)\n    { /* Mark stopped only if the component is still alive. */ }\n    finally { active = null; }\n}\nvoid Stop() => active?.Cancel();\npublic void Dispose() { disposed = true; active?.Cancel(); }',label:'Razor / C# · illustrative InteractiveServer lifecycle',contribution:'You can assemble a reviewable SupportDesk draft with honest loading and stop behavior.',next:'Run the draft-replies lab in free sample mode, then inspect the optional server provider only if you choose to configure it.',lab:true},reference:'lm-disposal'
    })
  ];
  return {references:{
    'lm-generation':{title:'OpenAI: Text generation',url:'https://developers.openai.com/api/docs/guides/text',note:'Optional provider background. Generated drafts still need application controls and human review.'},
    'lm-tokens':{title:'OpenAI: Counting tokens',url:'https://developers.openai.com/api/docs/guides/token-counting',note:'Model-specific counting guidance. Our browser budget is only a fictional teaching estimate.'},
    'lm-stream':{title:'OpenAI: Streaming API responses',url:'https://developers.openai.com/api/docs/guides/streaming-responses',note:'Official Responses SSE and typed event guidance for the optional server adapter.'},
    'lm-security':{title:'Microsoft Learn: Blazor security overview',url:'https://learn.microsoft.com/en-us/aspnet/core/blazor/security/?view=aspnetcore-10.0',note:'Review server and client trust boundaries. Never put provider secrets in browser-delivered assets.'},
    'lm-lifecycle':{title:'Microsoft Learn: Razor component lifecycle and cancelable work',url:'https://learn.microsoft.com/en-us/aspnet/core/blazor/components/lifecycle?view=aspnetcore-10.0',note:'Official cancellation guidance for work that must stop when a component is disposed.'},
    'lm-disposal':{title:'Microsoft Learn: Razor component disposal',url:'https://learn.microsoft.com/en-us/aspnet/core/blazor/components/component-disposal?view=aspnetcore-10.0',note:'Dispose resources, unsubscribe handlers, and avoid StateHasChanged during disposal.'}
  },lessons};
});

})(typeof globalThis !== 'undefined' ? globalThis : this, function (mlnet, language) {
  'use strict';
  const references = {
    ...mlnet.references,
    ...language.references,
    overview: { title: 'Microsoft Learn: AI in .NET', url: 'https://learn.microsoft.com/en-us/dotnet/ai/overview', note: 'Optional reading after this lesson. The course explains the terms you need here.' },
    ml: { title: 'Microsoft Learn: How ML.NET works', url: 'https://learn.microsoft.com/en-us/dotnet/machine-learning/how-does-mldotnet-work', note: 'See how data becomes a model and how a .NET application uses it. You do not need to run this guide yet.' },
    console: { title: 'Microsoft Learn: Create a .NET console app', url: 'https://learn.microsoft.com/en-us/dotnet/core/tutorials/with-visual-studio-code', note: 'Extra help with the console project used in our desktop lab.' }
  };
  const foundationLessons = [
    {
      id: 'ai-features', conceptId: 'ai-feature', title: 'What makes a feature an AI feature?', short: 'Recognize an AI feature', minutes: 8, prerequisites: [],
      objective: 'Tell the difference between code that follows a rule and a model that learns patterns.',
      summary: 'Start with a support inbox, not a new framework.',
      definition: ['AI', 'Software that uses models to recognize patterns or generate an output. In this course, we focus on models learned from examples.'],
      paragraphs: [
        'Imagine you are building SupportDesk, an ASP.NET Core application where customers ask for help. A message arrives: “I paid twice. Can you return one payment?” Your first feature is to send that message to the right team.',
        'You could write a C# rule: if the message contains “refund”, send it to Billing. You chose the word and wrote the decision yourself. That is ordinary application logic.',
        'Another approach uses a model: a reusable component that has learned patterns from examples. It could suggest Billing even when the customer never writes “refund”. This is where machine learning, a common approach to AI, can help.',
        'Your .NET application still receives the request, validates it, checks permissions, and saves the result. The model supplies one suggested answer inside that application. It does not replace the application.'
      ],
      takeaway: 'Ask how the decision is made. A page with a chat bubble is not automatically AI.',
      example: {
        title: 'One message. Two ways to route it.',
        input: 'I paid twice. Can you return one payment?',
        paths: [
          { title: 'A rule you wrote', detail: 'Contains “refund”? No.', result: 'General queue', tone: 'neutral' },
          { title: 'A learned model', detail: 'Recognizes a payment problem.', result: 'Billing suggestion', tone: 'accent' }
        ],
        explanation: 'The rule checks an exact condition. A model may recognize a similar meaning. Its answer can still be wrong, so a staff member can correct it. The model result shown here is an authored teaching example.'
      },
      experiment: 'sort-features',
      exercise: 'Choose which implementation uses a learned model. Notice that the technology behind the decision matters more than the appearance of the screen.',
      quiz: { question: 'Which feature uses a learned model?', options: [
        { text: 'An API rejects a request with an empty email address.', why: 'This is a condition a developer can specify exactly. Validation does not require a learned model.' },
        { text: 'A service suggests a support category using patterns learned from past messages.', why: 'Exactly. The decision uses patterns learned from examples, rather than only conditions you wrote.' },
        { text: 'A Blazor page displays a chat bubble.', why: 'A chat bubble is a UI element. It could display a fixed message, a human reply, or a model response.' }
      ], answer: 1 },
      dotnet: { title: 'Keep the application. Add a suggestion.', text: 'Think of the model as a dependency of your application service. The API handles HTTP; a service requests a suggestion; your code decides what happens next.', code: 'Customer message\n    ↓\nASP.NET Core endpoint → Validate request\n    ↓\nApplication service → Ask model for a suggestion\n    ↓\nBlazor inbox → Staff member reviews the category', label: 'Application flow · conceptual example', contribution: 'You can identify where a model might help the SupportDesk inbox.', next: 'Decide which responsibilities should stay ordinary C#.' },
      reference: 'overview'
    },
    {
      id: 'rules', conceptId: 'deterministic-rule', title: 'When ordinary C# rules are enough', short: 'Keep exact rules in C#', minutes: 10, prerequisites: ['ai-features'],
      objective: 'Choose an explicit C# rule when the requirement has an exact, testable answer.',
      summary: 'Reliable AI features begin with reliable ordinary code.',
      definition: ['Deterministic', 'Given the same input and relevant state, the code follows the same steps and produces the same result.'],
      paragraphs: [
        'SupportDesk must reject an empty message. You know precisely what “empty” means: null, no characters, or only spaces. You do not need examples of past messages to decide this.',
        'Write that requirement as ordinary C#. The result should be predictable and easy to test. Checking permissions, calculating totals, and enforcing a refund policy also belong in code with explicit rules.',
        'A keyword rule can be a useful first version of message routing. It is cheap and easy to explain. But “refund” and “return my payment” have different characters even though they may express the same request.',
        'Do not add AI because a rule has a limitation. First ask whether the limitation matters. A few categories with stable wording might need only a maintained rule. Many variations of natural language may justify a model.'
      ],
      takeaway: 'Use a model for ambiguity. Use explicit code for requirements that must be enforced exactly.',
      example: { title: 'An empty message has an exact answer.', input: 'Message: three spaces', paths: [
        { title: 'Your requirement', detail: 'A message must contain visible text.', result: 'Reject the request', tone: 'neutral' },
        { title: 'Your C# implementation', detail: 'string.IsNullOrWhiteSpace(message)', result: 'true', tone: 'accent' }
      ], explanation: 'There is nothing to predict. A unit test can prove this condition for empty strings, spaces, and real messages. A model would add uncertainty to an exact requirement.' },
      experiment: 'keyword',
      exercise: 'Change a message and the keyword. Watch which queue an exact rule chooses. Try “Please return my payment” with the keyword “refund”.',
      quiz: { question: 'Which responsibility should stay an explicit rule?', options: [
        { text: 'Guessing the subject of an unfamiliar customer message.', why: 'Unfamiliar wording can be ambiguous. A learned model might help here, with evaluation and review.' },
        { text: 'Writing a shorter version of a long conversation.', why: 'Many summaries are possible. This is a generation task, rather than a single exact condition.' },
        { text: 'Checking that the signed-in user is allowed to issue a refund.', why: 'Correct. Authorization is an enforceable application rule. A model suggestion must never bypass it.' }
      ], answer: 2 },
      dotnet: { title: 'Start with a baseline you can test.', text: 'A baseline is the simplest working approach you will compare a later model against. Our first desktop lab builds this routing rule as a console app. No AI account is needed.', code: 'static string Route(string message)\n{\n    if (string.IsNullOrWhiteSpace(message))\n        return "Rejected";\n\n    return message.Contains("refund",\n        StringComparison.OrdinalIgnoreCase)\n        ? "Billing"\n        : "General";\n}', label: 'C# · extract from the runnable lab', contribution: 'You establish input validation and a predictable routing baseline.', next: 'Learn what goes inside the model component.', lab: true },
      reference: 'console'
    },
    {
      id: 'models', conceptId: 'model', title: 'What a model does', short: 'Understand a model', minutes: 9, prerequisites: ['rules'],
      objective: 'Identify a model’s input, its output, and the application decisions outside its responsibility.',
      summary: 'A model is a component with an input and an output.',
      definition: ['Model', 'A reusable component containing learned patterns. Your application gives it input and receives a prediction or generated output.'],
      paragraphs: [
        'In C#, you already work with components through contracts. A tax service accepts an amount and returns a calculation. You can use the service without knowing every internal step.',
        'You can think about a model boundary in the same way. A support-category model accepts message text and returns a proposed label such as Billing, Account, or Technical. A label is simply a category name.',
        'The difference is how the model acquired its behavior. In machine learning, a training process learned patterns from data. The saved model contains that learned information. It is not a database of guaranteed answers.',
        'A model that returns Billing has not issued a refund or changed a database row. Your application still validates the response, applies authorization and business rules, and decides whether to show a suggestion or take a permitted action.'
      ],
      takeaway: 'A prediction is data coming back from a component. Your application owns its consequences.',
      example: { title: 'Give the model a small, clear job.', input: 'I cannot sign in after changing my password.', paths: [
        { title: 'Inside the model boundary', detail: 'Message text in; category out.', result: 'Account', tone: 'accent' },
        { title: 'Outside that boundary', detail: 'Application decides what to display.', result: 'Suggest Account to staff', tone: 'neutral' }
      ], explanation: 'The category is a fixed illustrative response here. A real integration would also handle errors, unsupported output, and slow responses. It would not send private account details without an appropriate reason.' },
      experiment: 'model-boundary',
      exercise: 'Choose a message and inspect the input, illustrative model output, and application responsibility. The examples do not run a real model.',
      quiz: { question: 'The model suggests Billing. What does that prove?', options: [
        { text: 'The application is authorized to issue a refund.', why: 'No. A category suggestion does not grant permission. Authorization must be checked by the application.' },
        { text: 'The model returned a category that the application must validate and handle.', why: 'Correct. Treat the response as input to your application, not as permission or a guaranteed fact.' },
        { text: 'The customer has definitely been charged twice.', why: 'No. Classifying a message does not verify transactions. That requires authoritative business data.' }
      ], answer: 1 },
      dotnet: { title: 'An interface makes the boundary visible.', text: 'This is an illustrative contract, not an implemented model. Later, a real ML.NET model or provider adapter can sit behind a service boundary. Cancellation and validation remain application concerns.', code: 'public record CategorySuggestion(string Category);\n\npublic interface IMessageClassifier\n{\n    Task<CategorySuggestion> SuggestAsync(\n        string message,\n        CancellationToken cancellationToken);\n}', label: 'C# · illustrative contract', contribution: 'You separate a category suggestion from saving or acting on a request.', next: 'Understand how the model gets its behavior before your API calls it.' },
      reference: 'ml'
    },
    {
      id: 'training', conceptId: 'training-vs-inference', title: 'Training and using a model are different', short: 'Training vs. using a model', minutes: 10, prerequisites: ['models'],
      objective: 'Distinguish learning from examples during training from producing a result during inference.',
      summary: 'The learning happens in one process. Your app uses the result in another.',
      definition: ['Inference', 'Using a trained model to produce an output for an input. It does not mean that the model is being retrained.'],
      paragraphs: [
        'Suppose you have past support messages with categories chosen by staff. Each pair is a labelled example: message text plus the category you want the model to learn to predict.',
        'Training is a separate process that uses examples to adjust a model’s learned patterns. After training, you save a model artifact: a file or other reusable representation of the learned model.',
        'Inference is using that saved model with a new message. Your ASP.NET Core service can ask it for a category without running the training process again for every HTTP request.',
        'Correcting a suggestion in the inbox does not automatically retrain a model. You could store that correction as reviewed data for a future training run. That feedback pipeline must be built deliberately. When using an existing provider model, your application commonly performs inference without training that model itself.'
      ],
      takeaway: 'Training changes learned patterns. Inference uses the current learned patterns.',
      example: { title: 'Two processes, connected by a saved model.', input: 'Past examples: “refund please” → Billing; “password reset” → Account', paths: [
        { title: 'Training process', detail: 'Learn from labelled past examples.', result: 'Saved category model', tone: 'neutral' },
        { title: 'Application request', detail: 'New message → saved model.', result: 'Category prediction', tone: 'accent' }
      ], explanation: 'Saving corrected categories can improve a later dataset, but the model changes only when an appropriate update process runs. Training and inference can happen on different machines and at different times.' },
      experiment: 'training-sort',
      exercise: 'Sort the actions into training, inference, or collecting feedback. Look for whether learned patterns are changing, being used, or merely being recorded.',
      quiz: { question: 'A user changes a suggested category. What happens to the model automatically?', options: [
        { text: 'Nothing necessarily changes; storing feedback and retraining require an implemented process.', why: 'Correct. A UI correction is not a training run. You need a deliberate process to collect, review, train, and evaluate updates.' },
        { text: 'The model immediately learns the correction forever.', why: 'A correction changes application data. It does not automatically change the model’s learned patterns.' },
        { text: 'Every later HTTP request must now retrain the model.', why: 'Training and inference are separate. Your service usually reuses a trained model for requests.' }
      ], answer: 0 },
      dotnet: { title: 'Separate the training tool from the web service.', text: 'Later in this course, an ML.NET console project trains a small classifier. Your application then loads the resulting model for inference. This outline describes responsibilities; it is not a runnable training sample yet.', code: 'SupportDesk.Training       // Console project\n  Read reviewed examples\n  Train and evaluate a model\n  Save model.zip\n\nSupportDesk.Api            // ASP.NET Core project\n  Load model.zip\n  Receive a new message\n  Return a category suggestion', label: 'Project responsibilities · conceptual outline', contribution: 'You know where training belongs and what a future feedback feature must do.', next: 'Check why a trained model can still make mistakes.' },
      reference: 'ml'
    },
    {
      id: 'predictions', conceptId: 'prediction-error', title: 'Why predictions can be wrong', short: 'Expect and measure mistakes', minutes: 12, prerequisites: ['training'],
      objective: 'Explain why a model prediction needs evaluation and an appropriate response to mistakes.',
      summary: 'A useful suggestion can still be an incorrect suggestion.',
      definition: ['Evaluation', 'Checking a model’s outputs against examples or criteria that tell you whether it is useful for your task.'],
      paragraphs: [
        'A support model learned from examples, not from every possible customer message. New wording, unclear requests, and patterns missing from training data can lead to a wrong category.',
        'Consider “My refund button crashes.” The word refund is about Billing, but the actual problem might be Technical. Even a person may need more context. The right design allows correction instead of treating the first suggestion as a fact.',
        'To evaluate a classifier, compare its predictions with reviewed categories on examples that were not used to train it. This helps reveal how it behaves on new data. Do not judge it only by examples it has already learned from.',
        'The cost of a mistake matters. A wrong inbox category might cause a short delay. An incorrect automatic refund changes money. Start with suggestions and human review; keep exact business rules in control of consequential actions.'
      ],
      takeaway: 'Measure errors on new examples, then design the application around their consequences.',
      example: { title: 'A plausible category can miss the actual problem.', input: 'My refund button crashes whenever I click it.', paths: [
        { title: 'Illustrative model output', detail: 'Focuses on the word “refund”.', result: 'Billing', tone: 'neutral' },
        { title: 'Reviewed category', detail: 'The customer reports a software failure.', result: 'Technical', tone: 'accent' }
      ], explanation: 'One failure does not make every model useless. It gives you a concrete case to include in evaluation and a reason to let staff change a suggestion.' },
      experiment: 'evaluate',
      exercise: 'Reveal five illustrative predictions, compare them with reviewed labels, and inspect the mistakes. These are authored examples, not a benchmark for a real model.',
      quiz: { question: 'How should you first evaluate your category model?', options: [
        { text: 'Run only the same messages used to train it.', why: 'That can hide poor behavior on new inputs. Keep reviewed examples separate for evaluation.' },
        { text: 'Accept every suggestion because the model has finished training.', why: 'Training produces a model, not a guarantee. New inputs and ambiguous messages can still cause errors.' },
        { text: 'Compare predictions with reviewed labels on held-out messages and inspect mistakes.', why: 'Correct. “Held-out” means set aside from training. Inspecting failures also tells you which safeguards the UI needs.' }
      ], answer: 2 },
      dotnet: { title: 'Keep suggestions editable.', text: 'Use separate fields for the model suggestion and the category accepted by staff. This makes the decision visible and preserves evidence for later evaluation. The record below is an illustrative data shape.', code: 'public record ReviewedCategory(\n    string SuggestedCategory,\n    string AcceptedCategory,\n    string ReviewedBy);\n\n// SuggestedCategory: "Billing"\n// AcceptedCategory:  "Technical"\n// ReviewedBy:        "demo-agent"', label: 'C# · illustrative review record', contribution: 'You plan a reviewable suggestion instead of an irreversible automatic decision.', next: 'Choose the smallest suitable approach for each feature.' },
      reference: 'ml'
    },

(function(root, factory) {
